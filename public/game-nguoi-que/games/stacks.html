<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cần Cẩu Xếp Hộp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  button:focus, button:focus-visible { outline: none; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px 14px; display: grid; gap: 14px; }
  .tally { display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .ballrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  #tracker { display: flex; gap: 8px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--faint); position: relative; transition: background .2s, border-color .2s, transform .2s; }
  .dot.next { border-color: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
  .dot.fly { background: var(--faint); border-color: var(--faint); }
  .dot.made { background: var(--ink); border-color: var(--ink); }
  .dot.ok { background: #c4c4c4; border-color: #a3a3a3; }
  .dot.swish { background: var(--butter-hi); border-color: var(--amber); }
  .dot.miss { border-color: #e4e4e4; }
  .dot.miss::after { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 1.5px; background: var(--faint); transform: translate(-50%, -50%) rotate(-45deg); border-radius: 2px; }
  @keyframes pulse { 50% { transform: scale(1.22); } }
  #ballLabel { font-variant-numeric: tabular-nums; }
  #height { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; transition: color .3s; }
  #height .unit { font-size: 13px; color: var(--muted); }
  #height .sep { color: var(--faint); }
  #hM { font-size: 16px; color: var(--muted); }
  #height.record, #height.record #hM { color: var(--amber); }
  #hBoxes { display: inline-block; transform-origin: left bottom; }
  #hBoxes.bump { animation: bump .35s ease; }
  .minis { display: flex; justify-content: space-between; margin: 0 0 28px; }
  .minis .v { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .minis .label { margin-top: 6px; }
  #streak {
    font-size: 14px; color: var(--amber); background: var(--butter-soft); border-radius: 8px; padding: 4px 10px;
    box-shadow: 0 0 0 1px rgba(180, 83, 9, .14); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s;
  }
  #streak.on { opacity: 1; transform: none; }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 12px; }
    #score { font-size: 38px; }
    #tracker { gap: 6px; }
    .dot { width: 13px; height: 13px; }
  }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .btn.busy svg { display: none; }
  .btn.busy::after { content: ''; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--ink); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 24px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #stAcc { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  .shots { display: flex; justify-content: space-between; margin-bottom: 28px; }
  .shots .dot { width: 18px; height: 18px; border-width: 2px; }
  .shots .dot.miss::after { width: 10px; height: 2px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #ffffff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) { .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; } }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>

<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="tally">
      <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
      <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="ballrow">
      <div id="height"><span id="hBoxes">0</span><span class="unit">hộp</span><span class="sep">·</span><span id="hM">0.2 m</span></div>
      <div class="label" id="ballLabel">Độ cao</div>
    </div>
  </div>
  <div id="streak"></div>
</div>

<div id="hint" class="hidden"><span>Chạm để thả hộp</span><span class="kbd-only">hoặc</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13.5h14v7H5z"/><path d="M7 6.5h10v7H7z"/><path d="M10.6 6.5v2.6h2.8V6.5"/><path d="M12 3.5v-1"/></svg></div>
    <h1 class="title">Cần Cẩu Xếp Hộp</h1>
    <div class="keys"><kbd>Chạm</kbd> để thả hộp đang đung đưa</div>
    <p class="tag">Xếp cao nhất có thể. Rơi một hộp là thua.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chơi</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label">Hết lượt</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Hộp đã xếp</div></div>
      <div><div id="stAcc">0 m</div><div class="label">Độ cao</div></div>
    </div>
    <div class="minis">
      <div><div class="v" id="endPts">0</div><div class="label">Điểm</div></div>
      <div><div class="v" id="endPerf">0</div><div class="label">Hoàn hảo</div></div>
      <div><div class="v" id="endChain">0</div><div class="label">Chuỗi dài nhất</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Chơi lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>

<div id="toast"></div>
<script>
const G = 1017;
const TX = 330;
const UNIT = 74;
const GAP = 22;
const SLING = 15;
const CABLE = 270;
const CARRY = 0.15;
const PERFECT = 3.5, GOOD = 11;
const TIPK = 0.5;
const PALLET = { w: 88, h: 12 };
const LIFT = { x0: 104, x1: 228 };
const FX = 160;
const MAST = { x0: 500, x1: 520 };
const VIEW = { x0: 78, x1: 578, y0: -318, y1: 26 };
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const PAL = { floor: '#fafafa', white: '#ffffff', tape: 'rgba(20,20,20,0.06)' };

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const BASE = {
  face: 1, flick: 0,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.aim = mk({ head: [3, -120], chest: [1, -95], hF: [16, -86], eF: [7, -73], hB: [-4, -56], eB: [-6, -77] });
P.press = mk({ head: [5, -117], chest: [3, -93], hip: [-1, -62], kF: [22, -35], kB: [11, -35], hF: [18, -80], eF: [8, -68], hB: [-3, -55], eB: [-6, -75], flick: 1 });
P.watch = mk({ head: [9, -115], chest: [5, -92], hip: [-1, -63], kF: [23, -36], kB: [11, -36], hF: [19, -80], eF: [10, -68], hB: [0, -56], eB: [-4, -76] });
P.pump = mk({ head: [1, -123], chest: [0, -98], hip: [0, -66], hF: [17, -139], eF: [19, -117], hB: [-5, -57], eB: [-8, -77], flick: 0 });
P.nod = mk({ head: [5, -118], chest: [2, -95], hF: [15, -83], eF: [6, -70], hB: [-4, -56], eB: [-6, -77] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const WORDS = ['BOOKS', 'MISC', 'KITCHEN', 'TOYS', 'MUGS', 'RECORDS', 'LAMP', 'SHOES', 'PLATES', 'JUNK', 'VINYL', 'TOOLS'];
const FEATS = [['arrows', 'word'], ['fragile', 'label'], ['handle', 'word'], ['arrows', 'label'], ['fragile', 'word'], ['handle', 'label'], ['arrows', 'fragile'], ['label', 'word']];
function swingFor(i) {
  return i < 10 ? 100 + 8 * i : Math.min(430, 180 + 4.8 * (i - 10));
}
function makeSpec(rng, i) {
  const r = rng();
  const heavyP = i >= 8 ? Math.min(0.2, 0.06 + (i - 8) * 0.005) : 0;
  const crateP = i > 0 ? 0.16 : 0;
  const awkP = clamp((i - 12) / 45, 0, 0.4);
  let w, h, crate = false, heavy = false;
  if (r < heavyP) {
    heavy = true;
    w = 46 + rng() * 10;
    h = 32 + rng() * 6;
  } else if (r < heavyP + crateP) {
    crate = true;
    w = 48 + rng() * 10;
    h = 38 + rng() * 8;
  } else if (r < heavyP + crateP + awkP) {
    const tall = rng() < 0.5;
    w = tall ? 34 + rng() * 8 : 78 + rng() * 10;
    h = tall ? 44 + rng() * 10 : 22 + rng() * 5;
  } else {
    w = 52 - Math.min(10, i * 0.25) + rng() * 22;
    h = 30 + rng() * 12;
  }
  const A = Math.min(100, 48 + 1.6 * i) * (0.92 + rng() * 0.16);
  const windP = i >= 12 ? Math.min(0.4, 0.15 + (i - 12) * 0.01) : 0;
  const wind = rng() < windP ? (rng() < 0.5 ? -1 : 1) * (45 + rng() * Math.min(75, 20 + (i - 12) * 3)) : 0;
  return {
    w: Math.round(w), h: Math.round(h), crate, heavy, wind,
    feats: FEATS[Math.floor(rng() * FEATS.length)],
    word: WORDS[Math.floor(rng() * WORDS.length)],
    j: [(rng() - 0.5) * 1.2, (rng() - 0.5) * 1.4, (rng() - 0.5) * 1.2, (rng() - 0.5) * 1.4, (rng() - 0.5) * 0.8, (rng() - 0.5) * 0.8],
    flip: rng() < 0.5,
    side: rng() < 0.5,
    A,
    T: (2 * Math.PI * A) / (swingFor(i) * (0.95 + rng() * 0.1)),
  };
}
</script>

<script>
const $ = (id) => document.getElementById(id);
const cv = $('c');
let ctx = cv.getContext('2d');
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0, focusY: -170 };
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('t') || Q.has('sim') || Q.has('seed') || Q.has('still');
const SIM = Q.has('sim');

const store = {

    console.log(`judge ${idx} ${kind} t=${clock.toFixed(2)}`);
  }

  if (kind === 'perfect') {

    round.perfects++;
    life.perfects++;
    round.bestStreak = Math.max(round.bestStreak, round.streak);
    mult = round.streak >= 6 ? 3 : round.streak >= 3 ? 2 : 1;
    pts = 3 * mult;

    round.streak = 0;
    pts = kind === 'good' ? 2 : kind === 'ok' ? 1 : 0;
  }
  rec.pts = pts;
  if (kind !== 'fall') {
    round.stacked++;
    life.stacked++;
  }
  round.score += pts;
  if (kind === 'fall') {
    popup('đổ rồi!', '', false, true, x, y);
  } else {
    const subs = [];
    if (kind === 'perfect') {
      subs.push('PERFECT');
    }
    if (mult > 1) {
      subs.push('×' + mult);
    }
    popup('+' + pts, subs.join('  '), kind === 'perfect', false, x, y);
    const el = $('score');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  if (mult > 1 && (round.streak === 3 || round.streak === 6)) {
    SND.streak(round.streak);
  }
  me.clear();
  if (kind === 'perfect') {
    me.push({ pose: P.pump, d: 0.2, ez: 'soft' }, { d: 0.17 }, { pose: P.ready, d: 0.45, ez: 'soft' });
  } else if (kind === 'good') {
    me.push({ pose: P.nod, d: 0.14, ez: 'out' }, { pose: P.ready, d: 0.4, ez: 'soft' });
  } else if (kind === 'ok') {
    me.push({ pose: P.phew, d: 0.32, ez: 'soft' }, { d: 0.18 }, { pose: P.ready, d: 0.45, ez: 'soft' });
  } else {
    me.push({ pose: P.wince, d: 0.16, ez: 'out' }, { d: 1.6 }, { pose: P.ready, d: 0.6, ez: 'soft' });
  }
  updateHud();
  if (kind === 'fall') {

    return;
  }
  round.nextAt = clock + 0.4;
  if (state === 'drop') {
    state = 'wait';
  }
}

function drawBox(s, x, y, a, sq) {

  ctx.rotate(a);

    ctx.translate(0, hh);
    ctx.scale(1 + 0.05 * sq, 1 - 0.09 * sq);

function drawWind() {
  const k = clamp(Math.abs(wind.vis) / 100, 0, 1.2);
  if (k < 0.04) {
    return;
  }
  const dir = Math.sign(wind.vis);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(20,20,20,0.3)';
  ctx.lineWidth = 1.1;
  for (const w of wind.wisps) {
    const a = Math.min(1, w.t / 0.25, (w.life - w.t) / 0.3) * Math.min(1, k * 1.6);
    if (a <= 0) {
      continue;
    }
    ctx.globalAlpha = a;
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const u = i / 8;
      const x = w.x - dir * w.len * u, y = w.y + Math.sin(u * 5 + w.ph + clock * 6) * 1.6;
      if (i === 0) {

  const L = 30 * Math.min(1, 0.35 + k * 0.7);

  const ang = (dir > 0 ? 0 : Math.PI) + (dir > 0 ? droop : -droop) + Math.sin(clock * 9) * 0.06 * k;
  ctx.save();
  ctx.translate(ex, py);
  ctx.rotate(ang);
  const segs = 4;
  for (let i = segs - 1; i >= 0; i--) {
    const u0 = i / segs, u1 = (i + 1) / segs;
    const r0 = lerp(5, 2, u0), r1 = lerp(5, 2, u1);
    const wv = Math.sin(clock * 12 - i) * 0.8 * k;
    ctx.beginPath();
    ctx.moveTo(L * u0, -r0 + wv * u0);
    ctx.lineTo(L * u1, -r1 + wv * u1);
    ctx.lineTo(L * u1, r1 + wv * u1);
    ctx.lineTo(L * u0, r0 + wv * u0);
    ctx.closePath();
    inkShape(i % 2 ? COL.ink : PAL.white, 1.2);
  }
  ctx.restore();
  ctx.fillStyle = COL.muted;
  ctx.font = "400 9.5px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
  ctx.textAlign = 'center';

  ctx.restore();
}

// A back hand resting low under the shoulder hangs from a nearly straight arm, the way a relaxed arm does.
// Set hang: 0 on a pose when the back hand has to work there (it blends between poses like any number).
function relax(sh, t, amount) {
  const dx = t[0] - sh[0], dy = t[1] - sh[1];
  const d = Math.hypot(dx, dy);
  const want = (UARM + FARM) * 0.96;
  if (dy <= 0 || d < 1 || d >= want) {
    return t;
  }
  const w = (amount ?? 1) * Math.min(1, Math.max(0, (dy / d - 0.8) / 0.18));
  const k = w * w * (3 - 2 * w);
  const nd = d + (want - d) * k;
  return [sh[0] + (dx / d) * nd, sh[1] + (dy / d) * nd];
}
function reach(a, b, max) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.hypot(dx, dy);
  if (d <= max) {
    return b;
  }
  return [a[0] + (dx / d) * max, a[1] + (dy / d) * max];
}
function breathe(p, amt) {
  if (!amt) {
    return p;
  }
  const o = Object.assign({}, p);
  const up = (v, k) => [v[0], v[1] - amt * k];
  o.head = up(p.head, 1);
  o.chest = up(p.chest, 0.85);
  o.hF = up(p.hF, 0.6);
  o.hB = up(p.hB, 0.6);
  return o;
}
const prevJ = {};
function mirrorJoint(a, b, j) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  const t = ((j[0] - a[0]) * dx + (j[1] - a[1]) * dy) / L2;
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return [2 * px - j[0], 2 * py - j[1]];
}
function ikC(key, a, b, l1, l2, hint, bend) {
  const j = ik(a, b, l1, l2, hint, bend);
  if (bend) {
    prevJ[key] = j;
    return j;
  }
  const pj = prevJ[key];
  if (pj) {
    const alt = mirrorJoint(a, b, j);
    const dj = Math.hypot(j[0] - pj[0], j[1] - pj[1]);
    const da = Math.hypot(alt[0] - pj[0], alt[1] - pj[1]);
    const dh = Math.hypot(j[0] - hint[0], j[1] - hint[1]) - Math.hypot(alt[0] - hint[0], alt[1] - hint[1]);
    if (da + 1.5 < dj && Math.abs(dh) < 4) {
      prevJ[key] = alt;
      return alt;
    }
  }
  prevJ[key] = j;
  return j;
}
function strokePath(pts, w, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.stroke();
}
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
function drawRemote(hand, elbow, press) {
  const ang = Math.atan2(hand[1] - elbow[1], hand[0] - elbow[0]);
  ctx.save();
  ctx.translate(hand[0], hand[1]);
  ctx.rotate(ang);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  line(8, -2, 13, -3.2);
  roundRect(-2.5, -3, 11, 6, 1.6);
  inkShape(PAL.white, 1.3);
  ctx.beginPath();
  ctx.arc(4.5, 0, 1.25, 0, Math.PI * 2);
  ctx.fillStyle = press > 0.5 ? COL.accent : COL.ink;
  ctx.fill();
  ctx.restore();
}
function drawFigure(a, x, y, breath, live) {
  const p = breathe(a.pose, breath);
  const face = p.face;
  const fs = face >= 0 ? 1 : -1;
  const af = Math.min(1, Math.abs(face));
  ctx.save();
  ctx.translate(x, y);
  const sx = p.chest[0] - p.hip[0], sy = p.chest[1] - p.hip[1];
  const sl = Math.hypot(sx, sy) || 1;
  const u = [sx / sl, sy / sl];
  const n = [-u[1], u[0]];
  const sideOff = 6.2 * (1 - af);
  const shF = [p.chest[0] + n[0] * sideOff - u[0], p.chest[1] + n[1] * sideOff - u[1]];
  const shB = [p.chest[0] - n[0] * sideOff - u[0], p.chest[1] - n[1] * sideOff - u[1]];
  const solve = live ? ikC : (k, aa, bb, l1, l2, h, bd) => ik(aa, bb, l1, l2, h, bd);
  const kF = solve('kF', p.hip, p.fF, THIGH, SHIN, p.kF, KNEE_BEND);
  const kB = solve('kB', p.hip, p.fB, THIGH, SHIN, p.kB, KNEE_BEND);
  const handF = reach(shF, p.hF, UARM + FARM);
  const handB = reach(shB, relax(shB, p.hB, p.hang), UARM + FARM);
  const eF = solve('eF', shF, handF, UARM, FARM, p.eF, ARM_BEND);
  const eB = solve('eB', shB, handB, UARM, FARM, p.eB, ARM_BEND);
  const hd = [p.head[0] - p.chest[0], p.head[1] - p.chest[1]];
  const hl = Math.hypot(hd[0], hd[1]) || 1;
  const hc = [p.chest[0] + (hd[0] / hl) * 20.5, p.chest[1] + (hd[1] / hl) * 20.5];
  strokePath([shB, eB, handB], ARM, FAR);
  strokePath([p.hip, kB, p.fB], LIMB, FAR);
  strokePath([[p.hip[0] + u[0], p.hip[1] + u[1]], [p.chest[0] + u[0] * 0.5, p.chest[1] + u[1] * 0.5]], TORSO, COL.fig);
  strokePath([p.hip, kF, p.fF], LIMB, COL.fig);
  ctx.fillStyle = COL.fig;
  ctx.beginPath();
  ctx.arc(hc[0], hc[1], HEAD_R, 0, Math.PI * 2);
  ctx.fill();
  if (a.remote) {
    drawRemote(handF, eF, p.flick);
  }
  const arm = [shF, eF, handF];
  if (p.flick > 0.05) {
    const ang = Math.atan2(handF[1] - eF[1], handF[0] - eF[0]) - 1.2 * fs;
    arm.push([handF[0] + Math.cos(ang) * 4 * p.flick, handF[1] + Math.sin(ang) * 4 * p.flick]);
  }
  strokePath(arm, ARM, COL.fig);
  ctx.restore();
}

function drawPopups() {
  for (const p of popups) {
    if (p.t < 0) {
      continue;
    }
    const k = p.t / 1.1;
    const a = k < 0.12 ? k / 0.12 : clamp(1 - (k - 0.55) / 0.45, 0, 1);
    const y = p.y - 26 - 24 * EASE.out(Math.min(1, k * 1.3));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    if (p.quiet) {
      ctx.fillStyle = COL.muted;
      ctx.font = "400 13px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
      ctx.fillText(p.text, p.x, y + 6);
    } else {
      const sc = 1 + 0.22 * Math.max(0, 1 - k * 5);
      ctx.translate(p.x, y);
      ctx.scale(sc, sc);
      ctx.fillStyle = p.hot ? COL.accent : COL.ink;
      ctx.font = "400 24px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
      ctx.fillText(p.text, 0, 0);
      if (p.sub) {
        ctx.font = "400 10px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
        ctx.letterSpacing = '1.5px';
        ctx.fillText(p.sub, 0, 12);
      }
    }
    ctx.restore();
  }
}
function drawBits() {
  for (const b of bits) {
    const a = Math.max(0, 1 - b.t / b.life);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.r);
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w / 2, -0.9, b.w, 1.8);
    ctx.restore();
  }
}

let bgOff = -1;
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  const S = cam.s * camZ;
  const ax = (VIEW.x0 + VIEW.x1) / 2;
  const sxa = cam.x + ax * cam.s, sya = cam.y + VIEW.y1 * cam.s;
  const R = camR + camDip;
  const ox = sxa - ax * S, oy = sya + (R - VIEW.y1) * S;
  ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
  const xl = -ox / S - 2, xr = (cw - ox) / S + 2, yt = -oy / S - 2, yb = (ch - oy) / S + 2;
  const off = (((12 + R * S) % 24) + 24) % 24;
  if (Math.abs(off - bgOff) > 0.05) {
    bgOff = off;
    document.body.style.backgroundPosition = `12px ${off.toFixed(2)}px`;
  }
  drawGround(xl, xr);
  drawMast(yt, yb, hook.jibY - 3, hook.jibY);
  const top = topSupport();
  const topW = toWorld(top.cx, top.y)[1];
  drawHeights(Math.max(yt, hook.jibY + 14), yb, tower.boxes.length ? topW : null, round ? round.prevBest : life.bestHeight, round ? round.passedAt : -1);
  for (const b of bodies) {
    const hgt = -b.y - b.s.h / 2;
    if (hgt < 120) {
      const k = Math.max(0, 1 - hgt / 120);
      contactShadow(b.x, b.s.w * 0.45 * (0.5 + 0.5 * k), 0.16 * k);
    }
  }
  drawPallet();
  drawTowerBoxes(tower.boxes, tower.a);
  drawLift(lift.y);
  contactShadow(FX + 4, 13, 0.12, lift.y - 1.2);
  drawFigure(me, FX, lift.y + 7, me.breath * (Math.sin(clock * 2.1) + 1) * 0.5, true);
  drawRails(lift.y);
  drawWind();
  drawHook();
  for (const b of bodies) {
    drawBox(b.s, b.x, b.y, b.a, 0);
  }
  drawBits();
  drawPopups();
}

const bot = Q.get('bot') ? { kind: Q.get('bot'), at: null, rng: mulberry(99) } : null;
function gauss(r) {
  const u = Math.max(1e-9, r()), v = r();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function botTick() {
  if (mode !== 'play' || state !== 'ready') {
    bot.at = null;
    return;
  }
  if (bot.at === null) {
    const pro = bot.kind === 'pro';
    const sd = pro ? 0.025 : bot.kind === 'mid' ? 0.045 : parseFloat(bot.kind) || 0.07;
    const target = topSupport().cx;
    const s = hook.box;
    const tf = Math.sqrt((2 * GAP) / G);
    let prev = null;
    for (let t = clock + 0.3; t < clock + 4; t += 1 / 240) {
      const H = hookAt(t);
      let x = hangPose(H, s).x;
      if (pro) {
        x += CARRY * hook.len * Math.cos(H.th) * H.thd * tf + 0.5 * hook.wind * tf * tf;
      }
      const f = x - target;
      if (prev !== null && Math.sign(f) !== Math.sign(prev)) {
        bot.at = t + gauss(bot.rng) * sd;
        break;
      }
      prev = f;
    }
    if (bot.at === null) {
      bot.at = clock + 1;
    }
  }
  if (clock >= bot.at) {
    bot.at = null;
    down();
  }
}

function update(dt) {
  if (slow > 0) {
    slow -= dt;
    dt *= 0.4;
  }
  clock += dt;
  if (bot) {
    botTick();
  }
  me.update(dt);
  const wantBreath = ((state === 'ready' || state === 'lower') && me.idle) || mode !== 'play' ? 1 : 0;
  me.breath += (wantBreath - me.breath) * Math.min(1, dt * 3);

  hook.jibY += (jibTarget() - hook.jibY) * Math.min(1, dt * 4);
  if (hook.phase === 'lower') {
    hook.k = Math.min(1, hook.k + dt / 0.85);
    hook.len = lerp(36, CABLE, EASE.out(hook.k));
    if (hook.k >= 1) {
      hook.phase = 'hang';
      hook.joltV += 18;
      if (state === 'lower') {
        state = 'ready';
        updateHud();
      }
    }
  } else if (hook.phase === 'retract') {
    hook.k = Math.min(1, hook.k + dt / 0.75);
    hook.len = lerp(CABLE, 36, EASE.in(hook.k));
    hook.A *= Math.exp(-dt * 0.8);
    if (hook.k >= 1) {
      hook.phase = 'up';
    }
  }
  hook.joltV += (-320 * hook.jolt - 12 * hook.joltV) * dt;
  hook.jolt += hook.joltV * dt;

  const sub = Math.max(2, Math.ceil(dt * 480)), h = dt / sub;
  for (let i = 0; i < sub; i++) {
    stepTower(h);
    stepRock(h);
    stepBodies(h);
  }
  for (const b of tower.boxes) {
    b.sq = Math.max(0, b.sq - dt * 7);
    b.dx *= Math.exp(-dt * 22);
  }

  const lt = liftTarget();
  lift.y += clamp((lt - lift.y) * Math.min(1, dt * 2.6), -dt * 140, dt * 140);

  let zT = 1, rT = Math.max(0, cam.focusY - topSupport().y);
  if ((state === 'fallen' && clock - doneAt > 0.35) || mode === 'over') {
    const need = (VIEW.y1 - (topSupport().y - 70)) * cam.s;
    const avail = cam.y + VIEW.y1 * cam.s - 24;
    zT = Math.min(1, avail / need);
    rT = 0;
  }
  const zr = state === 'fallen' || mode === 'over' ? 1.7 : 2.4;
  camZ += (zT - camZ) * Math.min(1, dt * zr);
  camR += (rT - camR) * Math.min(1, dt * zr);
  updateWind(dt);
  camDipV += (-260 * camDip - 15 * camDipV) * dt;
  camDip += camDipV * dt;

  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t > 1.1) {
      popups.splice(i, 1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= 1 - Math.min(1, b.drag * dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.r += b.vr * dt;
    if (b.t > b.life) {
      bits.splice(i, 1);
    }
  }
  if (mode !== 'play') {
    return;
  }
  if (state === 'wait' && clock >= round.nextAt && hook.phase === 'up') {
    spawnBox();
    if (hook.wind) {
      SND.gust(Math.min(1, Math.abs(hook.wind) / 100));
    }
  }
  if (state === 'fallen' && clock - doneAt > 2.2 && (clock - doneAt > 5 || bodies.every((b) => b.sleep))) {
    endGame();
  }
}

function updateWind(dt) {
  const target = mode === 'over' || state === 'fallen' ? 0 : hook.wind;
  wind.vis += (target - wind.vis) * Math.min(1, dt * 1.5);
  const k = Math.abs(wind.vis) / 100;
  wind.acc += dt * k * 9;
  const S = cam.s * camZ;
  const top = -(cam.y + VIEW.y1 * cam.s) / S + VIEW.y1 - camR;
  const span = ch / S;
  while (wind.acc > 1) {
    wind.acc -= 1;
    const dir = Math.sign(wind.vis);
    wind.wisps.push({ x: dir > 0 ? VIEW.x0 - 40 + Math.random() * 200 : VIEW.x1 + 40 - Math.random() * 200, y: top + span * (0.08 + Math.random() * 0.75), t: 0, life: 1.1 + Math.random() * 0.8, len: 16 + Math.random() * 22, ph: Math.random() * 6 });
  }
  for (let i = wind.wisps.length - 1; i >= 0; i--) {
    const w = wind.wisps[i];
    w.t += dt;
    w.x += wind.vis * 2.6 * dt;
    if (w.t > w.life) {
      wind.wisps.splice(i, 1);
    }
  }
}

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.textBaseline = 'alphabetic';
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.boxes), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.font = font(30);
  ctx.fillStyle = COL.muted;
  ctx.fillText(res.boxes === 1 ? 'HỘP' : 'HỘP', 82, 386);
  ctx.letterSpacing = '-1px';
  ctx.fillStyle = COL.ink;
  ctx.font = font(104);
  ctx.fillText(meters(res.height), 76, 530);
  ctx.letterSpacing = '0px';
  const stats = [[String(res.score), 'SCORE'], [String(res.perfects), 'PERFECT'], [String(res.bestStreak), 'BEST CHAIN']];
  stats.forEach((st, i) => {
    const y = 700 + i * 150;
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.fillText(st[0], 82, y);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(st[1], 84, y + 40);
    ctx.letterSpacing = '0px';
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.letterSpacing = '3px';
  ctx.fillText('CẦN CẨU XẾP HỘP', 84, 1196);
  ctx.letterSpacing = '0px';

  const last = res.tower[res.tower.length - 1];
  const topY = last ? last.y - last.s.h / 2 : -PALLET.h;
  const span = Math.max(190, -topY + 40, -res.liftY + 140);
  const ground = 1262;
  const sc = Math.min(1.12, (ground - 60) / span);
  ctx.save();
  ctx.translate(1048 - 556 * sc, ground);
  ctx.scale(sc, sc);
  drawGround(TX - 1200, TX + 1200);
  drawMast(-1e5, 100, topY - 40, null);
  drawHeights(topY - 40, 40, last ? topY : null, 0, -1);
  for (const b of res.debris) {
    contactShadow(b.x, b.s.w * 0.45, 0.14);
  }
  drawPallet();
  drawTowerBoxes(res.tower, 0);
  drawLift(res.liftY);
  contactShadow(FX + 4, 13, 0.12, res.liftY - 1.2);
  drawFigure({ pose: res.isBest ? P.cheer : P.pump, remote: true }, FX, res.liftY + 7, 0, false);
  drawRails(res.liftY);
  for (const b of res.debris) {
    drawBox(b.s, b.x, b.y, b.a, 0);
  }
  ctx.restore();

  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  const btn = $('shareBtn');
  if (!res || btn.disabled) {
    return;
  }
  btn.disabled = true;
  const slow = setTimeout(() => btn.classList.add('busy'), 120);
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `keep-stacking-${res.boxes}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  } finally {
    clearTimeout(slow);
    btn.classList.remove('busy');
    btn.disabled = false;
  }
}

function runSim(n) {
  const kinds = ['perfect', 'good', 'ok'];
  const tot = { perfect: 0, good: 0, ok: 0 };
  const lens = [], scores = [];
  const reached = new Array(200).fill(0), fell = new Array(200).fill(0);
  for (let g = 0; g < n; g++) {
    startGame();
    for (let i = 0; i < 120 * 900 && mode === 'play' && round.dropped < 150; i++) {
      update(1 / 120);
    }
    const len = tower.boxes.length;
    for (let i = 0; i <= Math.min(199, round.dropped - 1); i++) {
      reached[i]++;
    }
    if (mode === 'play') {
      endGame();
    } else {
      fell[Math.min(199, round.dropped - 1)]++;
    }
    round.boxes.forEach((b) => {
      if (tot[b.res] !== undefined) {
        tot[b.res]++;
      }
    });
    lens.push(len);
    scores.push(round.score);
  }
  lens.sort((a, b) => a - b);
  scores.sort((a, b) => a - b);
  const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(arr.length * f))];
  const N = tot.perfect + tot.good + tot.ok;
  const pct = (v, d) => Math.round((100 * v) / Math.max(1, d)) + '%';
  let out = `bot=${bot.kind} games=${n}\n`;
  out += `boxes: mean ${(lens.reduce((a, b) => a + b, 0) / n).toFixed(1)}  p10 ${q(lens, 0.1)}  median ${q(lens, 0.5)}  p90 ${q(lens, 0.9)}  max ${lens[n - 1]}\n`;
  out += `score: median ${q(scores, 0.5)}  p90 ${q(scores, 0.9)}  max ${scores[n - 1]}\n`;
  out += 'landed: ' + kinds.map((k) => `${k} ${pct(tot[k], N)}`).join('  ') + '\n';
  out += 'fall hazard by box: ';
  for (let i = 0; i < 60; i += 5) {
    let r = 0, f = 0;
    for (let j = i; j < i + 5; j++) {
      r += reached[j];
      f += fell[j];
    }
    out += `${i + 1}-${i + 5}:${r ? ((100 * f) / r).toFixed(1) : '-'}%  `;
  }
  return out + '\n';
}

$('startFoot').innerHTML = lifetimeLine();
$('best').textContent = life.best;

window.__freeze = /[?&]still/.test(location.search);
if (window.__freeze) {
  const st = document.createElement('style');
  st.textContent = '*{transition:none!important;animation:none!important}';
  document.head.appendChild(st);
}
newRound();
spawnBox(true);
(function fastForward() {
  if (SIM) {
    const out = runSim(parseInt(Q.get('sim'), 10) || 100);
    document.body.innerHTML = `<pre id="sim">${out}</pre>`;
    return;
  }
  if (Q.get('play')) {
    startGame();
  }
  const T = parseFloat(Q.get('t') || '0');
  if (!T) {
    return;
  }
  const presses = (Q.get('p') || '').split(',').filter(Boolean).map((x) => parseFloat(x));
  let t = 0;
  while (t < T) {
    for (const pr of presses) {
      if (Math.abs(t - pr) < 0.5 / 120) {
        down();
      }
    }
    update(1 / 120);
    if (Q.has('render')) {
      render();
    }
    t += 1 / 120;
  }
  if (Q.get('sharecard') && lastResult) {
    window.__freeze = true;
    Promise.resolve().then(() => setTimeout(() => {
      document.body.innerHTML = '';
      const c = shareCanvas(lastResult);
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain';
      document.body.appendChild(c);
    }, 50));
  }
})();

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  if (document.body.contains(cv)) {
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
