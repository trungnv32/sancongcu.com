<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nhảy Qua Đường</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; white-space: nowrap; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 24px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  #zone { font-size: 18px; line-height: 1; white-space: nowrap; }
  #zone.pop { animation: bump .5s ease; }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none !important; } }
  @media (hover: hover) { .touch-only { display: none !important; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .chips { display: flex; gap: 6px; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .note { color: var(--soft); font-size: 13px; margin: 16px 0 0; text-align: center; }
  .note:empty { display: none; }
  #startCard .title { margin-bottom: 12px; }
  .zones { display: flex; justify-content: center; gap: 5px; margin: 0 0 8px; }
  .zones i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px #c9c9c9; }
  .zones i.on { background: var(--butter-hi); box-shadow: inset 0 0 0 1.4px var(--ink); }
  .result { display: flex; align-items: flex-end; gap: 30px; margin: 22px 0 10px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest, .mid { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #endWhy { font-size: 15px; color: var(--muted); margin: 0 0 22px; line-height: 1.45; }
  #endWhy b { color: var(--ink); }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 18px; }
    #score { font-size: 38px; }
    #zone { font-size: 16px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
  }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }

<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
    <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
    <div class="stat"><div id="zone">Phố Ngủ Gật</div><div class="label" id="zoneSub">Vùng 1</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span class="touch-only">Chạm để nhảy, vuốt để né ngang</span><kbd class="kbd-only">↑</kbd><span class="kbd-only">nhảy</span><kbd class="kbd-only">←</kbd><kbd class="kbd-only">→</kbd><span class="kbd-only">né ngang</span></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <h1 class="title">Nhảy Qua Đường</h1>
    <p class="tag"><span class="kbd-only">Phím mũi tên để nhảy và né ngang.</span><span class="touch-only">Chạm để nhảy, vuốt để né ngang.</span> Đừng để cục tẩy đuổi kịp.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chơi</span><kbd class="kbd-only">Space</kbd></button>
    </div>

  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endLabel">Hết lượt</div>
      <div class="chips"><span class="chip" id="endZoneChip" style="display:none">Vùng mới</span><span class="chip" id="endChip" style="display:none">Kỷ lục mới</span></div>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Điểm</div></div>
      <div><div id="endBest">0</div><div class="label">Kỷ lục</div></div>
      <div><div id="endRows" class="mid">0</div><div class="label">Hàng</div></div>
    </div>
    <p id="endWhy"></p>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Chơi lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'crossing';
const GAME = 'Hop Across';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', butterHi: '#fcd34d', butterSoft: '#fef3c7', umber: '#78350f', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const GOON = { ink: '#7c7c7c', far: '#bdbdbd', head: '#5f5f5f' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const FONT = (s) => `400 ${s}px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif`;
// ── Test modes ─────────────────────────────────────────────────────────────

const Q = new URLSearchParams(location.search);
const BOT = Q.has('bot');
const TEST = BOT || Q.has('still') || Q.has('autoplay');
window.__bot = BOT;
window.__freeze = Q.has('still');

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};
function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  return (r() + r() + r() - 1.5) / 1.5;
}
let rng = mulberry((Date.now() & 0xffff) ^ 0x5eed);
const pick = (arr, r) => arr[Math.floor((r || rng)() * arr.length)];


// ── View ───────────────────────────────────────────────────────────────────
// Lanes are rows of ROW world units; the camera follows the hero up the page.

const ROW = 56, COLW = 52, NCOL = 4, EDGE = NCOL * COLW;
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, cx: 0, cy: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 130 : 100;
  const bottom = 50;
  const sh = (ch - top - bottom) / (9.2 * ROW);
  const s = narrow ? Math.min(sh, cw / 490, 1.5) : Math.min(sh, (cw - 60) / 560, 1.5);
  cam.s = s;
  cam.cx = cw / 2;
  cam.cy = top + (ch - top - bottom) * 0.5;
}
function visHalf() {
  return cw / 2 / cam.s;
}

// ── Stick figure ───────────────────────────────────────────────────────────

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

const P = {};
P.ready = mk({ head: [3, -120], chest: [2, -95], hip: [0, -66], fF: [9, -8], kF: [15, -38], fB: [-7, -8], kB: [3, -38], hF: [13, -61], eF: [2, -78], hB: [8, -62], eB: [-3, -78], hang: 0 });
P.ready2 = mk({ head: [3, -118], chest: [2, -93] }, P.ready);
P.crouch = mk({ head: [6, -108], chest: [4, -83], hip: [0, -55], kF: [20, -31], kB: [8, -31], hF: [16, -50], eF: [6, -66], hB: [10, -48], eB: [0, -64] }, P.ready);
P.leap = mk({ head: [4, -124], chest: [3, -99], hip: [0, -68], fF: [12, -18], kF: [20, -44], fB: [-10, -14], kB: [0, -42], hF: [24, -74], eF: [12, -86], hB: [16, -70], eB: [4, -84] }, P.ready);
P.float = mk({ head: [2, -121], chest: [1, -96], hip: [0, -66], fF: [6, -14], kF: [12, -40], fB: [-6, -12], kB: [2, -40], hF: [10, -134], eF: [16, -114], hB: [4, -132], eB: [8, -114] }, P.ready);
P.float2 = mk({ fF: [10, -16], kF: [16, -42], fB: [-10, -14], kB: [-2, -42] }, P.float);
P.startle = mk({ head: [1, -121], chest: [1, -96], hip: [0, -66], hF: [30, -88], eF: [18, -98], hB: [28, -80], eB: [16, -92] }, P.ready);
P.help = mk({ head: [0, -121], chest: [0, -96], hip: [0, -66], hF: [18, -130], eF: [20, -110], hB: [8, -132], eB: [12, -112] }, P.ready);
P.help2 = mk({ hF: [24, -127], eF: [24, -108], hB: [4, -130], eB: [9, -111] }, P.help);
P.cheer = mk({ head: [2, -121], chest: [0, -96], hip: [0, -66], fF: [14, -8], fB: [-12, -8], kF: [16, -38], kB: [-4, -38], hF: [28, -132], eF: [22, -114], hB: [-20, -130], eB: [-16, -112] }, P.ready);

// Parade goons march with their hands loose.
const G = {};
G.walkA = mk({ head: [7, -118], chest: [4, -94], hip: [0, -64], fF: [20, -8], kF: [21, -36], fB: [-18, -9], kB: [-5, -37], hF: [18, -62], eF: [10, -80], hB: [0, -58], eB: [0, -78], hang: 1 });
G.walkP1 = mk({ head: [7, -120], chest: [4, -96], hip: [0, -66], fF: [2, -8], kF: [12, -37], fB: [4, -24], kB: [18, -46], hF: [12, -60], eF: [6, -78], hB: [6, -57], eB: [2, -77] }, G.walkA);
G.walkB = mk({ fF: [-18, -9], kF: [-5, -37], fB: [20, -8], kB: [21, -36], hF: [6, -58], eF: [2, -78], hB: [12, -61], eB: [6, -79] }, G.walkA);
G.walkP2 = mk({ head: [7, -120], chest: [4, -96], hip: [0, -66], fB: [2, -8], kB: [12, -37], fF: [4, -24], kF: [18, -46], hF: [12, -60], eF: [6, -78], hB: [6, -57], eB: [2, -77] }, G.walkA);
G.cycle = [G.walkA, G.walkP1, G.walkB, G.walkP2, G.walkA];

const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}
function blendPose(a, b, k) {
  const o = { face: lerp(a.face, b.face, k), hang: lerp(a.hang ?? 1, b.hang ?? 1, k) };
  for (const j of PTS) {
    o[j] = [lerp(a[j][0], b[j][0], k), lerp(a[j][1], b[j][1], k)];
  }
  return o;
}

// A body follows its target pose on a critically damped spring, so a pose change never snaps.
function newBody(pose) {
  const b = { pose: { face: pose.face ?? 1, hang: pose.hang ?? 1 }, vel: {}, id: Math.random().toString(36).slice(2) };
  for (const j of PTS) {
    b.pose[j] = [pose[j][0], pose[j][1]];
    b.vel[j] = [0, 0];
  }
  return b;
}
function follow(b, target, w, dt) {
  const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
  const h = dt / steps, k = w * w, c = 2 * w;
  for (let s = 0; s < steps; s++) {
    for (const j of PTS) {
      const p = b.pose[j], v = b.vel[j], t = target[j];
      v[0] += (k * (t[0] - p[0]) - c * v[0]) * h;
      v[1] += (k * (t[1] - p[1]) - c * v[1]) * h;
      p[0] += v[0] * h;
      p[1] += v[1] * h;
    }
  }
  b.pose.face = target.face ?? 1;
  b.pose.hang = lerp(b.pose.hang, target.hang ?? 1, Math.min(1, dt * 10));

function pickType(r, Z, d) {
  const prev = lanes.get(r - 1), prev2 = lanes.get(r - 2);
  let run = 0;
  for (let i = 1; i < 6; i++) {
    const L = lanes.get(r - i);
    if (!L || GROUNDS.has(L.type)) {
      break;
    }
    run++;
  }
  const maxRun = 2 + Math.floor(d * 2.6);
  if (run >= maxRun) {
    return Z.ground;
  }
  const w = Object.assign({}, Z.mix);
  if (prev && GROUNDS.has(prev.type) && prev2 && GROUNDS.has(prev2.type)) {
    w[Z.ground] *= 0.15;
  }
  if (!prev || !GROUNDS.has(prev.type)) {
    delete w.pads;
  }
  if (prev && prev.type === 'rail' && prev2 && prev2.type === 'rail') {
    delete w.rail;
  }
  if (prev && prev.type === 'belt') {
    w.belt = (w.belt || 0) * 0.5;
  }
  let sum = 0;
  for (const k in w) {
    sum += w[k];
  }
  let x = rng() * sum;
  for (const k in w) {
    x -= w[k];
    if (x <= 0) {
      return k;
    }
  }
  return Z.ground;
}

function fillMovers(L, make, gap) {
  let x = -WRAP + rng() * 160;
  while (x < WRAP - 80) {

    m.x = x;

    m.id = Math.random();
    L.movers.push(m);
    x += m.w + gap();

}

function roadKind(Z, d) {

const VSPD = { car: 1, van: 0.92, truck: 0.82, bus: 0.78, icecream: 0.6, tractor: 0.55, roller: 0.45, mixer: 0.75, rover: 0.9, buggy: 1.15 };

  } else if (r === 2) {

  if (prev && prev.speed && rng() < 0.7) {
    L.dir = -prev.dir;

  if (GROUNDS.has(type)) {

    L.speed = rand(62, 105) * mul;
    const kinds = [];
    fillMovers(L, () => {
      const k = roadKind(Z, d);
      kinds.push(k);
      return { kind: k, w: VW[k], spd: VSPD[k], tone: rng() };
    }, () => rand(r < 14 ? 220 : 150, lerp(520, 230, d) + (r < 14 ? 120 : 0)));

    const slow = Math.min(...L.movers.map((m) => m.spd));

    const cols = new Set();

    for (let i = 0; i < extra; i++) {

function groundLane(L, prev) {
  const r = L.r, Z = L.Z;
  L.flowers = [];
  for (let i = 0; i < 5; i++) {
    L.flowers.push({ x: (hash(r, i) - 0.5) * 1400, k: hash(i, r) });
  }
  if (L.arch >= 0 || r === 0) {
    return;
  }
  const protect = new Set();
  if (prev) {
    const open = [];
    for (let c = -NCOL; c <= NCOL; c++) {
      if (!prev.blocks.has(c)) {
        open.push(c);
      }
    }
    for (let i = 0; i < 3 && open.length; i++) {
      protect.add(open.splice(Math.floor(rng() * open.length), 1)[0]);
    }
    if (prev.type === 'pads') {
      for (const m of prev.movers) {
        protect.add(Math.round((m.x + 21) / COLW));

  }
  if (r <= 1) {
    protect.add(0);
  }
  const n = r < 0 ? 1 : Math.floor(rng() * (2 + L.d * 2.4));
  for (let i = 0; i < n; i++) {
    const c = Math.floor(rng() * (2 * NCOL + 1)) - NCOL;
    if (!protect.has(c)) {
      L.blocks.set(c, pick(Z.blocks));

    for (let c = -NCOL; c <= NCOL; c++) {

// ── Movers and hazards ─────────────────────────────────────────────────────

function wrapX(x, L) {
  const s = L.span;
  return ((((x + WRAP) % s) + s) % s) - WRAP;
}
function moverX(L, m, t) {
  if (!t || !L.speed) {
    return m.x;
  }
  return wrapX(m.x + L.dir * L.speed * m.k * t * worldK(), L);
}
function overlaps(x, x0, w, margin) {
  return x + HW + margin > x0 + 5 && x - HW - margin < x0 + w - 5;
}
function trainX(L, t) {
  const tr = L.tr, k = worldK();
  if (tr.on) {
    return tr.x + L.dir * TRAIN_V * t * k;
  }
  if (t * k < tr.t) {
    return null;
  }
  const x0 = L.dir > 0 ? -1100 - TRAIN_LEN : 1100;
  return x0 + L.dir * TRAIN_V * (t * k - tr.t);
}
// What would kill a hero standing at x on lane L, t seconds from now.
function killerAt(L, x, t, margin) {
  if (!L) {
    return null;
  }
  if (KILL.has(L.type)) {
    for (const m of L.movers) {
      if (overlaps(x, moverX(L, m, t), m.w, margin)) {
        return m;
      }
    }
  }
  if (L.cross) {
    const c = L.cross;
    if (overlaps(x, c.x + c.dir * c.speed * t * worldK(), c.w, margin)) {
      return c;
    }
  }
  if (L.type === 'rail') {
    const tx = trainX(L, t);
    if (tx !== null && overlaps(x, tx, TRAIN_LEN, margin)) {
      return { kind: 'train' };
    }
  }
  for (const me of meteors) {
    if (me.r === L.r && !me.hit && Math.abs(x - me.x) < COLW * 0.6 && me.dur - me.t <= t + 0.04 && me.dur - me.t >= t - 0.3) {
      return { kind: 'meteor' };
    }
  }
  return null;
}
function duckUp(m, t) {
  if (m.kind !== 'duck') {
    return true;
  }
  if (m.dv === 'under') {
    return m.dt < t;
  }
  if (m.dv === 'bob') {
    return m.dt > t;
  }
  return true;
}
function platformAt(L, x, t, tol) {
  const e = tol ?? -3;
  for (const m of L.movers) {
    const mx = moverX(L, m, t);
    if (x >= mx - e && x <= mx + m.w + e && duckUp(m, t)) {
      return m;
    }
  }
  return null;
}

function updateLane(L, dt) {
  const k = worldK();
  if (L.speed && L.type !== 'belt') {
    for (const m of L.movers) {
      if (m.kind === 'cow') {
        m.st -= dt * k;
        if (m.st <= 0) {
          m.k = m.k ? 0 : 1;
          m.st = m.k ? rand(2, 5) : rand(0.7, 1.6);
          if (!m.k && Math.abs(L.r - hero.row) < 3 && Math.abs(m.x - hero.x) < 300 && rng() < 0.5) {
            SND.moo();
          }
        }
      }
      if (m.kind === 'duck') {
        m.dt -= dt * k;
        if (m.dt <= 0) {
          m.dv = m.dv === 'swim' ? 'bob' : m.dv === 'bob' ? 'under' : 'swim';
          m.dt = m.dv === 'bob' ? 0.8 : m.dv === 'under' ? 1.4 : rand(3, 6);
          if (m.dv === 'bob' && Math.abs(L.r - hero.row) < 4) {
            SND.quack();
          }
        }
      }
      m.x = wrapX(m.x + L.dir * L.speed * m.k * dt * k, L);
    }
  }
  if (L.tr) {
    const tr = L.tr;
    if (!tr.on) {
      tr.t -= dt * k;
      if (tr.t < 1.3 && !tr.warned) {
        tr.warned = true;
      }
      if (tr.t <= 0) {
        tr.on = true;
        tr.x = L.dir > 0 ? -1100 - TRAIN_LEN : 1100;
        if (Math.abs(L.r - hero.row) < 6 && mode === 'play') {
          SND.horn();
        }
      }
    } else {
      tr.x += L.dir * TRAIN_V * dt * k;
      if ((L.dir > 0 && tr.x > WRAP) || (L.dir < 0 && tr.x + TRAIN_LEN < -WRAP)) {
        tr.on = false;
        tr.warned = false;
        tr.t = rand(2.6, 6) / L.mul;
      }
    }
  }
  if (L.cross) {
    const c = L.cross;
    c.x += c.dir * c.speed * dt * k;
    c.ph += dt * k * c.speed / 26;
    c.drum -= dt;
    if (c.kind === 'goons' && c.drum <= 0) {
      c.drum = 0.42;
      if (Math.abs(L.r - hero.row) < 5 && mode === 'play') {
        SND.drum(0.8);
      }
    }
    const far = visHalf() + 260;
    if ((c.dir > 0 && c.x > far) || (c.dir < 0 && c.x + c.w < -far)) {
      L.cross = null;
    }
  }
}

// ── Hero ───────────────────────────────────────────────────────────────────

function heroPos() {
  if (hero.float) {
    const f = hero.float, k = EASE.io(clamp(f.t / f.dur, 0, 1));
    return [lerp(f.fx, f.tx, k), lerp(f.fr, f.tr, k), f.h];
  }
  const k = clamp(hero.t, 0, 1);
  return [lerp(hero.fx, hero.tx, k), lerp(hero.fr, hero.tr, k), hero.slide ? 0 : Math.sin(Math.PI * k) * hero.arc];
}
function heroRowNow() {
  return hero.t < 0.5 ? hero.fr : hero.tr;
}
function isMoon(r) {
  return !!zoneOf(r).moon;
}

function move(dr, dc, slide) {
  if (mode !== 'play' || !hero.alive || hero.float) {
    return false;
  }
  if (hero.t < 1) {
    if (!slide && !hero.slide) {
      buffered = [dr, dc];
    }
    return false;
  }
  const cur = lanes.get(hero.row);
  const tr = hero.row + dr;
  const T = lanes.get(tr);
  if (!T) {
    return false;
  }
  const curWet = cur && WET.has(cur.type);
  let tx;
  if (dc) {
    tx = curWet ? hero.x + dc * COLW : colOf(hero.x) * COLW + dc * COLW;
    if (Math.abs(tx) > EDGE + 1) {
      bump();
      return false;
    }
  } else {
    tx = WET.has(T.type) ? hero.x : colOf(hero.x) * COLW;
  }
  if (GROUNDS.has(T.type) && T.blocks.has(colOf(tx)) && !WET.has(T.type)) {
    bump();
    return false;
  }
  if (dc) {
    hero.face = dc;
  }
  hero.fr = hero.row;
  hero.fx = hero.x;
  hero.tr = tr;
  hero.tx = tx;
  hero.t = 0;
  hero.slide = !!slide;
  const moon = isMoon(tr);
  hero.dur = slide ? 0.1 : moon ? 0.22 : 0.13;
  hero.arc = moon ? 34 : 15;
  hero.on = null;
  hero.idle = 0;
  if (slide) {
    SND.slide();
  } else {
    hopN++;
    SND.hop(Math.min(8, hopN % 9));
  }
  if (!life.seenHint && tr >= 4) {
    life.seenHint = true;
    save();
    $('hint').classList.add('hidden');
  }
  return true;
}

function bump() {
  hero.landT = 0;
  SND.bump();
}

function land() {
  hero.row = hero.tr;
  hero.x = hero.tx;
  hero.fr = hero.tr;
  hero.fx = hero.tx;
  hero.t = 1;
  hero.landT = 0;
  const L = lanes.get(hero.row);
  if (WET.has(L.type)) {
    const m = platformAt(L, hero.x, 0, 9);
    if (!m) {
      die(L.type === 'space' ? 'space' : 'drown');
      return;
    }
    hero.on = m;
    hero.x = hero.fx = hero.tx = clamp(hero.x, m.x + 5, m.x + m.w - 5);
    SND.land(m.kind === 'duck' ? 'duck' : m.kind === 'log' || m.kind === 'pad' ? 'wood' : 'soft');
  } else {
    hero.on = null;
    if (!hero.slide) {
      SND.land('soft');
    }
    if (L.type !== 'belt') {
      hero.safe = { row: hero.row, x: hero.x };
    }
    grab(L);
  }
  if (hero.row > maxRow) {
    maxRow = hero.row;
    const zi = zoneIdx(maxRow);
    if (zi > runZone && maxRow >= zoneStart(zi)) {
      enterZone(zi);
    }
    refreshScore();
  }
  hero.slide = false;
  const dir = hero.row - (hero.lastRow ?? hero.row);
  hero.lastRow = hero.row;
  if (L.type === 'ice' && !killerAt(L, hero.x, 0, 0)) {
    const dx = hero.x - (hero.prevX ?? hero.x);
    if (dir) {
      const N = lanes.get(hero.row + dir);
      if (N && N.type === 'ice') {
        hero.prevX = hero.x;
        move(dir, 0, true);
        return;
      }
    } else if (dx) {
      const s = Math.sign(dx);
      if (Math.abs(hero.x + s * COLW) <= EDGE + 1) {
        hero.prevX = hero.x;
        move(0, s, true);
        return;
      }
    }
  }
  hero.prevX = hero.x;
  if (hero.auto > 0) {
    hero.auto--;
    const N = lanes.get(hero.row + 1);
    if (N && GROUNDS.has(N.type) && !N.blocks.has(colOf(hero.x))) {
      move(1, 0, true);
      return;
    }
    hero.auto = 0;
  }
  if (buffered) {
    const b = buffered;
    buffered = null;
    move(b[0], b[1]);
  }
}

function grab(L) {
  const c = colOf(hero.x);
  const it = L.pick.get(c);
  if (!it) {
    return;
  }
  L.pick.delete(c);
  const [x, rF] = heroPos();
  const y = laneY(rF) - 40;
  if (it === 'box') {
    openBox(x, y);
    return;
  }
  const gold = it === 'gold';
  const pts = gold ? 20 : 3;
  bonus += pts;
  fishGot++;
  if (!BOT) {
    life.fish++;
  }
  SND.fish(gold);
  popup(gold ? 'Cá vàng!' : `+${pts}`, gold ? '+20' : '', true, x, y);
  burst(x, y + 20, gold ? 14 : 6);
  refreshScore();
}

const BOXES = [
  { k: 'balloon', w: 3 },
  { k: 'shield', w: 3 },
  { k: 'slowmo', w: 2 },
  { k: 'fishrain', w: 2 },
  { k: 'banana', w: 1.2 },
];
function openBox(x, y) {
  let s = BOXES.reduce((a, b) => a + b.w, 0) * rng();
  let k = 'shield';
  for (const b of BOXES) {
    s -= b.w;
    if (s <= 0) {
      k = b.k;
      break;
    }
  }
  SND.box();
  burst(x, y + 20, 12);
  if (k === 'balloon') {
    popup('Bóng bay!', 'BAY LÊN NÀO', true, x, y);
    startFloat('balloon', 5);
  } else if (k === 'shield') {
    hero.shield = true;
    popup('Bong bóng!', 'ĐƯỢC VA MỘT LẦN', true, x, y);
  } else if (k === 'slowmo') {
    slowT = 6;
    SND.slowmo();
    popup('Quay chậm!', 'MỌI THỨ CHẬM LẠI', true, x, y);
  } else if (k === 'fishrain') {
    let n = 0;
    for (let r = hero.row + 1; r < hero.row + 14 && n < 9; r++) {
      const L = lanes.get(r);
      if (L && GROUNDS.has(L.type)) {
        for (let c = -NCOL; c <= NCOL && n < 9; c++) {
          if (!L.blocks.has(c) && !L.pick.has(c) && rng() < 0.45) {
            L.pick.set(c, 'fish');
            n++;
          }
        }
      }
    }
    popup('Mưa cá!', 'NHẶT ĐI', true, x, y);
  } else {
    hero.auto = 3;
    popup('Chuối!', 'ÚI CHÀ', false, x, y);
  }
}

// Balloon and UFO rides carry the hero a few rows ahead and set them down on solid ground.
function startFloat(kind, rows) {
  let tr = hero.row, tx = colOf(hero.x) * COLW;
  for (let r = hero.row + rows; r < hero.row + rows + 10; r++) {
    const L = lanes.get(r);
    if (L && GROUNDS.has(L.type) && !L.cross) {
      let best = null;
      for (let c = -NCOL; c <= NCOL; c++) {
        if (!L.blocks.has(c) && (best === null || Math.abs(c * COLW - hero.x) < Math.abs(best * COLW - hero.x))) {
          best = c;
        }
      }
      if (best !== null) {
        tr = r;
        tx = best * COLW;
        break;
      }
    }
  }
  hero.float = { kind, t: 0, dur: kind === 'ufo' ? 2.2 : 2.8, fr: hero.row, fx: hero.x, tr, tx, h: 0 };
  hero.on = null;
  buffered = null;
  SND.rise();
}
function updateFloat(dt) {
  const f = hero.float;
  f.t += dt;
  const k = clamp(f.t / f.dur, 0, 1);
  f.h = (f.kind === 'ufo' ? 90 : 70) * Math.pow(Math.sin(Math.PI * k), 0.6);
  if (k >= 1) {
    hero.float = null;
    hero.afterUp = 0.2;
    hero.row = hero.fr = hero.tr = f.tr;
    hero.x = hero.fx = hero.tx = f.tx;
    hero.t = 1;
    hero.landT = 0;
    hero.inv = Math.max(hero.inv, 0.6);
    hero.safe = { row: hero.row, x: hero.x };
    SND.land('soft');
    dust(hero.x, laneY(hero.row), 24, 8);
    if (hero.row > maxRow) {
      maxRow = hero.row;
      const zi = zoneIdx(maxRow);
      if (zi > runZone) {
        enterZone(zi);
      }
      refreshScore();
    }
    grab(lanes.get(hero.row));
    if (ufo) {
      ufo.phase = 'go';
      ufo.t = 0;
    }
  }
}

function enterZone(zi) {
  runZone = zi;
  const fresh = zi + 1 > life.zones;
  if (fresh) {
    newZoneThisRun = true;
    if (!BOT) {
      life.zones = Math.min(99, zi + 1);
      save();
    }
  }
  banner = { zi, t: 0, fresh };
  SND.zone();
  kick(60);
  updateZoneHud(true);
}

const DEATH = {
  car: 'Bị ô tô cán dẹp', van: 'Bị xe tải nhỏ cán dẹp', truck: 'Bị xe tải cán dẹp', bus: 'Bị xe buýt cán dẹp',
  icecream: 'Bị xe kem cán qua', tractor: 'Bị máy cày đè bẹp', roller: 'Rolled flat by a steamroller',
  mixer: 'Bị xe trộn bê tông cán dẹp', rover: 'Bị xe tự hành mặt trăng cán qua', buggy: 'Bị xe mặt trăng cán qua',
  peng: 'Bị chim cánh cụt húc ngã', sheep: 'Bị đàn cừu giẫm', cow: 'Bị bò đá', goons: 'Trampled by a parade',
  train: 'Bị tàu hoả tông', meteor: 'Bị thiên thạch rơi trúng', drown: 'Rơi xuống nước', space: 'Lạc ngoài không gian',
  swept: 'Bị cuốn ra khỏi mép', belt: 'Đi băng chuyền rơi khỏi mép', erase: 'Bị tẩy mất!',
};
function die(kind, m) {
  if (!hero.alive || mode !== 'play') {
    return;
  }
  const [x, rF] = heroPos();
  if (kind !== 'erase' && (hero.inv > 0 || hero.float)) {
    return;
  }
  if (kind !== 'erase' && hero.shield) {
    hero.shield = false;
    hero.inv = 1.6;
    SND.pop();
    popup('Bụp!', 'BONG BÓNG CỨU BẠN', true, x, laneY(rF) - 40);
    burst(x, laneY(rF) - 20, 12);
    if (kind === 'drown' || kind === 'space' || kind === 'swept' || kind === 'belt') {
      hero.row = hero.fr = hero.tr = hero.safe.row;
      hero.x = hero.fx = hero.tx = hero.safe.x;
      hero.t = 1;
      hero.on = null;
    }
    return;
  }
  hero.alive = false;
  const what = kind === 'hit' ? (m && m.kind) || 'car' : kind;
  hero.why = DEATH[what] || 'Bốp!';
  const fling = what === 'train' || what === 'cow' || what === 'peng' || what === 'sheep' || what === 'goons' || what === 'meteor';
  const squash = false;
  const ty = what === 'drown' || what === 'space' ? what : what === 'erase' ? 'erase' : what === 'swept' || what === 'belt' ? 'fall' : fling ? 'fling' : squash ? 'splat' : 'fling';
  const L = lanes.get(Math.round(rF));
  hero.death = { ty, t: 0, x, rF, vx: (L && L.dir ? L.dir : 1) * (ty === 'fling' ? (what === 'train' ? 620 : 330) : 140), vy: ty === 'fling' ? -560 : -120, rot: 0, h: 0 };
  if (ty === 'splat') {
    SND.splat();
    kick(140);
  } else if (ty === 'drown' || ty === 'space') {
    if (ty === 'drown') {
      SND.splash();
      fxs.push({ ty: 'splash', x, y: laneY(rF) - 3, t: 0 });
      for (let i = 0; i < 14; i++) {
        const a = -Math.PI / 2 + (rng() - 0.5) * 2.2;
        const sp = rand(120, 260);
        bits.push({ x: x + (rng() - 0.5) * 16, y: laneY(rF) - 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 0, vr: 0, c: '#a9c3d6', t: 0, life: 0.75, w: 2 + rng() * 2.5, g: 700, drag: 0.6, round: true });
      }
    } else {
      SND.whoosh();
    }
  } else if (ty === 'erase') {
    SND.scrub();
  } else if (ty === 'fling') {
    SND.splat();
    kick(what === 'train' ? 220 : 150);
    fxs.push({ ty: 'star', x: x - (L && L.dir ? L.dir : 1) * 10, y: laneY(rF) - 26, t: 0, word: what === 'train' ? 'WHAM!' : what === 'meteor' ? 'BOOM!' : pick(['BONK!', 'BOINK!', 'THUD!']), big: what === 'train' || what === 'meteor' });
    dust(x, laneY(rF), 30, 10);
  } else {
    SND.splat();
    kick(120);
  }
  buzz(50);
  SND.lose();
}

function updateHero(dt) {
  hero.landT += dt;
  hero.inv = Math.max(0, hero.inv - dt);
  let want = P.ready, w = 22;
  const armsUp = !hero.alive || hero.float;
  hero.upT = armsUp ? (hero.upT || 0) + dt : 0;
  if (!hero.alive) {
    const D = hero.death;
    D.t += dt;
    if (D.ty === 'fling' || D.ty === 'fall') {
      D.vy += 900 * dt;
      D.x += D.vx * dt;
      D.h -= D.vy * dt;
      D.rot += dt * 9 * Math.sign(D.vx || 1);
      want = blendPose(P.help, P.help2, 0.5 + 0.5 * Math.sin(D.t * 18));
      w = 12;
    } else if (D.ty === 'drown') {
      want = blendPose(P.help, P.help2, 0.5 + 0.5 * Math.sin(D.t * 16));
      w = 12;
    } else if (D.ty === 'space') {
      D.h += dt * 60;
      D.rot += dt * 2;
      want = blendPose(P.float, P.float2, 0.5 + 0.5 * Math.sin(D.t * 5));
      w = 10;
    }
    if (hero.upT < 0.16 && D.ty !== 'splat') {
      want = P.startle;
    }
    follow(hero.body, want, w, dt);
    return;
  }
  hero.afterUp = Math.max(0, (hero.afterUp || 0) - dt);
  if ((hero.float && hero.upT < 0.16) || hero.afterUp > 0) {
    want = P.startle;
    w = 14;
  } else if (hero.float) {
    want = blendPose(P.float, P.float2, 0.5 + 0.5 * Math.sin(clock * 6));
    w = 10;
  } else if (hero.t < 1 && !hero.slide) {
    want = P.leap;
  } else if (hero.landT < 0.07) {
    want = P.crouch;
  } else if (mode === 'menu' || hero.t >= 1) {
    want = blendPose(P.ready, P.ready2, 0.5 + 0.5 * Math.sin(clock * 2.4));
  }
  follow(hero.body, want, w, dt);
}

// ── Events ─────────────────────────────────────────────────────────────────

function startEvent() {
  const Z = zoneOf(hero.row);
  const evs = Z.ev.slice();
  if (!evs.length) {
    return;
  }
  const ev = pick(evs);
  if (ev === 'ufo') {
    if (ufo || hero.float) {
      return;
    }
    ufo = { phase: 'come', t: 0, x: (rng() < 0.5 ? -1 : 1) * (visHalf() + 120), y: -hero.row * ROW - 330 };
    SND.ufo();
    popup('Cái gì thế kia?!', '', true, hero.x, laneY(hero.row) - 60);
    return;
  }
  const kind = ev === 'parade' ? 'goons' : ev === 'penguins' ? 'peng' : 'sheep';
  for (let r = hero.row + 2; r < hero.row + 6; r++) {
    const L = lanes.get(r);
    if (L && GROUNDS.has(L.type) && L.arch < 0 && !L.cross) {
      const dir = rng() < 0.5 ? -1 : 1;
      const n = kind === 'goons' ? 5 : kind === 'peng' ? 6 : 7;
      const gap = kind === 'goons' ? 30 : 34;
      const w = n * gap;
      const far = visHalf() + 60;
      L.cross = { kind, n, gap, w, dir, speed: kind === 'goons' ? 52 : kind === 'peng' ? 70 : 95, x: dir > 0 ? -far - w : far, ph: 0, drum: 0, hats: Array.from({ length: n }, () => pick(['party', 'tophat', 'cap', 'cowboy', 'chef', 'crown'])) };
      const label = kind === 'goons' ? 'Parade!' : kind === 'peng' ? 'Penguin parade!' : 'Stampede!';
      popup(label, `CÒN ${r - hero.row} HÀNG`, true, hero.x, laneY(hero.row) - 60);
      if (kind === 'sheep') {
        SND.baa();
      }
      return;
    }
  }
}

function updateUfo(dt) {
  const u = ufo;
  u.t += dt;
  const [hx, hr] = heroPos();
  const ty = laneY(hr) - 190;
  if (u.phase === 'come') {
    u.x = lerp(u.x, hx, Math.min(1, dt * 2.2));
    u.y = lerp(u.y, ty, Math.min(1, dt * 2.2));
    if (u.t > 1.8 && Math.abs(u.x - hx) < 14 && hero.alive && hero.t >= 1 && !hero.float) {
      u.phase = 'beam';
      u.t = 0;
    } else if (u.t > 5) {
      u.phase = 'go';
      u.t = 0;
    }
  } else if (u.phase === 'beam') {
    u.x = lerp(u.x, hx, Math.min(1, dt * 6));
    u.y = lerp(u.y, ty, Math.min(1, dt * 6));
    if (u.t > 0.5) {
      if (hero.alive && !hero.float && hero.t >= 1) {
        u.phase = 'carry';
        startFloat('ufo', 4);
        popup('Bị hút lên!', 'ĐI NHỜ', true, hx, ty + 80);
      } else {
        u.phase = 'go';
        u.t = 0;
      }
    }
  } else if (u.phase === 'carry') {
    u.x = hx;
    u.y = laneY(hr) - (hero.float ? hero.float.h : 0) - 150;
  } else {
    u.y -= dt * 400;
    u.x += dt * 260;
    if (u.t > 2) {
      ufo = null;
    }
  }
}

function updateMeteors(dt) {
  if (!isMoon(hero.row) || !hero.alive) {
    meteorT = 2;
  } else {
    meteorT -= dt * worldK();
    if (meteorT <= 0) {
      meteorT = rand(0.9, 2.0) / (1 + 0.15 * zoneOf(hero.row).lap);
      const r = hero.row + Math.floor(rng() * 4);
      const L = lanes.get(r);
      const c = rng() < 0.4 ? colOf(hero.x) : Math.floor(rng() * (2 * NCOL + 1)) - NCOL;
      if (L) {
        meteors.push({ r, x: c * COLW, t: 0, dur: 1.6, hit: false });
        SND.meteor();
      }
    }
  }
  for (const me of meteors) {
    me.t += dt * worldK();
    if (!me.hit && me.t >= me.dur) {
      me.hit = true;
      SND.boom();
      kick(70);
      burst(me.x, laneY(me.r), 14);
      dust(me.x, laneY(me.r), 40, 10);
      const [x, rF] = heroPos();
      if (hero.alive && Math.round(rF) === me.r && Math.abs(x - me.x) < COLW * 0.6 && !hero.float) {
        die('meteor');
      }
      const L = lanes.get(me.r);
      if (L && GROUNDS.has(L.type) && !L.blocks.has(colOf(me.x)) && !(hero.row === me.r && colOf(hero.x) === colOf(me.x))) {
        L.blocks.set(colOf(me.x), 'crater');
        L.pick.delete(colOf(me.x));
      }
    }
  }
  meteors = meteors.filter((m) => m.t < m.dur + 0.6);
}

// ── Game flow ──────────────────────────────────────────────────────────────

function buildWorld() {
  lanes = new Map();
  genTop = -8;
  meteors = [];
  fxs = [];
  ufo = null;
  for (let r = -8; r <= 22; r++) {
    genTop = r;
    makeLane(r);
  }
}

function startGame() {
  audio();
  mode = 'play';
  canRestart = false;
  runTime = 0;
  score = 0;
  maxRow = 0;
  bonus = 0;
  fishGot = 0;
  runZone = 0;
  newZoneThisRun = false;
  eraser = -3.4;
  eraserOn = false;
  slowT = 0;
  evT = rand(8, 13);
  banner = null;
  hopN = 0;
  buffered = null;
  resetHero();
  buildWorld();
  camR = 2;
  popups.length = 0;
  bits.length = 0;
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  refreshScore();
  updateZoneHud(false);
  banner = { zi: 0, t: 0, fresh: false };
}

function endGame() {
  mode = 'over';
  life.games++;
  const isBest = score > life.best;
  life.best = Math.max(life.best, score);
  save();
  lastResult = { score, isBest, rows: maxRow, zone: runZone, why: hero.why, fish: fishGot, time: runTime, freshZone: newZoneThisRun };
  window.__lastRun = lastResult;
  $('endLabel').textContent = hero.why;
  $('endScore').textContent = score;
  $('endBest').textContent = life.best;
  $('endRows').textContent = maxRow;
  $('endChip').style.display = isBest && score > 0 ? '' : 'none';
  $('endZoneChip').style.display = newZoneThisRun ? '' : 'none';
  const nextZi = runZone + 1;
  const left = zoneStart(nextZi) - maxRow;
  const nextName = nextZi < life.zones ? zoneTitle(nextZi) : '???';
  $('endWhy').innerHTML = `Tới <b>${zoneTitle(runZone)}</b>. ${nextName === '???' ? 'Vùng mới' : nextName} chỉ còn cách ${left} hàng.`;

  $('endCard').classList.add('show');

function lifetimeLine() {

  const dots = Array.from({ length: NZ }, (_, i) => `<i class="${i < found ? 'on' : ''}"></i>`).join('');
  let s = `<div class="zones">${dots}</div>${found} of ${NZ} zones found`;
  if (life.games) {

function refreshScore() {

// ── Bot ────────────────────────────────────────────────────────────────────
// Looks a short way ahead, waits for gaps, and reacts with a human delay. It slips up now and then.

const botRng = mulberry(31);

function laneSafe(r, x, t0, t1, margin) {
  const L = lanes.get(r);

    return false;
  }
  if (L.type === 'rail') {
    t1 += 0.5;
    margin += 40;
  }
  for (let t = t0; t <= t1; t += 0.05) {
    if (killerAt(L, x, t, margin)) {

    }
  }

}
function optionSafe(dr, dc) {
  const cur = lanes.get(hero.row);
  const r = hero.row + dr;
  const L = lanes.get(r);
  if (!L) {
    return false;
  }
  const curWet = WET.has(cur.type);
  let x = dc ? (curWet ? hero.x : colOf(hero.x) * COLW) + dc * COLW : WET.has(L.type) ? hero.x : colOf(hero.x) * COLW;
  if (Math.abs(x) > EDGE + 1 || (GROUNDS.has(L.type) && L.blocks.has(colOf(x)))) {
    return false;
  }
  const hop = isMoon(r) ? 0.24 : 0.14;
  if (WET.has(L.type)) {
    const m = platformAt(L, x, hop, -12);
    if (!m) {
      return false;
    }
    if (m.kind === 'duck' && (!duckUp(m, hop + 0.8))) {
      return false;
    }
    const drift = L.dir * L.speed * m.k * 0.45;
    const x2 = x + drift;
    const mx = moverX(L, m, hop + 0.45);
    if (Math.abs(x2) > EDGE + 16 || x2 < mx + 4 || x2 > mx + m.w - 4) {
      return false;
    }

    const N = lanes.get(r + dr);
    if (N && N.type === 'ice') {
      return laneSafe(r, x, 0.05, hop + 0.2, 10) && optionSafeAt(r + dr, x);
    }

  return laneSafe(r, x, hop * 0.4, hop + 0.95, 9);
}
function optionSafeAt(r, x) {

  return !!L && L.type !== 'rail' && laneSafe(r, x, 0.1, 0.8, 8);
}
function forwardOpen(c) {
  const N = lanes.get(hero.row + 1);
  if (!N) {
    return false;
  }
  if (GROUNDS.has(N.type)) {
    return !N.blocks.has(c);
  }
  if (N.type === 'pads') {
    return !!platformAt(N, c * COLW, 0, -6);
  }

}
function staySafe() {
  const L = lanes.get(hero.row);
  if (WET.has(L.type)) {

    if (!m || (m.kind === 'duck' && !duckUp(m, 0.9))) {
      return false;
    }
    const x2 = hero.x + L.dir * L.speed * m.k * 0.9;
    return Math.abs(x2) < EDGE - 4 && x2 > moverX(L, m, 0.9) + 2 && x2 < moverX(L, m, 0.9) + m.w - 2;
  }

    return false;
  }
  for (const me of meteors) {
    if (me.r === hero.row && !me.hit && Math.abs(me.x - hero.x) < COLW * 0.6) {
      return false;
    }
  }

}
function bot(dt) {
  botWait -= dt;
  if (botWait > 0 || !hero.alive || hero.t < 1 || hero.float) {
    return;
  }
  if (hero.row !== botRow) {
    botRow = hero.row;
    botBlunder = botRng() < (maxRow < 24 ? 0.008 : 0.025 + maxRow * 0.0003);
    const here = lanes.get(hero.row);
    const calm = here && GROUNDS.has(here.type);
    botWait = calm ? 0.22 + Math.abs(gauss(botRng)) * 0.25 : 0.08 + Math.abs(gauss(botRng)) * 0.08;
    return;
  }
  botWait = 0.1 + Math.abs(gauss(botRng)) * 0.12;
  if (botRng() < 0.025) {
    botWait += 0.6;
  }
  const behind = hero.row - eraser < 1.6;
  if (botBlunder && !optionSafe(1, 0)) {
    botBlunder = false;
    move(1, 0);
    return;
  }
  if (optionSafe(1, 0)) {
    move(1, 0);
    return;
  }
  const stay = staySafe();
  const cur = lanes.get(hero.row);
  if (stay && !WET.has(cur.type) && !forwardOpen(colOf(hero.x))) {
    const c0 = colOf(hero.x);
    let best = null;
    for (let d = 1; d <= 2 * NCOL && best === null; d++) {
      for (const s of [-1, 1]) {
        const c = c0 + s * d;
        if (Math.abs(c) <= NCOL && forwardOpen(c) && best === null) {
          let clear = true;
          for (let k = 1; k <= d; k++) {
            if (cur.blocks.has(c0 + s * k)) {
              clear = false;
            }
          }
          if (clear) {
            best = s;
          }
        }
      }

    if (best !== null && optionSafe(0, best)) {

    }

  if (!stay || behind) {
    for (const s of sides) {
      if (optionSafe(0, s)) {
        move(0, s);
        return;
      }
    }
    if (!stay && optionSafe(-1, 0) && !behind) {
      move(-1, 0);
      return;
    }
    if (behind || !stay) {

    }

}

// ── Update ─────────────────────────────────────────────────────────────────

function update(dt) {
  clock += dt;
  updateFx(dt);
  for (const f of fxs) {
    f.t += dt;
  }
  fxs = fxs.filter((f) => f.t < 0.9);
  slowT = Math.max(0, slowT - dt);
  for (const L of lanes.values()) {
    updateLane(L, dt);
  }
  updateHero(dt);
  if (ufo) {
    updateUfo(dt);
  }
  if (banner) {
    banner.t += dt;
    if (banner.t > 2.6) {
      banner = null;
    }
  }
  const [hx, hr] = heroPos();
  camR = lerp(camR, (hero.alive ? hr : hero.death.rF) + 2.1, Math.min(1, dt * 5));
  if (mode === 'menu') {
    return;
  }
  if (mode !== 'play') {
    return;
  }
  runTime += dt;
  if (!hero.alive) {
    if (hero.death.t > 1.25) {
      endGame();
    }
    return;
  }
  if (BOT) {
    bot(dt);
  }
  hero.idle += dt;
  if (hero.float) {
    updateFloat(dt);
  } else if (hero.t < 1) {
    hero.t += dt / hero.dur;
    if (hero.t >= 1) {
      land();
    }
  } else {
    const L = lanes.get(hero.row);
    if (L && WET.has(L.type)) {
      const m = hero.on;
      if (!m || !duckUp(m, 0) || !(hero.x >= m.x - 2 && hero.x <= m.x + m.w + 2)) {
        die(L.type === 'space' ? 'space' : 'drown');
      } else {
        hero.x += L.dir * L.speed * m.k * dt * worldK();
        hero.fx = hero.tx = hero.x;
        if (Math.abs(hero.x) > EDGE + 30) {
          die('swept');
        }
      }
    } else if (L && L.type === 'belt') {
      hero.x += L.dir * L.speed * dt * worldK();
      hero.fx = hero.tx = hero.x;
      if (Math.abs(hero.x) > EDGE + 26) {
        die('belt');
      }
    }
  }
  if (!hero.alive) {
    return;
  }
  if (!hero.float) {
    const L = lanes.get(heroRowNow());
    const [x] = heroPos();
    const m = killerAt(L, x, 0, 0);
    if (m) {
      die(m.kind === 'meteor' ? 'meteor' : m.kind === 'train' ? 'train' : 'hit', m);
      if (!hero.alive) {
        return;
      }
    }
    if (L && hero.t >= 1 && KILL.has(L.type)) {
      for (const mv of L.movers) {
        const gap = Math.max(mv.x + 5 - (hero.x + HW), hero.x - HW - (mv.x + mv.w - 5));
        if (gap > 0 && gap < 12 && mv.shaved !== hero.row && hero.inv <= 0) {
          const approaching = L.dir > 0 ? mv.x < hero.x : mv.x > hero.x;
          if (approaching) {
            mv.shaved = hero.row;
            bonus += 1;
            SND.close();
            popup('Sát nút!', '+1', true, hero.x, laneY(hero.row) - 50);
            refreshScore();
          }
        }
        if (mv.kind && VW[mv.kind] && !mv.honked && gap > 0 && gap < 120 && rng() < 0.01) {
          mv.honked = true;
          if (mv.kind === 'icecream') {
            SND.jingle();
          } else {
            SND.honk();
          }
        }
      }
    }
    if (L && L.type === 'rail' && !L.tr.on && L.tr.t < 1.3) {
      bellT -= dt;
      if (bellT <= 0) {
        bellT = 0.32;
        SND.bell();
      }
    } else {
      const N = lanes.get(hero.row + 1);
      if (N && N.type === 'rail' && !N.tr.on && N.tr.t < 1.3) {
        bellT -= dt;
        if (bellT <= 0) {
          bellT = 0.32;
          SND.bell();
        }
      }
    }
  }
  if (hero.t >= 1 && hero.row > 0) {
    eraserOn = true;
  }
  if (eraserOn) {
    const zi = zoneIdx(Math.max(0, hero.row));
    const lap = Math.floor(zi / NZ);
    const es = Math.min(1.25, (0.34 + 0.045 * (zi % NZ)) * (1 + 0.22 * lap));
    eraser += es * dt * worldK();
    eraser = Math.max(eraser, maxRow - 7);
    if (hr < eraser - 0.25 && !hero.float) {
      die('erase');
      return;
    }
    if (hr - eraser < 2) {
      scrubT -= dt;
      if (scrubT <= 0) {
        scrubT = 0.22;
        SND.scrub();
      }
    }
  }
  evT -= dt;
  if (evT <= 0) {
    evT = rand(9, 16);
    if (hero.row > 6) {
      startEvent();
    }
  }
  updateMeteors(dt);
  ensureLanes();
  if (hero.alive && hx) {
    hero.hx = hx;
  }
}

// ── Drawing ────────────────────────────────────────────────────────────────

const laneY = (rF) => -rF * ROW + 14;
let viewL = -600, viewR = 600;

const WATER = '#e4edf4', WATER_LINE = '#bccbd8';
function drawFloor(L) {

  const xl = viewL - 10, xr = viewR + 10;
  const t = L.type;

    if (!dn || dn.type !== 'road') {

    }
  } else if (WET.has(t)) {
    const space = t === 'space';
    ctx.fillStyle = space ? '#1d1e24' : WATER;
    ctx.fillRect(xl, y0, xr - xl, ROW);
    if (space) {
      for (let i = 0; i < 26; i++) {
        const sx = xl + hash(L.r, i) * (xr - xl), sy = y0 + hash(i, L.r) * ROW;
        ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.4 * Math.abs(Math.sin(clock * 2 + i))})`;
        ctx.fillRect(sx, sy, 1.6, 1.6);
      }
    } else {
      ctx.strokeStyle = WATER_LINE;
      ctx.lineWidth = 1.3;
      const off = (clock * 14 * (L.dir || 1)) % 60;
      for (let i = 0; i < 2; i++) {
        const yy = y0 + 16 + i * 22;
        ctx.beginPath();
        for (let x = Math.floor(xl / 60) * 60 - 60; x < xr + 60; x += 60) {
          const xx = x + off + i * 30;
          ctx.moveTo(xx, yy);
          ctx.quadraticCurveTo(xx + 7, yy - 4, xx + 14, yy);
        }
        ctx.stroke();
      }
    }
    const up = lanes.get(L.r + 1), dn = lanes.get(L.r - 1);
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.6;
    if (!up || !WET.has(up.type)) {

    }

      line(xl, y0 + ROW, xr, y0 + ROW);
    }
  } else if (t === 'rail') {
    ctx.fillStyle = '#d2d2d2';
    for (let x = Math.floor(xl / 24) * 24; x < xr; x += 24) {

    ctx.strokeStyle = COL.ink;

    ctx.lineWidth = 2.4;
    for (let i = 0; i < 8; i++) {
      const sx = xl + hash(L.r, i + 3) * (xr - xl);
      line(sx, y0 + 12, sx + 16, y0 + 40);
    }
    ctx.strokeStyle = '#b9c9d6';
    ctx.lineWidth = 1.3;

    if (!up || up.type !== 'ice') {
      line(xl, y0, xr, y0);
    }
    if (!dn || dn.type !== 'ice') {

  } else if (t === 'belt') {
    ctx.fillStyle = '#e2e2e2';

    ctx.lineWidth = 1.6;

    line(xl, y0 + ROW - 6, xr, y0 + ROW - 6);
    ctx.strokeStyle = '#b8b8b8';
    ctx.lineWidth = 2;
    const off = ((clock * L.speed * L.dir * worldK()) % 40 + 40) % 40;
    for (let x = Math.floor(xl / 40) * 40 - 40; x < xr + 40; x += 40) {

    } else if (t === 'crater') {
      ctx.fillStyle = '#f1f1f1';
      ctx.fillRect(xl, y0, xr - xl, ROW);
      ctx.strokeStyle = '#d8d8d8';
      ctx.lineWidth = 1.3;
      for (let i = 0; i < 4; i++) {

function drawCross(L, yb) {

function drawLaneThings(L) {
  const yb = laneY(L.r);
  const t = L.type;
  if (WET.has(t)) {
    for (const m of L.movers) {
      if (m.x > viewR + 20 || m.x + m.w < viewL - 20) {
        continue;
      }
      if (m.kind === 'log') {
        drawLog(m, m.x, yb);
      } else if (m.kind === 'pad') {
        drawPad(m, yb);
      } else if (m.kind === 'duck') {
        drawDucks(m, m.x, yb, L.dir);
      } else if (m.kind === 'rock') {
        drawRock(m, m.x, yb);
      }
    }
  }
  if (L.arch >= 0) {
    drawArch(L, yb);
  }
  for (const [c, k] of L.blocks) {
    drawBlock(k, c * COLW, yb);
  }
  if (GROUNDS.has(t)) {
    for (const s of [-1, 1]) {
      for (let c = NCOL + 1; c * COLW < Math.max(-viewL, viewR) + 40; c++) {
        if (hash(L.r, c * s) < 0.14) {
          drawBlock(L.Z.blocks[Math.floor(hash(c, L.r * s) * L.Z.blocks.length)], s * c * COLW, yb);
        }
      }
    }
    for (const [c, k] of L.pick) {
      if (k === 'box') {
        drawBox(c * COLW, yb - 18);
      } else {
        drawFish(c * COLW, yb - 14, k === 'gold');
      }
    }
  }
  if (KILL.has(t)) {
    for (const m of L.movers) {
      if (m.x > viewR + 20 || m.x + m.w < viewL - 20) {
        continue;
      }
      if (m.kind === 'peng') {
        for (let i = 0; i < m.n; i++) {
          drawPenguin(m.x + 15 + i * 36, yb, L.dir, i);
        }
      } else if (m.kind === 'cow') {
        drawCow(m, m.x, yb, L.dir);
      } else if (m.kind === 'sheep') {
        for (let i = 0; i < m.n; i++) {
          drawSheep(m.x + 17 + i * 34, yb, L.dir, clock * 14 + i);
        }
      } else {
        drawVehicle(m, L, m.x, yb);
      }
    }
  }
  if (t === 'rail') {
    drawTrain(L, yb);
  }
  if (L.cross) {
    drawCross(L, yb);
  }
}

function drawHero() {
  const [x, rF, h] = heroPos();
  const yb = laneY(rF);
  const D = hero.death;
  const opts = { flip: hero.face < 0, scale: FIG_S };
  if (D) {
    const dy = laneY(D.rF);
    if (D.ty === 'splat') {
      ctx.save();
      ctx.translate(D.x, dy);
      ctx.scale(1.5, 0.2);
      drawFigure(hero.body, 0, 8 * FIG_S, 0, opts);
      ctx.restore();
      return;
    }
    if (D.ty === 'drown') {
      const sink = Math.min(60, D.t * 70);
      ctx.save();
      ctx.beginPath();
      ctx.rect(D.x - 60, dy - 200, 120, 200 - 4);
      ctx.clip();
      drawFigure(hero.body, D.x, dy + 8 * FIG_S + sink, 0, opts);
      ctx.restore();
      ctx.strokeStyle = '#9cb4c6';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 2; i++) {
        const k = (D.t * 1.4 + i * 0.5) % 1;
        ctx.globalAlpha = 1 - k;
        ctx.beginPath();
        ctx.ellipse(D.x, dy - 4, 8 + k * 30, 3 + k * 6, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return;
    }
    if (D.ty === 'erase') {
      const k = clamp(D.t / 0.6, 0, 1);
      ctx.save();
      ctx.beginPath();
      ctx.rect(D.x - 60, dy - 200, 120, 200 - 60 * k * 1.1);
      ctx.clip();
      drawFigure(hero.body, D.x, dy + 8 * FIG_S, 0, opts);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(D.x, dy - D.h - 26);
    ctx.rotate(D.rot);
    const s = D.ty === 'space' ? Math.max(0.2, 1 - D.t * 0.5) : 1;
    ctx.scale(s, s);
    drawFigure(hero.body, 0, 26 + 8 * FIG_S, 0, opts);
    ctx.restore();
    return;
  }
  if (!hero.float) {
    ctx.fillStyle = 'rgba(252,211,77,0.55)';
    ctx.beginPath();
    ctx.ellipse(x, yb + 1, 15 - h * 0.12, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    contactShadow(x, 9 - h * 0.1, 0.12, yb);
  } else {
    contactShadow(x, 6, 0.08, yb);
  }
  ctx.save();
  ctx.translate(x, yb - h);
  let sx = 1, sy = 1;
  if (hero.t < 1 && !hero.slide) {
    sx = 0.92;
    sy = 1.08;
  } else if (hero.landT < 0.12) {
    const k = 1 - hero.landT / 0.12;
    sx = 1 + 0.14 * k;
    sy = 1 - 0.12 * k;
  }
  ctx.scale(sx, sy);
  if (hero.shield) {
    ctx.beginPath();
    ctx.arc(0, -30, 34 + Math.sin(clock * 5) * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(253,230,138,0.25)';
    ctx.fill();
  }
  if (hero.inv > 0 && Math.sin(clock * 40) > 0.3) {
    ctx.globalAlpha = 0.45;
  }
  const J = drawFigure(hero.body, 0, 8 * FIG_S, 0, opts);
  ctx.globalAlpha = 1;
  if (hero.float && hero.float.kind === 'balloon') {
    const hx = J.handF[0] * FIG_S * (hero.face < 0 ? -1 : 1), hy = 8 * FIG_S + J.handF[1] * FIG_S;
    const bx = hx + Math.sin(clock * 2) * 4, by = hy - 46;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.2;
    line(hx, hy, bx, by + 14);
    ctx.beginPath();
    ctx.ellipse(bx, by, 12, 15, 0, 0, Math.PI * 2);
    inkShape(COL.butterHi, 1.6);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx - 3, by - 4, 6, Math.PI * 1.1, Math.PI * 1.5);
    ctx.stroke();
  }
  if (hero.shield) {
    ctx.scale(1 / sx, 1 / sy);
    ctx.beginPath();
    ctx.arc(0, -30, 34 + Math.sin(clock * 5) * 1.2, 0, Math.PI * 2);
    ctx.strokeStyle = COL.accent;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, -30, 28, Math.PI * 1.15, Math.PI * 1.4);
    ctx.stroke();
  }
  ctx.restore();
}

let fog = null;
function nightAmount() {
  let a = 0;
  for (const r of [Math.floor(camR - 1), Math.ceil(camR + 1)]) {
    a += zoneOf(r).dark ? 0.5 : 0;
  }
  return a;
}
let nightK = 0;
function drawNight(top, bottom) {
  const want = nightAmount();
  nightK = lerp(nightK, want, 0.05);
  if (nightK < 0.02) {
    return;
  }
  if (!fog || fog.width !== cv.width || fog.height !== cv.height) {
    fog = document.createElement('canvas');
    fog.width = cv.width;
    fog.height = cv.height;
  }
  const f = fog.getContext('2d');
  f.setTransform(1, 0, 0, 1, 0, 0);
  f.clearRect(0, 0, fog.width, fog.height);
  f.fillStyle = `rgba(22,24,34,${0.86 * nightK})`;
  f.fillRect(0, 0, fog.width, fog.height);
  f.setTransform(ctx.getTransform());
  f.globalCompositeOperation = 'destination-out';
  const [x, rF, h] = heroPos();
  const hx = hero.death ? hero.death.x : x, hy = laneY(hero.death ? hero.death.rF : rF) - 24 - h;
  f.fillStyle = 'rgba(0,0,0,0.6)';
  f.beginPath();
  f.arc(hx, hy, 150, 0, Math.PI * 2);
  f.fill();
  f.fillStyle = 'rgba(0,0,0,1)';
  f.beginPath();
  f.arc(hx, hy, 110, 0, Math.PI * 2);
  f.fill();
  for (const L of lanes.values()) {
    if (!L.Z.dark) {
      continue;
    }
    const yb = laneY(L.r);
    if (yb < top - 60 || yb > bottom + 60) {
      continue;
    }
    if (KILL.has(L.type)) {
      for (const m of L.movers) {
        const fx = L.dir > 0 ? m.x + m.w : m.x;
        if (fx < viewL - 200 || fx > viewR + 200) {
          continue;
        }
        f.fillStyle = 'rgba(0,0,0,0.5)';
        f.beginPath();
        f.moveTo(fx, yb - 16);
        f.lineTo(fx + L.dir * 130, yb - 34);
        f.lineTo(fx + L.dir * 130, yb + 6);
        f.closePath();
        f.fill();
        f.fillStyle = 'rgba(0,0,0,0.7)';
        f.beginPath();
        f.ellipse(m.x + m.w / 2, yb - 20, m.w * 0.5 + 6, 26, 0, 0, Math.PI * 2);
        f.fill();
      }
    }
    if (L.tr && (L.tr.on || L.tr.t < 1.3)) {
      const sx = L.dir > 0 ? EDGE + 44 : -EDGE - 44;
      f.beginPath();
      f.arc(sx, yb - 50, 40, 0, Math.PI * 2);
      f.fill();
      if (L.tr.on) {
        f.fillRect(L.tr.x - 40, yb - 70, TRAIN_LEN + 80, 80);
      }
    }
    for (const [c, k] of L.blocks) {
      if (k === 'lamp') {
        f.beginPath();
        f.arc(c * COLW, yb - 40, 60, 0, Math.PI * 2);
        f.fill();
      }
    }
  }
  if (ufo) {
    f.beginPath();
    f.arc(ufo.x, ufo.y, 70, 0, Math.PI * 2);
    f.fill();
  }
  f.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fog, 0, 0);
  ctx.restore();
}

function drawUfo() {
  const u = ufo;
  if (u.phase === 'beam' || u.phase === 'carry') {
    const [x, rF] = heroPos();
    const yb = laneY(rF);
    ctx.fillStyle = 'rgba(253,230,138,0.35)';
    ctx.beginPath();
    ctx.moveTo(u.x - 14, u.y + 8);
    ctx.lineTo(u.x + 14, u.y + 8);
    ctx.lineTo(x + 36, yb + 4);
    ctx.lineTo(x - 36, yb + 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.save();
  ctx.translate(u.x, u.y + Math.sin(clock * 3) * 4);
  ctx.beginPath();
  ctx.arc(0, -8, 16, Math.PI, 0);
  inkShape('#e8f0f6', 1.6);
  goonHead(0, -10, 1);
  ctx.beginPath();
  ctx.ellipse(0, 0, 44, 11, 0, 0, Math.PI * 2);
  inkShape('#fff', 1.8);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = Math.sin(clock * 10 + i) > 0 ? COL.butterHi : '#d4d4d4';
    ctx.beginPath();
    ctx.arc(-28 + i * 14, 1, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMeteors() {
  for (const me of meteors) {
    if (me.hit) {
      continue;
    }
    const k = clamp((me.t - (me.dur - 0.55)) / 0.55, 0, 1);
    if (k <= 0) {
      continue;
    }
    const yb = laneY(me.r);
    const x = lerp(me.x + 160, me.x, k), y = lerp(yb - 420, yb - 6, k);
    ctx.strokeStyle = COL.butterHi;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    line(x + 26, y - 60, x, y);
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    inkShape('#bdbdbd', 1.8);
  }
}

function drawFxs() {
  for (const f of fxs) {
    if (f.ty === 'star') {
      const k = f.t;
      const sc = (k < 0.08 ? k / 0.08 * 1.2 : 1.2 - Math.min(0.2, (k - 0.08) * 2)) * (f.big ? 1.4 : 1);
      ctx.save();
      ctx.globalAlpha = clamp(1 - (k - 0.45) / 0.3, 0, 1);
      ctx.translate(f.x, f.y);
      ctx.rotate(-0.12);
      ctx.scale(sc, sc);
      ctx.beginPath();
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        const r = i % 2 ? 16 : 27 + (hash(i, f.x) - 0.5) * 6;
        ctx.lineTo(Math.cos(a) * r * 1.45, Math.sin(a) * r);
      }
      ctx.closePath();
      inkShape(COL.butterHi, 2);
      ctx.fillStyle = COL.ink;
      ctx.font = FONT(11);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.word, 0, 1);
      ctx.restore();
    } else if (f.ty === 'splash') {
      const k = clamp(f.t / 0.55, 0, 1);
      const up = Math.sin(Math.PI * k);
      ctx.save();
      ctx.globalAlpha = 1 - k * 0.6;
      ctx.strokeStyle = '#8fb0c6';
      ctx.lineCap = 'round';
      ctx.lineWidth = 2.6;
      for (let i = -2; i <= 2; i++) {
        const tx = f.x + i * (8 + 10 * k), ty = f.y - (22 - Math.abs(i) * 6) * up;
        ctx.beginPath();
        ctx.moveTo(f.x + i * 4, f.y);
        ctx.quadraticCurveTo(f.x + i * 6, ty, tx, ty);
        ctx.stroke();
      }
      ctx.lineWidth = 1.6;
      for (let j = 0; j < 2; j++) {
        const kk = clamp((f.t - j * 0.18) / 0.7, 0, 1);
        if (kk <= 0) {
          continue;
        }
        ctx.globalAlpha = 1 - kk;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y + 2, 10 + kk * 34, 3 + kk * 7, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawBanner() {
  const b = banner;
  const k = b.t < 0.3 ? EASE.out(b.t / 0.3) : b.t > 2.2 ? 1 - (b.t - 2.2) / 0.4 : 1;
  const name = zoneTitle(b.zi);
  const narrow = cw < ch;
  const y = (narrow ? 132 : 104) + 12;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = clamp(k, 0, 1);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = COL.accent;
  ctx.font = FONT(12);
  ctx.letterSpacing = '3px';
  ctx.fillText(b.fresh ? 'TÌM THẤY VÙNG MỚI' : `VÙNG ${b.zi + 1}`, cw / 2, y + 8 - (1 - k) * 10);
  ctx.letterSpacing = '0px';
  ctx.font = FONT(narrow ? 30 : 36);
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#fff';
  ctx.lineJoin = 'round';
  ctx.strokeText(name, cw / 2, y + 42 - (1 - k) * 10);
  ctx.fillStyle = COL.ink;
  ctx.fillText(name, cw / 2, y + 42 - (1 - k) * 10);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const s = cam.s;
  const oy = cam.cy + camR * ROW * s;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * cam.cx, dpr * (oy + shake));
  viewL = -cam.cx / s;
  viewR = (cw - cam.cx) / s;
  const top = -oy / s, bottom = (ch - oy) / s;
  const rTop = Math.ceil(-top / ROW) + 2, rBot = Math.floor(-bottom / ROW) - 1;
  for (let r = rBot; r <= rTop; r++) {
    const L = lanes.get(r);
    if (L) {
      drawFloor(L);
    }
  }
  drawBounds(top, bottom);
  const [, hrF] = heroPos();
  const heroDepth = hero.death ? Math.round(hero.death.rF) : Math.round(hrF - 0.05);
  const heroOnTop = hero.float || (hero.death && (hero.death.ty === 'fling' || hero.death.ty === 'space' || hero.death.ty === 'fall'));
  for (let r = rTop; r >= rBot; r--) {
    const L = lanes.get(r);
    if (!L) {
      continue;
    }
    const splat = hero.death && hero.death.ty === 'splat' && heroDepth === r;
    if (splat) {
      drawHero();
    }
    drawLaneThings(L);
    if (r === heroDepth && !heroOnTop && !splat) {
      drawHero();
    }
  }
  drawMeteors();
  if (heroOnTop) {
    drawHero();
  }
  if (ufo) {
    drawUfo();
  }
  drawEraser(bottom);
  drawNight(top, bottom);
  drawFxs();
  drawBits();
  drawPopups(viewL + 10, viewR - 10);
  if (banner && mode === 'play') {
    drawBanner();
  }
  if (slowT > 0) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.strokeStyle = `rgba(180,83,9,${0.25 * Math.min(1, slowT)})`;
    ctx.lineWidth = 10 * dpr;
    ctx.strokeRect(0, 0, cv.width, cv.height);
    ctx.restore();
  }
}

// ── Share image ────────────────────────────────────────────────────────────

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = FONT(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = FONT(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.score), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = FONT(30);
  ctx.fillText('ĐIỂM', 82, 386);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = COL.ink;
  ctx.font = FONT(64);
  ctx.fillText(String(res.rows), 82, 540);
  ctx.fillText(zoneTitle(res.zone), 380, 540);
  ctx.fillStyle = COL.muted;
  ctx.font = FONT(21);
  ctx.letterSpacing = '3px';
  ctx.fillText('HÀNG', 84, 580);
  ctx.fillText(`VÙNG ${res.zone + 1}`, 382, 580);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = COL.ink;
  ctx.font = FONT(34);
  ctx.fillText(res.why, 82, 680);
  ctx.fillStyle = COL.faint;
  ctx.font = FONT(26);
  ctx.letterSpacing = '4px';
  ctx.fillText(GAME.toUpperCase(), 84, 1290);
  ctx.letterSpacing = '0px';
  ctx.save();
  ctx.translate(540, 1050);
  ctx.scale(2.2, 2.2);
  ctx.fillStyle = '#efefef';
  ctx.fillRect(-260, -28, 520, 56);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.6;
  line(-260, -28, 260, -28);
  line(-260, 28, 260, 28);
  const L = { dir: 1, Z: ZONES[0] };
  drawVehicle({ kind: 'car', w: 62, tone: 0.9 }, L, -200, 14);
  drawVehicle({ kind: 'bus', w: 140, tone: 0 }, { dir: -1, Z: ZONES[0] }, 120, 14);
  const yb = -42;
  contactShadow(10, 16, 0.12, yb);
  drawFigure({ pose: P.cheer }, 10, yb + 8 * 0.9, 0, { live: false, scale: 0.9 });
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.score}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────

buildWorld();
$('startFoot').textContent = life.games ? `Kỷ lục ${life.best} · đã tìm ${Math.min(NZ, life.zones)}/${NZ} vùng` : '';
if (Q.has('autoplay') || BOT) {
  startGame();
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
