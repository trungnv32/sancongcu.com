<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gõ Phím Hạ Địch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 12px 18px 14px; }
  .board .what { font-size: 12px; color: var(--soft); margin-bottom: 10px; white-space: nowrap; }
  .stats { display: flex; align-items: flex-end; gap: 26px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .small { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .hearts { display: flex; gap: 3px; height: 22px; align-items: flex-end; }
  .hearts svg { width: 21px; height: 19px; }
  .hearts path { fill: var(--butter-hi); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .hearts .off path { fill: none; stroke: #d0d0d0; }

  #hint {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(380px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .card.wide { width: min(580px, 100%); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 28px; height: 28px; }
  .head { display: flex; align-items: center; gap: 14px; }
  .head .logo { margin: 0; flex: none; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 20px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }

.levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 24px 0 0; }
  .lv {
    height: 74px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .09);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; line-height: 1;
    transition: background .15s, box-shadow .15s;
  }
  .lv .n { font-size: 22px; }
  .lv small { font-size: 11px; color: var(--muted); }
  .lv.sel { background: var(--butter-soft); box-shadow: 0 0 0 2px var(--butter-hi); color: var(--umber); }
  .lv.sel small { color: #92400e; }
    .st { display: flex; gap: 1px; }
  .st svg { width: 11px; height: 11px; }
  .star path { fill: none; stroke: #cfcfcf; stroke-width: 1.7; stroke-linejoin: round; }
  .star.on path { fill: var(--butter-hi); stroke: var(--ink); }
  .lvname { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 18px 2px 6px; }
  .lvname b { font-size: 17px; }
  .lvname span { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
  .tip { font-size: 14px; color: var(--muted); margin: 0 2px 18px; line-height: 1.45; min-height: 20px; }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
    .lv:not(.sel):hover { background: var(--chip); }
  }

  .nokb { display: none; text-align: center; padding: 18px 8px 6px; }
  .nokb svg { width: 64px; height: 40px; margin-bottom: 12px; }
  .nokb p { font-size: 17px; margin: 0 0 6px; }
  .nokb .label { font-size: 14px; margin-bottom: 20px; }
  .nokb a { display: inline-flex; text-decoration: none; padding: 0 32px; }
  body.phone .nokb { display: block; }
  body.phone #menu { display: none; }

  .stars { display: flex; gap: 18px; margin: 22px 0 6px; }
  .stars > div { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .stars svg { width: 40px; height: 40px; }
  .stars .star.on + span { color: var(--ink); }
  .result { display: flex; align-items: flex-end; gap: 30px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  .mid { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 560px) {
    .levels { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; }
    .stats { gap: 18px; }
    #score { font-size: 38px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
    .card { padding: 22px; }
  }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="what" id="what"></div>
    <div class="stats">
      <div class="stat"><div id="score">0</div><div class="label" id="scoreLabel">Lâu la còn</div></div>
      <div class="stat"><div class="hearts" id="hearts"></div><div class="label">Tim</div></div>
    </div>
  </div>
</div>

<div id="hint" class="hidden"><span id="hintText">Gõ các chữ trên biển của lâu la</span></div>

<div id="overlay" class="on">
  <div class="card wide show" id="startCard">
    <div class="head">
      <div class="logo"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15.5l1.6-3.2 2.2 6.4 2.2-6.4 2.2 6.4 1.4-3.2"/><path d="M11 12h3v7h-3z"/><circle cx="19.5" cy="15.5" r="6"/><path d="M15.5 17.5c1.5 1.2 4 1.4 6 .2"/></svg></div>
      <div><h1 class="title">Gõ Phím Hạ Địch</h1><div class="sub">Gõ đúng chữ trên biển để hạ gục lâu la</div></div>
    </div>
    <div class="nokb"><svg viewBox="0 0 64 40" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="60" height="36" rx="5"/><path d="M10 11h4M20 11h4M30 11h4M40 11h4M50 11h4M13 20h4M23 20h4M33 20h4M43 20h4M18 29h28"/></svg><p>Game này cần bàn phím</p><div class="label">Hãy mở trên máy tính để chơi</div><a class="btn primary" href="/" target="_top">More games</a></div>
    <div id="menu">
      <div class="levels" id="levels"></div>
      <div class="lvname" id="lvName"></div>
      <div class="tip" id="tip"></div>
      <div class="actions">
        <button class="btn primary" id="playBtn"><span id="playText">Chiến</span><kbd class="kbd-only">Enter</kbd></button>
      </div>
      <div class="foot" id="startFoot"></div>
    </div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endLabel">Đã qua</div>
      <span class="chip" id="endChip" style="display:none"></span>
    </div>
    <div class="stars" id="endStars"></div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label" id="endScoreLabel">TỪ/PHÚT</div></div>
      <div><div class="mid" id="endB">0</div><div class="label" id="endBLabel">Độ chính xác</div></div>
      <div><div class="mid" id="endC">0</div><div class="label" id="endCLabel">Đã hạ</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span id="againText">Thử lại</span><kbd class="kbd-only">Enter</kbd></button>
      <button class="btn ghost" id="menuBtn" aria-label="All levels" title="All levels (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'typing';
const GAME = 'Type Fight';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', butterHi: '#fcd34d', butterSoft: '#fef3c7', umber: '#78350f', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const GOON = { ink: '#7c7c7c', far: '#bdbdbd', head: '#5f5f5f' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const FONT = (s) => `400 ${s}px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif`;

// ── Test modes ─────────────────────────────────────────────────────────────

const Q = new URLSearchParams(location.search);
const BOT = Q.has('bot');
const TEST = BOT || Q.has('still') || Q.has('autoplay');
window.__bot = BOT;
window.__freeze = Q.has('still');
const PHONE = !TEST && matchMedia('(hover: none) and (pointer: coarse)').matches;
document.body.classList.toggle('phone', PHONE);

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};
function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) {
  return (r() + r() + r() - 1.5) / 1.5;
}
let rng = mulberry((Date.now() & 0xffff) ^ 0x5eed);
const pick = (arr, r) => arr[Math.floor((r || rng)() * arr.length)];

// ── View ───────────────────────────────────────────────────────────────────

const VIEW = { x0: -430, x1: 430, y0: -290, y1: 30, minW: 560 };
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 150 : 120;
  const bottom = 56;
  const vw = VIEW.x1 - VIEW.x0, vh = VIEW.y1 - VIEW.y0;
  const fitH = (ch - top - bottom) / vh;
  const s = narrow ? Math.min(fitH, cw / VIEW.minW, 1.6) : Math.min((cw - 80) / vw, fitH, 1.6);
  cam = {
    s,
    x: cw / 2,
    y: top + (ch - top - bottom - vh * s) * 0.6 - VIEW.y0 * s,
  };
}
function toWorld(px, py) {
  return [(px - cam.x) / cam.s, (py - cam.y) / cam.s];
}
function visHalf() {
  return cw / 2 / cam.s;
}

// ── Stick figure ───────────────────────────────────────────────────────────

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

const P = {};
P.guard = mk({ head: [8, -112], chest: [3, -88], hip: [-2, -58], fF: [22, -8], kF: [22, -34], fB: [-22, -8], kB: [-11, -33], hF: [30, -100], eF: [22, -78], hB: [19, -94], eB: [10, -72] });
P.guard2 = mk({ head: [8, -109], chest: [3, -85], hip: [-2, -55], kF: [24, -31], kB: [-12, -30], hF: [30, -96], eF: [22, -75], hB: [19, -90], eB: [10, -69] }, P.guard);
P.jab = mk({ head: [19, -110], chest: [12, -86], hip: [3, -56], fF: [34, -8], kF: [33, -34], fB: [-22, -8], kB: [-8, -31], hF: [52, -104], eF: [34, -104], hB: [26, -98], eB: [16, -76] });
P.upper = mk({ head: [13, -124], chest: [8, -100], hip: [0, -68], fF: [26, -10], kF: [30, -36], fB: [-22, -12], kB: [-10, -38], hF: [30, -126], eF: [34, -100], hB: [18, -98], eB: [4, -82] });
P.oops = mk({ head: [-4, -110], chest: [-2, -87], hip: [-3, -58], hF: [16, -116], eF: [20, -98], hB: [8, -118], eB: [-4, -104] }, P.guard);
P.hurt = mk({ head: [-30, -103], chest: [-16, -85], hip: [-5, -57], fF: [16, -8], kF: [14, -36], fB: [-26, -8], kB: [-18, -34], hF: [10, -118], eF: [6, -100], hB: [-46, -66], eB: [-34, -84] });
P.fallback = mk({ head: [-52, -66], chest: [-34, -52], hip: [-8, -36], fF: [34, -40], kF: [16, -54], fB: [26, -20], kB: [6, -44], hF: [-18, -96], eF: [-30, -76], hB: [-26, -92], eB: [-40, -78] });
P.down = mk({ head: [-50, -12], chest: [-28, -12], hip: [4, -11], fF: [52, -10], kF: [30, -28], fB: [48, -8], kB: [27, -18], hF: [-8, -26], eF: [-18, -34], hB: [-64, -30], eB: [-46, -32] });
P.cheer = mk({ head: [2, -121], chest: [0, -96], hip: [0, -66], fF: [14, -8], fB: [-12, -8], kF: [16, -38], kB: [-4, -38], hF: [28, -132], eF: [22, -114], hB: [-34, -126], eB: [-24, -110] });

// Goons hold their sign pole up in front of them while they march.
const G = {};
G.walkA = mk({ head: [7, -118], chest: [4, -94], hip: [0, -64], fF: [20, -8], kF: [21, -36], fB: [-18, -9], kB: [-5, -37], hF: [27, -106], eF: [20, -82], hB: [25, -126], eB: [24, -104], hang: 0 });
G.walkP1 = mk({ head: [7, -120], chest: [4, -96], hip: [0, -66], fF: [2, -8], kF: [12, -37], fB: [4, -24], kB: [18, -46], hF: [27, -108], hB: [25, -128] }, G.walkA);
G.walkB = mk({ fF: [-18, -9], kF: [-5, -37], fB: [20, -8], kB: [21, -36] }, G.walkA);
G.walkP2 = mk({ head: [7, -120], chest: [4, -96], hip: [0, -66], fB: [2, -8], kB: [12, -37], fF: [4, -24], kF: [18, -46], hF: [27, -108], hB: [25, -128] }, G.walkA);

const SIGN_FONT = 19, LINE_H = 25, PAD = 11;
function layout(g) {

    return g.lay;

  mcv.font = FONT(SIGN_FONT);
  const space = mcv.measureText(' ').width;
  const maxW = g.maxW || 1e9;
  const lines = [[]];
  let w = 0;
  for (let wi = 0; wi < g.words.length; wi++) {
    const ww = mcv.measureText(g.words[wi]).width;
    if (lines[lines.length - 1].length && w + space + ww > maxW) {
      lines.push([]);
      w = 0;
    }
    w += (lines[lines.length - 1].length ? space : 0) + ww;
    lines[lines.length - 1].push(wi);
  }
  const lw = lines.map((ln) => ln.reduce((a, wi, k) => a + mcv.measureText(g.words[wi]).width + (k ? space : 0), 0));

  lines.forEach((ln, li) => {
    let x = -lw[li] / 2;
    const y = -H / 2 + 4 + LINE_H * (li + 0.5);
    for (const wi of ln) {
      for (const c of g.words[wi]) {
        const cwid = mcv.measureText(c).width;
        pos[wi].push([x + cwid / 2, y, cwid]);

    g.speed = (Math.abs(g.x) - reachD) / T;
    g.bannerY = topWorld() - 140;
    g.bannerV = 0;
    g.swing = 0;
    g.swingV = 0;
    g.throwT = 2.2;
    g.throwA = 0;
    popup('Trùm!', g.def.name.toUpperCase(), true, 0, -150);
    SND.bell();
  } else if (rng() < 0.4) {
    g.hat = pick(GOON_HATS, rng);
    g.hc = pick(HAT_COLS, rng);
  }
  g.signCol = pick(SIGN_COLS, rng);

}
function topWorld() {
  return toWorld(0, 0)[1];
}
function bannerAt() {
  return VIEW.y0 + 22;
}
function liveGoons() {
  return goons.filter((g) => g.state !== 'ko');
}
function nextChar(g) {
  return g.words[g.wi] ? g.words[g.wi][g.ci] : '';
}

function updateGoon(g, dt) {
  const dir = -g.side;
  g.st += dt;
  g.shakeT = Math.max(0, g.shakeT - dt);
  if (g.kind === 'boss' && g.state !== 'ko') {
    const want = bannerAt() + layout(g).H / 2;
    g.bannerV += ((want - g.bannerY) * 120 - g.bannerV * 11) * dt;
    g.bannerY += g.bannerV * dt;
    g.swingV += (-g.swing * 40 - g.swingV * 3) * dt;
    g.swing += g.swingV * dt;
  }
  if (g.state === 'drop') {
    g.vy += 2600 * dt;
    g.y = Math.min(0, g.y + g.vy * dt);
    follow(g.body, G.wind, 17, dt);
    if (g.y >= 0) {
      g.state = 'land';
      g.st = 0;
      kick(280);
      buzz(70);
      dust(g.x, 0, 70, 16);
      SND.ko(true);
    }
    return;
  }
  if (g.state === 'land') {
    follow(g.body, g.st < 0.25 ? G.squat : G.stand, 14, dt);
    if (g.st > 0.6) {
      g.state = 'walk';
    }
    return;
  }
  if (g.state === 'ko') {
    g.x += g.kvx * dt;
    g.y += g.kvy * dt;
    g.kvy += 1300 * dt;
    g.rot += g.vr * dt;
    follow(g.body, Math.sin(clock * 22 + g.id) > 0 ? G.flail : G.flail2, 18, dt);
    if (g.kvy > 0 && g.y > -60 * g.scale) {
      for (const o of goons) {
        if (o !== g && o.state !== 'ko' && o.y > -40 && Math.sign(o.x) === Math.sign(g.x) && Math.abs(o.x - g.x) < 34 * o.scale && !g.bowled.includes(o.id)) {
          g.bowled.push(o.id);
          o.kb += -dir * 420 * (o.kind === 'boss' ? 0.3 : 1);
          o.state = 'stun';
          o.st = 0;
          SND.bowl();
          burst(o.x, -60, 8);
          if (g.bowled.length === 1) {
            popup('Đổ nhào!', '', true, o.x, -190);
          }
        }
      }
    }
    return;
  }
  g.x += g.kb * dt;
  g.kb *= Math.exp(-7 * dt);
  let want;
  if (g.state === 'float') {
    g.x += dir * g.speed * dt;
    g.y += (-90 + Math.sin(clock * 2 + g.id) * 8 - g.y) * Math.min(1, dt * 1.6);
    want = Math.sin(clock * 3 + g.id) > 0 ? G.dangle : G.dangle2;
    if (Math.abs(g.x) <= g.reachD + 70) {
      g.state = 'dive';
      g.vy = -80;
      SND.whoosh();
      popup('Tới rồi!', '', false, g.x - dir * 40, g.y + 20);
    }
  } else if (g.state === 'dive') {
    g.vy += 1500 * dt;
    g.y = Math.min(0, g.y + g.vy * dt);
    g.x += dir * 160 * dt;
    want = G.bonk;
    if (g.y >= 0) {
      g.state = 'bonk';
      g.st = 0.3;
      g.hitDone = false;
      dust(g.x, 0, 30, 8);
    }
  } else if (g.state === 'walk' && g.throwA > 0) {
    g.throwA -= dt;
    want = g.throwA > 0.18 ? G.wind : G.bonk;
    if (g.throwA <= 0.18 && !g.thrown) {
      g.thrown = true;
      throwShot(g);
    }
  } else if (g.state === 'walk') {
    if (g.kind === 'boss' && mode === 'play') {
      g.throwT -= dt;
      if (g.throwT <= 0 && !shots.some((o) => o.live)) {
        g.throwA = 0.42;
        g.thrown = false;
        g.throwT = throwGap();
      }
    }
    const step = g.speed * dt;
    g.x += dir * step;
    g.phase += step / (64 * g.scale);
    want = pathPose(G.cycle, g.phase % 1);
    if (Math.abs(g.x) <= g.reachD) {
      g.state = 'bonk';
      g.st = 0;
      g.hitDone = false;
    }
  } else if (g.state === 'bonk') {
    want = g.st < 0.28 ? G.wind : G.bonk;
    if (g.st >= 0.36 && !g.hitDone) {
      g.hitDone = true;
      bonkHero(g);
    }
    if (g.st > 0.62) {
      g.state = 'stun';
      g.st = 0;
      g.kb += -dir * 820 * (g.kind === 'boss' ? 0.3 : 1);
    }
  } else if (g.state === 'stun') {
    want = G.hit;
    if (g.st > 0.55) {
      g.state = 'walk';
    }
  } else {
    want = G.stand;
  }
  if (Math.abs(g.x) < g.reachD - 6 && g.state !== 'bonk') {
    g.x = Math.sign(g.x || g.side) * (g.reachD - 6);
  }
  const tiltWant = g.state === 'bonk' ? (g.st < 0.28 ? -0.35 : 1.15) : g.state === 'stun' ? -0.25 : Math.sin(g.phase * Math.PI * 2) * 0.05;
  g.tiltV += ((tiltWant - g.tilt) * 260 - g.tiltV * 24) * dt;
  g.tilt += g.tiltV * dt;
  follow(g.body, want, g.state === 'bonk' ? 22 : 17, dt);
}

const SHOT_KINDS = ['boot', 'fish', 'pie', 'duck'];
function throwGap() {
  return clamp(4.4 - wpmNowTarget() / 18, 1.6, 3.6) * (0.8 + rng() * 0.4);
}
function throwShot(g) {
  const pool = gauntlet ? 'abcdefghijklmnopqrstuvwxyz' : BOUTS[bout].pool;
  const used = nextChar(g);
  let ch = pick([...pool], rng);
  for (let i = 0; i < 6 && ch === used; i++) {
    ch = pick([...pool], rng);
  }
  const x0 = g.x - Math.sign(g.x) * 24, y0 = g.y - 120 * g.scale;
  const x1 = Math.sign(g.x) * 14, y1 = -112;
  const D = clamp(2.5 - wpmNowTarget() / 45, 1.25, 2.2);
  const grav = 90;
  shots.push({ live: true, ch, kind: pick(SHOT_KINDS, rng), x: x0, y: y0, vx: (x1 - x0) / D, vy: (y1 - y0) / D - 0.5 * grav * D, grav, t: 0, D, r: 0, vr: -Math.sign(g.x) * 7, boss: g });
  SND.whoosh();
}
function updateShots(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const o = shots[i];
    o.t += dt;
    o.vy += o.grav * dt;
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.r += o.vr * dt;
    if (o.live && o.t >= o.D) {
      o.live = false;
      o.vx = -o.vx * 0.3;
      o.vy = -260;
      bonkHero(null);
      SND.bowl();
    }
    if (!o.live && (o.y > 300 || o.t > o.D + 3)) {
      shots.splice(i, 1);
    }
  }
}
function hitShot(o) {
  correct++;
  o.live = false;
  o.vx = -o.vx * 1.4;
  o.vy = -420;
  o.vr *= -2;
  o.grav = 900;
  glove.t = 0;
  glove.goon = null;
  glove.shot = o;

function drawShots() {

function drawThing(kind) {

function bonkHero(g) {
  if (mode !== 'play' || hero.inv > 0) {
    return;
  }
  hearts--;
  hits++;
  combo = 0;
  hero.hurtT = 0.42;
  hero.inv = 0.7;

// ── Typing ─────────────────────────────────────────────────────────────────

function typeChar(c) {
  if (mode !== 'play' || paused) {
    return;
  }
  if (lastKeyT >= 0) {
    activeT += Math.min(runTime - lastKeyT, 1);
  }
  lastKeyT = runTime;
  const shot = shots.find((o) => o.live && o.ch === c);
  if (shot) {
    hitShot(shot);
    return;
  }
  if (target && (target.state === 'ko' || !goons.includes(target))) {
    target = null;
  }
  if (!target) {
    let best = null;
    for (const g of liveGoons()) {
      if (nextChar(g) === c && Math.abs(g.x) - (g.sign ? g.sign.w / 2 : 20) < visHalf() - 6 && (!best || Math.abs(g.x) < Math.abs(best.x))) {
        best = g;
      }
    }
    if (!best) {
      miss(null, c);
      return;
    }
    target = best;
  }
  if (nextChar(target) === c) {
    landLetter(target, c);
  } else {
    miss(target, c);
  }
}

function landLetter(g, c) {
  correct++;
  const ci = g.ci, wi = g.wi;
  const [lx, ly] = charWorld(g, wi, ci);
  const dir = Math.sign(g.x) || g.side;
  hero.face = dir;
  g.ci++;
  const wordDone = g.ci >= g.words[g.wi].length;
  if (wordDone) {
    wordsDone++;
  }
  const last = wordDone && g.wi === g.words.length - 1;
  glove.t = 0;
  glove.goon = g;
  glove.wi = wi;
  glove.ci = ci;
  glove.head = last;
  glove.miss = false;
  glove.face = false;
  glove.shot = null;
  glove.aim = last ? [g.x - dir * 10, g.y - 110 * g.scale] : [lx, ly + g.sign.h / 2 + 6];
  flyLetter(c, lx, ly, dir);
  if (last) {
    knockOut(g);
    return;
  }
  hero.jabT = 0.11;
  const heavy = g.kind === 'boss' ? 0.25 : g.kind === 'tank' ? 0.55 : 1;
  g.kb += dir * 70 * heavy;
  g.shakeT = 0.12;
  SND.hit(ci);
  if (wordDone && g.kind === 'boss') {
    glove.face = true;
    glove.aim = [g.x - dir * 12 * g.scale, g.y - 112 * g.scale];
    if (g.wounds.length < WOUNDS.length) {
      g.wounds.push(WOUNDS[g.wounds.length]);
    }
    g.swingV += dir * 3;
    popup(pick(['Hự!', 'Ui da!', 'Bốp!', 'Úi!', 'Ê!', 'Hỗn!'], rng), '', false, g.x + (g.wounds.length % 2 ? -24 : 24), g.y - 175 * g.scale - (g.wounds.length % 3) * 22);
  } else if (g.kind === 'boss') {
    g.swingV += dir * 0.6;
  }
  if (wordDone && g.kind === 'boss') {
    g.wi++;
    g.ci = 0;
    g.kb += dir * 90;
    g.shakeT = 0.3;
    SND.bowl();
    burst(lx, ly, 6);
  } else if (wordDone) {
    g.wi++;
    g.ci = 0;
    g.kb += dir * 300 * heavy;
    g.state = 'stun';
    g.st = 0.2;
    target = null;
    SND.bowl();
    burst(lx, ly, 6);
  }
  if (!life.seenHint && !BOT) {
    life.seenHint = true;
    save();
    $('hint').classList.add('hidden');

function knockOut(g) {

  hero.jabT = 0;

    }
  }
  if (boss) {
    for (const o of shots) {

    }

function miss(g, c) {

// ── Runs ───────────────────────────────────────────────────────────────────

function startRun(i) {
  audio();
  gauntlet = i < 0;
  bout = gauntlet ? 0 : i;
  life.sel = gauntlet ? BOUTS.length : i;
  save();
  mode = 'play';
  paused = false;
  goons = [];
  queue = gauntlet ? [] : makeQueue(BOUTS[i]);
  total = gauntlet ? 0 : queue.length;
  target = null;
  hearts = 3;
  kos = 0;
  correct = 0;
  errors = 0;
  combo = 0;
  bestCombo = 0;
  hits = 0;
  activeT = 0;
  lastKeyT = -1;
  wordsDone = 0;
  calmT = 0;
  bossAt = 20;
  runTime = 0;
  spawnT = 1.2;
  clearT = -1;
  slow = 1;
  slowT = 0;
  letters.length = 0;
  debris.length = 0;
  shots.length = 0;
  popups.length = 0;
  hero.body = newBody(P.guard);
  hero.state = 'ok';
  hero.face = 1;
  hero.hurtT = hero.upT = hero.jabT = hero.oopsT = hero.inv = 0;
  glove.t = 1;
  glove.goon = null;
  const b = BOUTS[bout];
  $('what').textContent = gauntlet ? 'Vô tận' : `Màn ${i + 1} · ${b.name}`;
  $('scoreLabel').textContent = gauntlet ? 'Đã hạ' : 'Lâu la còn';
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  popup(gauntlet ? 'Vô tận' : `Màn ${i + 1}`, gauntlet ? 'BẠN TRỤ ĐƯỢC BAO LÂU' : b.name.toUpperCase(), true, 0, -175);
  updateHud();
}

function wpmNow() {
  return activeT < 3 ? 0 : Math.round((correct + wordsDone) / 5 / (activeT / 60));
}
function skillNow() {
  const base = life.skill || 0;
  if (correct < 15) {
    return base;
  }
  return base ? lerp(base, wpmNow(), Math.min(1, correct / 80)) : wpmNow();
}
function accuracy() {
  return correct + errors ? Math.round((correct / (correct + errors)) * 100) : 100;
}

function finish(cleared) {
  mode = 'over';
  target = null;
  for (const g of liveGoons()) {
    g.state = 'idle';
  }
  const wpm = wpmNow(), acc = accuracy();
  if (cleared) {
    hero.state = 'win';
    SND.win();
  } else {
    hero.state = 'down';
    hero.downT = 0;
    SND.lose();
    kick(160);
  }
  life.games++;
  const res = { gauntlet, bout, cleared, wpm, acc, kos, total, hits, bestCombo, time: runTime, stars: 0, isBest: false };
  if (gauntlet) {
    res.isBest = kos > life.best;
    life.best = Math.max(life.best, kos);
    res.score = kos;
  } else {
    res.score = wpm;
    if (cleared) {
      res.stars = 1 + (acc >= 92 ? 1 : 0) + (acc >= 96 && hits === 0 ? 1 : 0);
      const prev = life.stars[bout] || 0;
      res.newStars = res.stars > prev;
      life.stars[bout] = Math.max(prev, res.stars);
      res.isBest = wpm > (life.wpm[bout] || 0);
      life.wpm[bout] = Math.max(life.wpm[bout] || 0, wpm);
      life.acc[bout] = Math.max(life.acc[bout] || 0, acc);
    }
  }
  if (correct > 40) {
    life.bestWpm = Math.max(life.bestWpm, wpm);
  }
  if (correct >= 20) {
    life.skill = life.skill ? Math.round(life.skill * 0.6 + wpm * 0.4) : wpm;
  }
  save();
  lastResult = res;
  window.__lastRun = { score: res.score, time: runTime };
  setTimeout(() => showEnd(res), cleared ? 1300 : 1100);
}

const STAR = '<svg viewBox="0 0 24 24" class="star{on}"><path d="M12 2.8l2.75 5.8 6.3.75-4.65 4.35 1.2 6.25L12 16.9l-5.6 3.05 1.2-6.25L2.95 9.35l6.3-.75z"/></svg>';

// ── Bot ────────────────────────────────────────────────────────────────────

const botRng = mulberry(11);
let botAt = 0, botFocus = null;
let botShot = null;
function bot() {
  if (runTime < botAt) {
    return;
  }
  const shot = shots.find((o) => o.live && o.t > 0.35);
  if (shot) {
    if (botShot !== shot) {
      botShot = shot;
      botAt = runTime + 0.25 + Math.abs(gauss(botRng)) * 0.25;
      return;
    }
    typeChar(botRng() < 0.05 ? 'q' : shot.ch);
    botAt = runTime + 0.3;
    return;
  }
  let g = target && target.state !== 'ko' ? target : null;
  if (!g) {
    g = liveGoons().filter((o) => Math.abs(o.x) < visHalf() - 20).sort((a, b) => Math.abs(a.x) - Math.abs(b.x))[0];
    if (!g) {
      botAt = runTime + 0.15;
      return;
    }
    if (botFocus !== g) {
      botFocus = g;
      botAt = runTime + 0.28 + Math.abs(gauss(botRng)) * 0.15;
      return;
    }
  }
  const want = nextChar(g);
  const wrong = botRng() < 0.045;
  typeChar(wrong ? pick([...'asdfghjkl'], botRng) : want);
  botAt = runTime + (1 / 2.5) * (0.65 + botRng() * 0.7);
}

// ── Update ─────────────────────────────────────────────────────────────────

function update(rawDt) {
  if (slowT > 0) {
    slowT -= rawDt;
    if (slowT <= 0) {
      slow = 1;
    }
  }
  const dt = rawDt * (paused ? 0 : slow);
  clock += dt;
  updateFx(dt);
  updateHero(dt);
  glove.t += dt;
  if (mode === 'menu') {
    updateMenuGoons(dt);
    return;
  }
  for (const g of goons) {
    updateGoon(g, dt);
  }
  updateShots(dt);
  goons = goons.filter((g) => !(g.state === 'ko' && (g.y > 400 || Math.abs(g.x) > visHalf() + 300)));
  if (mode !== 'play') {
    return;
  }
  runTime += dt;
  hero.inv = Math.max(0, hero.inv - dt);
  if (BOT) {
    bot();
  }
  if (gauntlet && !queue.length && kos >= bossAt) {
    bossAt += 20;
    queue.push({ kind: 'boss', words: pick(ENDLESS_BOSS, rng).split(' '), side: rng() < 0.5 ? 1 : -1 });
  }
  if (gauntlet && !queue.length) {
    const kinds = kos < 6 ? {} : { runner: 0.2, tank: kos > 14 ? 0.15 : 0, balloon: kos > 22 ? 0.15 : 0 };
    const gb = { pool: 'abcdefghijklmnopqrstuvwxyz', add: '', lvl: 6, len: [3, Math.min(10, 4 + Math.floor(kos / 6))], kinds };
    const kind = kindFor(gb, rng);
    queue.push({ kind, words: [token(gb, kind, rng)], side: rng() < 0.5 ? 1 : -1 });
  }
  const b = BOUTS[bout];
  const cap = gauntlet ? Math.min(5, 2 + Math.floor(kos / 10)) : b.cap;
  const alive = liveGoons().length;
  const bossNext = queue.length && queue[0].kind === 'boss';
  const bossUp = liveGoons().some((g) => g.kind === 'boss');
  calmT = alive ? 0 : calmT + dt;
  spawnT -= dt;
  if (queue.length && alive < cap && !bossUp && (bossNext ? calmT > 0.8 : spawnT <= 0 || alive === 0)) {
    const spec = queue.shift();
    spawn(spec);
    const cps = (wpmNowTarget() * 5) / 60;
    const avg = gauntlet ? 6 : 5;
    spawnT = ((avg + 1) / cps) * (gauntlet ? 1 : b.gap) * (0.8 + rng() * 0.4) * (spec.kind === 'boss' ? 1.6 : 1);
  }
  if (!gauntlet && !queue.length && alive === 0) {
    if (clearT < 0) {
      clearT = 0.9;
    }
    clearT -= dt;
    if (clearT <= 0) {
      finish(true);
    }
  }
}

function updateHero(dt) {
  hero.jabT -= dt;
  hero.upT -= dt;
  hero.hurtT -= dt;
  hero.oopsT -= dt;
  let want, w = 22;
  if (hero.state === 'down') {
    hero.downT += dt;
    want = hero.downT < 0.4 ? P.fallback : P.down;
    w = 9;
  } else if (hero.state === 'win') {
    want = blendPose(P.cheer, P.guard, 0.12 + 0.12 * Math.sin(clock * 6));
    w = 12;
  } else if (hero.hurtT > 0) {
    want = P.hurt;
    w = 18;
  } else if (hero.upT > 0 || hero.jabT > 0) {
    want = hero.upT > 0 ? P.upper : P.jab;
  } else if (hero.oopsT > 0) {
    want = P.oops;
  } else {
    want = blendPose(P.guard, P.guard2, 0.5 + 0.5 * Math.sin(clock * 2.6));
  }
  if (mode === 'play' && !target) {
    const near = liveGoons().sort((a, b) => Math.abs(a.x) - Math.abs(b.x))[0];
    if (near && hero.jabT <= 0 && hero.upT <= 0) {
      hero.face = Math.sign(near.x) || 1;
    }
  }
  follow(hero.body, want, w, dt);
}

const demo = [];
function updateMenuGoons(dt) {
  if (!demo.length) {
    demo.push({ id: 900, kind: 'plain', words: ['type'], wi: 0, ci: 0, side: -1, scale: 1, x: -250, y: 0, body: newBody(G.stand), state: 'idle', tilt: 0, tiltV: 0, phase: 0, pole: 32, shakeT: 0 });
    demo.push({ id: 901, kind: 'tank', words: ['fight'], wi: 0, ci: 0, side: 1, scale: 1.2, x: 270, y: 0, body: newBody(G.stand), state: 'idle', tilt: 0, tiltV: 0, phase: 0, pole: 40, shakeT: 0 });
  }
  for (const g of demo) {
    g.tilt = Math.sin(clock * 1.6 + g.id) * 0.06;
    follow(g.body, G.stand, 12, dt);
  }
  hero.face = Math.sin(clock * 0.4) > 0 ? 1 : -1;
}

// ── Render ─────────────────────────────────────────────────────────────────

function drawGoon(g) {
  const flip = g.x > 0;
  const s = g.scale;
  const boss = g.kind === 'boss';
  const opts = { flip, scale: s, goon: true, ink: boss ? g.def.col : GOON.ink, far: boss ? tint(g.def.col, 0.45) : GOON.far, dizzy: g.state === 'ko' || g.state === 'stun', deco: () => drawDeco(g) };
  if (g.state === 'ko') {
    ctx.save();
    ctx.translate(g.x, g.y - 60 * s);
    ctx.rotate(g.rot);
    drawFigure(g.body, 0, 68 * s, 0, opts);
    ctx.restore();
    return;
  }
  const y = g.y + 8;
  if (g.y > -2) {
    contactShadow(g.x, 14 * s, 0.1);
  }
  const J = drawFigure(g.body, g.x, y, 0, opts);
  const hand = toWorldOf(J.handF, g.x, y, flip, s);
  const dir = flip ? -1 : 1;
  const lay = layout(g);
  const shk = g.shakeT > 0 ? Math.sin(g.shakeT * 70) * 3 * (g.shakeT / 0.3) : 0;
  const target_ = target === g;
  const fill = target_ ? COL.butter : g.signCol || '#fff';
  if (boss) {
    drawBanner(g, target_);
  } else if (g.kind === 'balloon') {
    const bx = hand[0] + shk, by = hand[1] - 52 - lay.H / 2;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(hand[0], hand[1]);
    ctx.quadraticCurveTo(hand[0] + 6 * Math.sin(clock * 3 + g.id), hand[1] - 28, bx, by + lay.H / 2 + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(bx, by, lay.W / 2 + 6, lay.H / 2 + 7, 0, 0, Math.PI * 2);
    inkShape(fill, 1.8);
    ctx.beginPath();
    ctx.moveTo(bx - 4, by + lay.H / 2 + 11);
    ctx.lineTo(bx, by + lay.H / 2 + 6);
    ctx.lineTo(bx + 4, by + lay.H / 2 + 11);
    ctx.closePath();
    inkShape(fill, 1.4);
    g.sign = { x: bx, y: by, rot: 0, w: lay.W, h: lay.H };
  } else {
    const L = g.pole;
    const rot = g.tilt * dir;
    const top = [hand[0] + Math.sin(rot) * L, hand[1] - Math.cos(rot) * L];
    ctx.lineCap = 'round';
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 4.2;
    line(hand[0] - Math.sin(rot) * 10, hand[1] + Math.cos(rot) * 10, top[0], top[1]);
    ctx.strokeStyle = '#e8d5a8';
    ctx.lineWidth = 1.8;
    line(hand[0] - Math.sin(rot) * 9, hand[1] + Math.cos(rot) * 9, top[0], top[1]);
    const cx = top[0] + Math.sin(rot) * (lay.H / 2 - 2) + shk, cy = top[1] - Math.cos(rot) * (lay.H / 2 - 2);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    roundRect(-lay.W / 2, -lay.H / 2, lay.W, lay.H, 6);
    inkShape(fill, 1.8);
    ctx.restore();
    g.sign = { x: cx, y: cy, rot, w: lay.W, h: lay.H };
  }
  drawSignText(g);
}

function drawBannerCloth(w, h, fill, col) {
  const tail = 22;
  for (const sd of [-1, 1]) {
    const x0 = sd * (w / 2 - 6), x1 = sd * (w / 2 + tail);
    ctx.beginPath();
    ctx.moveTo(x0, -h / 2 + 8);
    ctx.lineTo(x1, -h / 2 + 8);
    ctx.lineTo(x1 - sd * 9, 4);
    ctx.lineTo(x1, h / 2 + 8);
    ctx.lineTo(x0, h / 2 + 8);
    ctx.closePath();
    inkShape(col ? tint(col, 0.55) : '#e5e5e5', 1.8);
  }
  roundRect(-w / 2, -h / 2, w, h, 4);
  inkShape(fill, 2);
}
function drawBanner(g, hot) {
  const lay = layout(g);
  const W = lay.W + 16, H = lay.H + 16;
  const cx = Math.sin(g.swing) * 6, cy = g.bannerY, rot = g.swing * 0.08;
  const top = topWorld() - 10;
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.4;
  for (const sd of [-1, 1]) {
    const ax = cx + sd * (W / 2 - 20) * Math.cos(rot), ay = cy + sd * (W / 2 - 20) * Math.sin(rot) - H / 2;
    line(ax, ay, sd * (W / 2 - 4), top);
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  drawBannerCloth(W, H, hot ? COL.butterSoft : '#fff', g.def.col);
  ctx.font = FONT(12);
  ctx.letterSpacing = '2px';
  const name = g.def.name.toUpperCase();
  const nw = ctx.measureText(name).width + 22;
  roundRect(-nw / 2, -H / 2 - 13, nw, 22, 7);
  inkShape(g.def.col, 1.6);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, 1, -H / 2 - 1.5);
  ctx.letterSpacing = '0px';
  ctx.restore();
  g.sign = { x: cx - Math.sin(rot) * 6, y: cy + Math.cos(rot) * 6, rot, w: W, h: H - 12 };
}

function drawHat(kind, hc) {
  const R = HEAD_R;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (kind === 'cap') {
    ctx.beginPath();
    ctx.arc(0, -1.5, R + 0.8, Math.PI, Math.PI * 2);
    ctx.closePath();
    inkShape(hc, 1.6);
    ctx.beginPath();
    ctx.moveTo(R * 0.3, -2);
    ctx.quadraticCurveTo(R + 4, -3.5, R + 8, -0.5);
    ctx.lineTo(R * 0.3, -0.2);
    ctx.closePath();
    inkShape(hc, 1.6);
  } else if (kind === 'beanie') {
    ctx.beginPath();
    ctx.arc(0, -1.5, R + 0.9, Math.PI, Math.PI * 2);
    ctx.closePath();
    inkShape(hc, 1.6);
    roundRect(-R - 1.5, -4, 2 * R + 3, 4.5, 2);
    inkShape(tint(hc, 0.45), 1.4);
    ctx.beginPath();
    ctx.arc(0, -R - 4.5, 3.2, 0, Math.PI * 2);
    inkShape('#fff', 1.4);
  } else if (kind === 'tophat') {
    roundRect(-R + 1.5, -R - 15, 2 * R - 3, 15, 1.5);
    inkShape(hc, 1.6);
    ctx.fillStyle = COL.butterHi;
    ctx.fillRect(-R + 2.3, -R - 4.5, 2 * R - 4.6, 3);
    roundRect(-R - 4, -R - 1.5, 2 * R + 8, 3.2, 1.5);
    inkShape(hc, 1.4);
  } else if (kind === 'crown') {
    ctx.beginPath();
    ctx.moveTo(-R + 0.5, -R + 3);
    ctx.lineTo(-R - 0.5, -R - 9);
    ctx.lineTo(-R * 0.45, -R - 3);
    ctx.lineTo(0, -R - 11);
    ctx.lineTo(R * 0.45, -R - 3);
    ctx.lineTo(R + 0.5, -R - 9);
    ctx.lineTo(R - 0.5, -R + 3);
    ctx.closePath();
    inkShape(hc, 1.6);
    ctx.beginPath();
    ctx.arc(0, -R - 1.5, 1.6, 0, Math.PI * 2);
    inkShape('#ef4444', 1);
  } else if (kind === 'party') {
    ctx.beginPath();
    ctx.moveTo(-R + 1, -R + 4);
    ctx.lineTo(R - 1, -R + 4);
    ctx.lineTo(2, -R - 15);
    ctx.closePath();
    inkShape(hc, 1.6);
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.2;
    line(-R * 0.55, -R - 1, R * 0.45, -R - 3);
    line(-R * 0.15, -R - 7, R * 0.3, -R - 8);
    ctx.beginPath();
    ctx.arc(2, -R - 16, 2.6, 0, Math.PI * 2);
    inkShape(COL.butterHi, 1.3);
  } else if (kind === 'chef') {
    for (const [x, y, r] of [[-4.5, -R - 5, 5], [4.5, -R - 5, 5], [0, -R - 9, 5.6]]) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      inkShape('#fff', 1.5);
    }
    roundRect(-R + 0.5, -R - 3, 2 * R - 1, 6, 1.5);
    inkShape('#fff', 1.5);
  } else if (kind === 'cowboy') {
    ctx.beginPath();
    ctx.moveTo(-R + 1.5, -R + 2);
    ctx.lineTo(-R + 2.5, -R - 8);
    ctx.quadraticCurveTo(0, -R - 5, R - 2.5, -R - 8);
    ctx.lineTo(R - 1.5, -R + 2);
    ctx.closePath();
    inkShape(hc, 1.6);
    ctx.beginPath();
    ctx.moveTo(-R - 8, -R - 1);
    ctx.quadraticCurveTo(0, -R + 5, R + 8, -R - 1);
    ctx.quadraticCurveTo(0, -R + 1.5, -R - 8, -R - 1);
    ctx.closePath();
    inkShape(hc, 1.6);
  } else if (kind === 'viking') {
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sd * (R - 1), -3);
      ctx.quadraticCurveTo(sd * (R + 7), -5, sd * (R + 5), -R - 8);
      ctx.quadraticCurveTo(sd * (R + 2), -R + 1, sd * (R - 3), -R + 2);
      ctx.closePath();
      inkShape('#f5f0e1', 1.4);
    }
    ctx.beginPath();
    ctx.arc(0, -1, R + 1, Math.PI, Math.PI * 2);
    ctx.closePath();
    inkShape(hc, 1.6);
  } else if (kind === 'pirate') {
    ctx.beginPath();
    ctx.ellipse(0, -R + 2, R + 7, 9, 0, Math.PI, Math.PI * 2);
    ctx.closePath();
    inkShape(hc, 1.6);
    ctx.beginPath();
    ctx.arc(0, -R - 2.5, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  } else if (kind === 'wizard') {
    ctx.beginPath();
    ctx.moveTo(-R - 1, -R + 3);
    ctx.lineTo(R + 1, -R + 3);
    ctx.quadraticCurveTo(2, -R - 8, -5, -R - 22);
    ctx.closePath();
    inkShape(hc, 1.6);
    roundRect(-R - 4, -R + 1.5, 2 * R + 8, 3, 1.5);
    inkShape(hc, 1.4);
    ctx.fillStyle = COL.butterHi;
    ctx.beginPath();
    ctx.arc(1, -R - 6, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
}
function plaster(x, y, rot, len) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  roundRect(-len / 2, -1.9, len, 3.8, 1.6);
  inkShape('#f4d9b0', 1);
  ctx.restore();
}
function drawDeco(g) {
  const R = HEAD_R;
  for (const w of g.wounds || []) {
    if (w === 'eye') {
      ctx.strokeStyle = '#7c5aa6';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(3.4, -1, 3.4, 0, Math.PI * 2);
      ctx.stroke();
    } else if (w === 'plaster') {
      plaster(-3.5, -R + 2.5, 0.7, 9);
      plaster(-3.5, -R + 2.5, -0.7, 9);
    } else if (w === 'bump' || w === 'bump2') {
      const a = w === 'bump' ? -2.3 : -2.9;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * (R + 1), Math.sin(a) * (R + 1), 2.8, 0, Math.PI * 2);
      inkShape('#fecaca', 1.3);
    } else if (w === 'cheek') {
      plaster(3, 4.2, 0.35, 7);
    } else if (w === 'plaster2') {
      plaster(-R + 1.5, 1.5, 1.2, 7);
      plaster(-R + 1.5, 1.5, -0.4, 7);
    }
  }
  if (g.def && g.def.stache) {
    ctx.beginPath();
    ctx.moveTo(1.2, 3.4);
    ctx.quadraticCurveTo(4.5, 1.6, 8.6, 3.2);
    ctx.quadraticCurveTo(9.4, 5.4, 7.6, 5);
    ctx.quadraticCurveTo(4.5, 3.6, 1.2, 5.2);
    ctx.closePath();
    ctx.fillStyle = COL.ink;
    ctx.fill();
  }
  const hat = g.def ? g.def.hat : g.hat;
  if (hat && !(g.def && g.state === 'ko')) {
    drawHat(hat, g.def ? g.def.hc : g.hc);
  }
}

function drawSignText(g) {
  const lay = layout(g);
  const s = g.sign;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.font = FONT(SIGN_FONT);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let wi = 0; wi < g.words.length; wi++) {
    const w = g.words[wi];
    for (let ci = 0; ci < w.length; ci++) {
      const [x, y, cwid] = lay.pos[wi][ci];
      const done = wi < g.wi || (wi === g.wi && ci < g.ci);
      const next = wi === g.wi && ci === g.ci;
      if (done) {
        ctx.fillStyle = target === g ? 'rgba(120,53,15,.22)' : '#dedede';
      } else {
        ctx.fillStyle = COL.ink;
      }
      ctx.fillText(w[ci], x, y + 1);
      if (next && mode === 'play') {
        ctx.fillStyle = target === g ? COL.umber : '#b5b5b5';
        ctx.fillRect(x - Math.max(4, cwid / 2), y + 10, Math.max(8, cwid), 2);
      }
    }
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    ctx.save();
    ctx.globalAlpha = clamp(2.5 - d.t, 0, 1);
    ctx.translate(d.x, d.y);
    ctx.rotate(d.r);
    if (d.hat) {
      ctx.scale(d.s, d.s);
      ctx.translate(0, HEAD_R);
      drawHat(d.hat, d.hc);
      ctx.restore();
      continue;
    }
    if (d.banner) {
      drawBannerCloth(d.w, d.h, d.col);
      ctx.restore();
      continue;
    }
    ctx.lineCap = 'round';
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 4.2;
    line(0, d.h / 2, 0, d.h / 2 + d.pole);
    ctx.strokeStyle = '#e8d5a8';
    ctx.lineWidth = 1.8;
    line(0, d.h / 2 + 1, 0, d.h / 2 + d.pole - 1);
    roundRect(-d.w / 2, -d.h / 2, d.w, d.h, 6);
    inkShape(d.col || '#fff', 1.8);
    ctx.restore();
  }
}

function drawGlove(hand, elbow, face) {
  const rest = Math.atan2(hand[1] - elbow[1], hand[0] - elbow[0]);
  let gx = hand[0] + Math.cos(rest) * 5, gy = hand[1] + Math.sin(rest) * 5, ang = rest;
  const t = glove.t;
  let ext = 0;
  if (t < 0.32 && hero.state === 'ok') {
    ext = t < 0.05 ? EASE.out(t / 0.05) : t < 0.1 ? 1 : 1 - EASE.io(Math.min(1, (t - 0.1) / 0.22));
  }
  if (ext > 0.001) {
    let tx, ty;
    const g = glove.goon;
    if (glove.shot) {
      tx = glove.shot.x;
      ty = glove.shot.y;
    } else if (glove.miss) {
      [tx, ty] = glove.aim;
    } else if (glove.face && g) {
      tx = g.x - Math.sign(g.x) * 12 * g.scale;
      ty = g.y - 112 * g.scale;
    } else if (g && g.sign && g.state !== 'ko') {
      [tx, ty] = charWorld(g, glove.wi, glove.ci);
      ty += g.sign.h / 2 + 6;
    } else if (g) {
      tx = glove.tx;
      ty = glove.ty;
    } else {
      tx = hand[0] + face * 60;
      ty = hand[1];
    }
    if (glove.head && g && glove.t < 0.05 && g.state === 'ko') {
      tx = g.x - Math.sign(g.x) * 10;
      ty = g.y - 110 * g.scale;
    }
    glove.tx = tx;
    glove.ty = ty;
    const ex = lerp(gx, tx - Math.cos(Math.atan2(ty - gy, tx - gx)) * 12, ext);
    const ey = lerp(gy, ty - Math.sin(Math.atan2(ty - gy, tx - gx)) * 12, ext);
    const punch = Math.atan2(ty - gy, tx - gx);
    let d = punch - rest;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    ang = rest + d * Math.min(1, ext * 4);
    const len = Math.hypot(ex - gx, ey - gy);
    if (len > 6) {
      const ux = (ex - gx) / len, uy = (ey - gy) / len;
      const coils = Math.max(2, Math.round(len / 15)), r = 5.5, steps = coils * 14;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const k = i / steps, th = k * coils * Math.PI * 2;
        const env = Math.min(1, k * 8, (1 - k) * 8);
        const al = k * len - Math.sin(th) * r * 0.9 * env;
        const sd = (1 - Math.cos(th)) * r * 0.5 * env;
        const px = gx + ux * al - uy * sd, py = gy + uy * al + ux * sd;
        if (i) {
          ctx.lineTo(px, py);
        } else {
          ctx.moveTo(px, py);
        }
      }
      ctx.stroke();
    }
    gx = ex;
    gy = ey;
  }
  drawMitt(gx, gy, ang, 1, face < 0, COL.butterHi);
}
function drawBackMitt(hand, elbow) {
  const a = Math.atan2(hand[1] - elbow[1], hand[0] - elbow[0]);
  drawMitt(hand[0] + Math.cos(a) * 4.5, hand[1] + Math.sin(a) * 4.5, a, 0.92, false, COL.butter);
}
function drawMitt(x, y, ang, k, mirror, fill) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(k, mirror ? -k : k);
  roundRect(-11, -5, 7, 10, 2.5);
  inkShape('#fff', 1.6);
  ctx.beginPath();
  ctx.ellipse(3, 0, 9.5, 8.5, 0, 0, Math.PI * 2);
  inkShape(fill, 1.8);
  ctx.beginPath();
  ctx.moveTo(-3, 3.5);
  ctx.quadraticCurveTo(3, 7.5, 9, 3.5);
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

function armAim() {
  const t = glove.t;
  if (!glove.aim || hero.state !== 'ok' || t > 0.36) {
    return null;
  }
  const k = t < 0.08 ? EASE.io(t / 0.08) : t < 0.16 ? 1 : 1 - EASE.io((t - 0.16) / 0.2);
  return { pt: [glove.aim[0] * hero.face, glove.aim[1] - 8], k };
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * (cam.y + shake));
  const left = toWorld(0, 0)[0], right = toWorld(cw, 0)[0];
  drawGround(left - 20, right + 20);
  const list = mode === 'menu' ? demo : goons;
  const order = list.filter((g) => g.state !== 'ko' && g !== target).concat(target && list.includes(target) && target.state !== 'ko' ? [target] : []);
  for (const g of order) {
    drawGoon(g);
  }
  contactShadow(0, 16, 0.1);
  const flip = hero.face < 0;
  const J = drawFigure(hero.body, 0, 8, mode === 'menu' ? Math.sin(clock * 2) * 1.2 : 0, { flip, backHand: drawBackMitt, aimF: armAim() });
  drawGlove(toWorldOf(J.handF, 0, 8, flip, 1), toWorldOf(J.eF, 0, 8, flip, 1), hero.face);
  for (const g of list) {
    if (g.state === 'ko') {
      drawGoon(g);
    }
  }
  drawDebris();
  drawShots();
  drawBits();
  drawLetters();
  drawPopups(left, right);
}

// ── Share image ────────────────────────────────────────────────────────────

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  const b = BOUTS[res.bout];
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = FONT(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = FONT(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.gauntlet ? res.kos : res.wpm), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = FONT(30);
  ctx.fillText(res.gauntlet ? 'LÂU LA BỊ HẠ' : 'TỪ MỖI PHÚT', 82, 386);
  const stats = res.gauntlet
    ? [[String(res.wpm), 'TỪ/PHÚT'], [res.acc + '%', 'ĐỘ CHÍNH XÁC']]
    : [[res.acc + '%', 'ĐỘ CHÍNH XÁC'], [`${res.kos}/${res.total}`, 'ĐÃ HẠ']];
  stats.forEach(([v, l], i) => {
    ctx.fillStyle = COL.ink;
    ctx.font = FONT(64);
    ctx.letterSpacing = '0px';
    ctx.fillText(v, 82 + i * 300, 540);
    ctx.fillStyle = COL.muted;
    ctx.font = FONT(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(l, 84 + i * 300, 580);
  });
  if (!res.gauntlet) {
    ctx.letterSpacing = '3px';
    ctx.fillStyle = COL.muted;
    ctx.font = FONT(24);
    ctx.fillText(`MÀN ${res.bout + 1} · ${b.name.toUpperCase()}`, 84, 676);
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(84 + i * 64, 712);
      ctx.scale(2.2, 2.2);
      const p = new Path2D('M12 2.8l2.75 5.8 6.3.75-4.65 4.35 1.2 6.25L12 16.9l-5.6 3.05 1.2-6.25L2.95 9.35l6.3-.75z');
      ctx.fillStyle = i < res.stars ? COL.butterHi : 'transparent';
      ctx.fill(p);
      ctx.strokeStyle = i < res.stars ? COL.ink : '#cfcfcf';
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.stroke(p);
      ctx.restore();
    }
  }
  ctx.fillStyle = COL.faint;
  ctx.font = FONT(26);
  ctx.letterSpacing = '4px';
  ctx.fillText(GAME.toUpperCase(), 84, 1260);
  ctx.letterSpacing = '0px';
  ctx.save();
  ctx.translate(560, 1180);
  ctx.scale(2.7, 2.7);
  drawGround(-150, 170);
  contactShadow(-40, 16, 0.1);
  const fig = { pose: P.cheer, id: 'share' };
  const SJ = drawFigure(fig, -40, 8, 0, { live: false, backHand: drawBackMitt });
  const sh = [SJ.handF[0] - 40, SJ.handF[1] + 8], se = [SJ.eF[0] - 40, SJ.eF[1] + 8];
  const sa = Math.atan2(sh[1] - se[1], sh[0] - se[0]);
  drawMitt(sh[0] + Math.cos(sa) * 5, sh[1] + Math.sin(sa) * 5, sa, 1, false, COL.butterHi);
  drawFigure({ pose: G.lie, id: 'sl' }, 90, 8, 0, { live: false, goon: true, dizzy: true, ink: GOON.ink, far: GOON.far });
  ctx.save();
  ctx.translate(150, -6);
  ctx.rotate(0.25);
  roundRect(-26, -12, 52, 24, 5);
  inkShape('#fff', 1.6);
  ctx.restore();
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.gauntlet ? 'endless-' + res.kos : res.wpm + 'wpm'}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  }
}

// ── Start ──────────────────────────────────────────────────────────────────

renderMenu();
if (BOT) {
  startRun(-1);
} else if (Q.has('autoplay')) {
  startRun(Q.has('gauntlet') ? -1 : clamp(+Q.get('bout') || 0, 0, BOUTS.length - 1));
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
