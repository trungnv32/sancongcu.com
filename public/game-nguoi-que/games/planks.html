<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Xếp Ván Cắt Thừa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; }
    #score { font-size: 38px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
  }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label">Tầng</div></div>
    <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span>Chạm để thả tấm ván</span><span class="kbd-only">hoặc</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="16" width="18" height="4" rx="0.5"/><rect x="5" y="10.5" width="14" height="4" rx="0.5"/><rect x="7" y="5" width="12" height="4" rx="0.5"/><path d="M3 5.5h2"/></svg></div>
    <h1 class="title">Xếp Ván Cắt Thừa</h1>
    <div class="keys"><kbd>Chạm</kbd> để thả tấm ván</div>
    <p class="tag">Phần thò ra sẽ bị cắt. Thả trúng khít thì tháp nở lại.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chơi</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label">Hết lượt</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Tầng</div></div>
      <div><div id="endBest">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Chơi lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'planks';
const GAME = 'Xếp Ván Cắt Thừa';
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', butterSoft: '#fef3c7', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// Shared building blocks, copied from references/snippets.js. Keep what you use, delete the rest.

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Fitting the world to any screen ────────────────────────────────────────
// Fit FIT_R world units around the top of the tower into the screen in every direction.
// cam.x / cam.y is the screen point the tower top is pinned to.

const FIT_R = 240;
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 130 : 90;
  const bottom = 64;
  const s = Math.min((cw - 24) / (FIT_R * 2), (ch - top - bottom) / (FIT_R * 2), 1.6);
  cam = { s, x: cw / 2, y: top + (ch - top - bottom) / 2 };
}

// ── Stick figure ───────────────────────────────────────────────────────────
// Poses are joint positions in figure space: facing right, feet near y = -8, head near y = -121.
// Draw at (x, groundY + 8) so the feet touch the ground. Needs: Helpers, strokePath, COL.fig.
// Make new poses with mk({...}) by moving a few joints of BASE; play them with an Actor.

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({});
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.crouch = mk({ head: [6, -100], chest: [4, -76], hip: [-2, -46], kF: [24, -30], kB: [12, -28], hF: [16, -60], eF: [10, -56], hB: [-8, -52], eB: [-8, -60] });
P.leap = mk({ head: [4, -124], chest: [2, -99], hip: [0, -68], fF: [14, -30], fB: [-14, -26], kF: [20, -52], kB: [-2, -48], hF: [18, -140], eF: [16, -120], hB: [-14, -134], eB: [-12, -116] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.punch = mk({ head: [8, -118], chest: [6, -94], hip: [0, -64], kF: [24, -36], kB: [-8, -34], fF: [18, -8], fB: [-16, -8], hF: [44, -98], eF: [26, -96], hB: [2, -88], eB: [-6, -78] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
// Pass the bend as the last argument; the hint then only matters when the limb is almost straight.
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}

// An Actor plays queued pose steps: actor.push({ pose: P.crouch, d: 0.12 }, { pose: P.leap, d: 0.2, ez: 'out' }).
// A step can also be { path: [P.a, P.b, P.c], d } for a smooth curve through several poses, or { fn: () => {} } to run code.
class Actor {
  constructor(pose) {
    this.pose = pose || P.ready;
    this.q = [];
    this.step = null;
    this.t = 0;
    this.id = Math.random().toString(36).slice(2);
  }
  push(...steps) {
    this.q.push(...steps);
  }
  clear() {
    this.q = [];
    this.step = null;
  }
  get idle() {
    return !this.step && !this.q.length;
  }
  update(dt) {
    for (let guard = 0; guard < 20; guard++) {
      if (!this.step) {
        if (!this.q.length) {
          return;
        }
        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {
          const fn = this.step.fn;
          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);
        this.step.list = [this.pose, ...targets];
      }
      this.t += dt;
      const s = this.step;
      const k = Math.min(1, this.t / s.d);
      this.pose = pathPose(s.list, (EASE[s.ez] || EASE.soft)(k));
      if (k < 1) {
        return;
      }
      dt = this.t - s.d;
      this.step = null;
    }
  }
}

// A back hand resting low under the shoulder hangs from a nearly straight arm, the way a relaxed arm does.
// Set hang: 0 on a pose when the back hand has to work there (it blends between poses like any number).
function relax(sh, t, amount) {
  const dx = t[0] - sh[0], dy = t[1] - sh[1];
  const d = Math.hypot(dx, dy);
  const want = (UARM + FARM) * 0.96;
  if (dy <= 0 || d < 1 || d >= want) {
    return t;
  }
  const w = (amount ?? 1) * Math.min(1, Math.max(0, (dy / d - 0.8) / 0.18));
  const k = w * w * (3 - 2 * w);
  const nd = d + (want - d) * k;
  return [sh[0] + (dx / d) * nd, sh[1] + (dy / d) * nd];
}
function reach(a, b, max) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.hypot(dx, dy);
  if (d <= max) {
    return b;
  }
  return [a[0] + (dx / d) * max, a[1] + (dy / d) * max];
}
function breathe(p, amt) {
  if (!amt) {
    return p;
  }
  const o = Object.assign({}, p);
  const up = (v, k) => [v[0], v[1] - amt * k];
  o.head = up(p.head, 1);
  o.chest = up(p.chest, 0.85);
  o.hF = up(p.hF, 0.6);
  o.hB = up(p.hB, 0.6);
  return o;
}
const prevJ = {};
function mirrorJoint(a, b, j) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  const t = ((j[0] - a[0]) * dx + (j[1] - a[1]) * dy) / L2;
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return [2 * px - j[0], 2 * py - j[1]];
}
function ikC(key, a, b, l1, l2, hint, bend) {
  const j = ik(a, b, l1, l2, hint, bend);
  if (bend) {
    prevJ[key] = j;
    return j;
  }
  const pj = prevJ[key];
  if (pj) {
    const alt = mirrorJoint(a, b, j);
    const dj = Math.hypot(j[0] - pj[0], j[1] - pj[1]);
    const da = Math.hypot(alt[0] - pj[0], alt[1] - pj[1]);
    const dh = Math.hypot(j[0] - hint[0], j[1] - hint[1]) - Math.hypot(alt[0] - hint[0], alt[1] - hint[1]);
    if (da + 1.5 < dj && Math.abs(dh) < 4) {
      prevJ[key] = alt;
      return alt;
    }
  }
  prevJ[key] = j;
  return j;
}
function strokePath(pts, w, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.stroke();
}

// opts: { flip: true } faces left, { ink, far } recolours (goons are drawn all grey), { scale } resizes,
// { live: false } for one-off drawings such as the share image (skips joint smoothing between frames).
function drawFigure(a, x, y, breath, opts) {
  const o = opts || {};
  const ink = o.ink || COL.fig || COL.ink;
  const far = o.far || FAR;
  const p = breathe(a.pose, breath || 0);
  const af = Math.min(1, Math.abs(p.face));
  ctx.save();
  ctx.translate(x, y);
  ctx.scale((o.flip ? -1 : 1) * (o.scale || 1), o.scale || 1);
  const sx = p.chest[0] - p.hip[0], sy = p.chest[1] - p.hip[1];
  const sl = Math.hypot(sx, sy) || 1;
  const u = [sx / sl, sy / sl];
  const n = [-u[1], u[0]];
  const sideOff = 6.2 * (1 - af);
  const shF = [p.chest[0] + n[0] * sideOff - u[0], p.chest[1] + n[1] * sideOff - u[1]];
  const shB = [p.chest[0] - n[0] * sideOff - u[0], p.chest[1] - n[1] * sideOff - u[1]];
  const key = a.id || 'me';
  const solve = o.live === false ? (k, aa, bb, l1, l2, h, bd) => ik(aa, bb, l1, l2, h, bd) : (k, aa, bb, l1, l2, h, bd) => ikC(key + k, aa, bb, l1, l2, h, bd);
  const kF = solve('kF', p.hip, p.fF, THIGH, SHIN, p.kF, KNEE_BEND);
  const kB = solve('kB', p.hip, p.fB, THIGH, SHIN, p.kB, KNEE_BEND);
  const handF = reach(shF, p.hF, UARM + FARM);
  const handB = reach(shB, relax(shB, p.hB, p.hang), UARM + FARM);
  const eF = solve('eF', shF, handF, UARM, FARM, p.eF, ARM_BEND);
  const eB = solve('eB', shB, handB, UARM, FARM, p.eB, ARM_BEND);
  const hd = [p.head[0] - p.chest[0], p.head[1] - p.chest[1]];
  const hl = Math.hypot(hd[0], hd[1]) || 1;
  const hc = [p.chest[0] + (hd[0] / hl) * 20.5, p.chest[1] + (hd[1] / hl) * 20.5];
  strokePath([shB, eB, handB], ARM, far);
  strokePath([p.hip, kB, p.fB], LIMB, far);
  strokePath([[p.hip[0] + u[0], p.hip[1] + u[1]], [p.chest[0] + u[0] * 0.5, p.chest[1] + u[1] * 0.5]], TORSO, ink);
  strokePath([p.hip, kF, p.fF], LIMB, ink);
  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(hc[0], hc[1], HEAD_R, 0, Math.PI * 2);
  ctx.fill();
  strokePath([shF, eF, handF], ARM, ink);
  ctx.restore();
  return { head: hc, handF, handB };
}

// ── Ink drawing ────────────────────────────────────────────────────────────
// Ground is a wobbly line at y = 0 in world space, never a filled floor.

function line(x0, y0, x1, y1) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const WOBBLE = Array.from({ length: 512 }, (_, i) => Math.sin(i * 0.37) * 0.35 + Math.sin(i * 1.71 + 1) * 0.22);
function drawGround(xl, xr) {
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const x0 = Math.floor(xl / 6) * 6;
  for (let x = x0; x <= xr + 6; x += 6) {
    const w = WOBBLE[((x / 6) % 512 + 512) % 512];
    if (x === x0) {
      ctx.moveTo(x, w);
    } else {
      ctx.lineTo(x, w);
    }
  }
  ctx.stroke();
}
function contactShadow(x, w, a, y) {
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath();
  ctx.ellipse(x, (y || 0) + 1.2, w, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
// Fill and outline the current path: roundRect(...); inkShape('#fff', 1.5);
function inkShape(fill, lw) {
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.lineWidth = lw || 1.5;
  ctx.strokeStyle = COL.ink;
  ctx.lineJoin = 'round';
  ctx.stroke();
}
// A thick outlined stick, for handles, poles, planks.
function inkBar(x0, y0, x1, y1, w, fill) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = w + 3;
  line(x0, y0, x1, y1);
  ctx.strokeStyle = fill;
  ctx.lineWidth = w;
  line(x0, y0, x1, y1);
}

// ── Popups, particles and shake ────────────────────────────────────────────
// popup('Hoàn hảo!', 'CHUỖI ×2', true) over the action; burst() for hits; dust() for landings.
// Call updateFx(dt) in update() and drawBits(); drawPopups(left, right) last in render(), in world space.

const popups = [];
const bits = [];
let shake = 0, shakeV = 0;

function popup(text, sub, hot, x, y) {
  popups.push({ text, sub, hot, x, y, t: 0 });
}
function burst(x, y, n) {
  const cols = ['#141414', '#141414', '#8d8d8d', '#c8c8c8'];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
    const sp = 70 + Math.random() * 120;
    bits.push({ x: x + (Math.random() - 0.5) * 30, y: y - 3, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 18, c: cols[i % cols.length], t: 0, life: 0.8 + Math.random() * 0.5, w: 2 + Math.random() * 1.6, g: 260, drag: 1.5 });
  }
}
function dust(x, y, w, n) {
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    bits.push({ x: x + side * (w / 2 - 2 - Math.random() * 6), y: y - 1, vx: side * (35 + Math.random() * 75), vy: -(4 + Math.random() * 22), r: (Math.random() - 0.5) * 0.5, vr: (Math.random() - 0.5) * 4, c: i % 3 ? '#b0b0b0' : '#8d8d8d', t: 0, life: 0.3 + Math.random() * 0.25, w: 2 + Math.random() * 2.5, g: 80, drag: 5 });
  }
}
// kick() on big moments; offset the camera by `shake` pixels in render().
function kick(amount) {
  shakeV += amount;
}
function updateFx(dt) {
  shakeV += (-260 * shake - 15 * shakeV) * dt;
  shake += shakeV * dt;
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t > 1.1) {
      popups.splice(i, 1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= 1 - Math.min(1, b.drag * dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.r += b.vr * dt;
    if (b.t > b.life) {
      bits.splice(i, 1);
    }
  }
}
function drawBits() {
  for (const b of bits) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
    ctx.translate(b.x, b.y);
    ctx.rotate(b.r);
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w / 2, -0.9, b.w, 1.8);
    ctx.restore();
  }
}
// left/right are the visible world edges, so popups never get cut off on narrow phones.
function drawPopups(left, right) {
  for (const p of popups) {
    const k = p.t / 1.1;
    const a = k < 0.12 ? k / 0.12 : clamp(1 - (k - 0.55) / 0.45, 0, 1);
    const y = p.y - 26 - 24 * EASE.out(Math.min(1, k * 1.3));
    const sc = 1 + 0.22 * Math.max(0, 1 - k * 5);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = "400 24px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
    let half = ctx.measureText(p.text).width / 2;
    if (p.sub) {
      ctx.font = "400 10px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
      half = Math.max(half, ctx.measureText(p.sub).width / 2 + p.sub.length * 0.75);
    }
    half = half * sc + 10;
    const x = right - left > half * 2 ? clamp(p.x, left + half, right - half) : (left + right) / 2;
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.fillStyle = p.hot ? COL.accent : COL.ink;
    ctx.font = "400 24px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
    ctx.fillText(p.text, 0, 0);
    if (p.sub) {
      ctx.font = "400 10px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
      ctx.letterSpacing = '1.5px';
      ctx.fillText(p.sub, 0, 12);
      ctx.letterSpacing = '0px';
    }
    ctx.restore();
  }
}

// ── Sound ──────────────────────────────────────────────────────────────────
// Everything is synthesized. Call audio() inside the first tap/key handler (browsers block sound before that).
// partial() is a pitched blip, hiss() a filtered noise burst; mix a few for each sound.

let actx = null, bus = null, verb = null;
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      comp.connect(actx.destination);
      bus = actx.createGain();
      bus.gain.value = 0.9;
      bus.connect(comp);
      const len = Math.floor(actx.sampleRate * 1.1);
      const ir = actx.createBuffer(2, len, actx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
        }
      }
      const conv = actx.createConvolver();
      conv.buffer = ir;
      verb = actx.createGain();
      verb.gain.value = 0.16;
      verb.connect(conv).connect(comp);
    } catch (e) {
      actx = null;
    }
  }
  if (actx && actx.state === 'suspended') {
    actx.resume();
  }
}
function voice(wet) {
  const g = actx.createGain();
  g.gain.value = 0;
  g.connect(bus);
  if (wet) {
    const w = actx.createGain();
    w.gain.value = wet;
    g.connect(w).connect(verb);
  }
  return g;
}
function partial(freq, f1, dur, vol, type, wet, delay) {
  if (!actx || vol < 0.003) {
    return;
  }
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator();
  const g = voice(wet);
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (f1 && f1 !== freq) {
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function hiss(dur, vol, type, f0, f1, q, wet, attack, delay) {
  if (!actx || vol < 0.003) {
    return;
  }
  const t = actx.currentTime + (delay || 0);
  const n = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    d[i] = Math.random() * 2 - 1;
  }
  const src = actx.createBufferSource();
  src.buffer = buf;
  const f = actx.createBiquadFilter();
  f.type = type;
  f.Q.value = q || 0.7;
  f.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) {
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  }
  const g = voice(wet);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g);
  src.start(t);
}
function buzz(ms) {
  try {
    if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) {
      navigator.vibrate(ms);
    }
  } catch (e) {
    return;
  }
}
// A starter set; tune pitches and volumes to the game.
const SND = {
  thunk(k) {
    partial(108, 50, 0.22, 0.6 * k, 'sine', 0.12);
    hiss(0.07, 0.34 * k, 'bandpass', 430, 240, 1.1, 0.18);
  },
  tok(k) {
    partial(190, 140, 0.07, 0.3 * k, 'sine', 0.1);
    hiss(0.03, 0.16 * k, 'bandpass', 520, 400, 1.2, 0.1);
  },
  whoosh() {
    hiss(0.25, 0.08, 'bandpass', 600, 1600, 1.4, 0.1, 0.06);
  },
  perfect(n) {
    const scale = [523, 587, 659, 784, 880, 1047, 1175, 1319];
    const f = scale[Math.min(scale.length - 1, Math.max(0, (n || 1) - 1))];
    partial(f, f, 0.4, 0.06, 'triangle', 0.45);
    partial(f * 2, f * 2, 0.35, 0.025, 'sine', 0.5, 0.05);
  },
  hop() {
    partial(320, 620, 0.1, 0.06, 'sine', 0.1);
    hiss(0.12, 0.05, 'bandpass', 900, 1800, 1.2, 0.05);
  },
  slice(k) {

    partial(1400, 700, 0.08, 0.03, 'triangle', 0.2);
  },
  streak(m) {
    const base = m >= 6 ? 784 : 659;
    partial(base, base, 0.22, 0.045, 'triangle', 0.4);
    partial(base * 1.5, base * 1.5, 0.3, 0.035, 'triangle', 0.4, 0.08);
  },
  record() {
    [523, 659, 784, 1047].forEach((f, i) => {
      partial(f, f, 0.32, 0.05, 'triangle', 0.45, 0.1 + i * 0.075);
    });
  },
  lose() {
    partial(220, 90, 0.5, 0.25, 'triangle', 0.3);
    hiss(0.3, 0.1, 'lowpass', 900, 200, 0.7, 0.3);
  },
};

// ── Test modes ─────────────────────────────────────────────────────────────
// ?bot plays by itself like a decent first-timer (reaction delay + aim error), so `pnpm game:check --bot` can
// measure how long a run lasts and grab a mid-game social image. Set window.__bot = true when it's on.
// Never save stats in a test mode.

const Q = new URLSearchParams(location.search);

window.__bot = BOT;

function gauss(r) {
  return (r() + r() + r() - 1.5) / 1.5;
}

// ── Chop Stack ──────────────────────────────────────────────────────────
// The tower is drawn in its own frame: x across, y up is negative, ground at y = 0.

const W0 = 160;
const PLANK_H = 22;
const BASE_H = 60;
const LIFT = 118;
const FS = 0.7;
const TOL = 5;
const DROP_G = 7000;
const JUMP_V = 600;
const JUMP_G = 2300;
const FALL_G = 1500;

P.ready = mk({ hB: [9, -55], eB: [6, -76], hang: 0 }, P.ready);
P.leap = mk({ hB: [8, -138], eB: [4, -118], hang: 0 }, P.leap);

P.squatF = mk({ hF: [30, -72], eF: [14, -66], hB: [26, -70], eB: [10, -64], hang: 0 }, P.squat);

const $ = (id) => document.getElementById(id);
window.__freeze = Q.has('still');

const store = {
  get(k, d) {

      const v = localStorage.getItem(SLUG + '.' + k);

    }

const life = Object.assign({ best: 0, games: 0, floors: 0, bestStreak: 0, seenHint: false }, TEST ? {} : store.get('life', {}));

function resize() {
  fitView();

addEventListener('resize', resize);

// ── State ──────────────────────────────────────────────────────────────────

let mode = 'menu';
let clock = 0, runTime = 0;
const me = new Actor(P.ready);
const fig = { x: 0, tx: 0, y: -BASE_H, vy: 0, air: false, face: 1 };
const view = { fx: 0, fy: -BASE_H - LIFT / 2 };
let tower = [], offcuts = [], plank = null, phase = 'gap', gapT = 0, cuts = [];
let score = 0, streak = 0, bestStreak = 0, perfects = 0, side = 1, lastResult = null;

const topLayer = () => tower[tower.length - 1];
const topY = () => topLayer().y;

function resetTower() {
  tower = [{ x0: -W0 / 2, x1: W0 / 2, y: -BASE_H, h: BASE_H, flash: 0 }];
  offcuts = [];
  cuts = [];
  fig.x = fig.tx = 0;
  fig.y = -BASE_H;
  fig.vy = 0;
  fig.air = false;
  view.fx = 0;
  view.fy = -BASE_H - LIFT / 2;
  side = 1;
}

function spawnPlank() {
  const t = topLayer();
  const n = score;
  const w = t.x1 - t.x0;
  const T = Math.max(1.0, 2.5 - n * 0.05);
  side = -side;
  plank = { w, c: (t.x0 + t.x1) / 2, A: W0 * 1.12, T, dir: side, t: 0, y: t.y - LIFT - 260, vy: 0 };
  phase = 'enter';
  if (mode === 'play') {
    SND.whoosh();
  }
}

function plankX(p, t) {
  const k = t / p.T;
  const tri = 1 - 4 * Math.abs(k - Math.floor(k) - 0.5);
  return p.c + p.A * tri * p.dir - p.w / 2;
}

// ── Game flow ──────────────────────────────────────────────────────────────

function startGame() {
  audio();
  mode = 'play';
  score = 0;
  streak = 0;
  bestStreak = 0;
  perfects = 0;
  runTime = 0;
  resetTower();
  me.clear();
  me.push({ pose: P.ready, d: 0.2 });
  phase = 'gap';
  gapT = 0.25;
  plank = null;
  botPlan = null;
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  updateHud();
}

function endGame() {
  mode = 'over';
  SND.lose();
  kick(120);
  buzz(40);
  life.games++;
  life.floors += score;
  const isBest = score > life.best;
  life.best = Math.max(life.best, score);
  life.bestStreak = Math.max(life.bestStreak, bestStreak);
  store.set('life', life);
  lastResult = { score, isBest, streak: bestStreak, perfects, time: runTime, tower: tower.map((l) => Object.assign({}, l)) };
  window.__lastRun = { score, time: runTime };
  setTimeout(() => {
    $('endScore').textContent = score;
    $('endBest').textContent = life.best;
    $('endChip').style.display = isBest && score > 0 ? '' : 'none';
    $('endFoot').innerHTML = lifetimeLine();
    $('startCard').classList.remove('show');
    $('endCard').classList.add('show');
    $('overlay').classList.add('on');
    $('hud').classList.add('hidden');
    $('hint').classList.add('hidden');
  }, 1100);
}

function lifetimeLine() {
  if (!life.games) {
    return '';
  }
  return `Kỷ lục ${life.best} · chuỗi chuẩn dài nhất ${life.bestStreak}<br>${life.games} lượt · ${life.floors.toLocaleString()} tầng`;
}

function updateHud() {
  const el = $('score');
  if (el.textContent !== String(score)) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  el.textContent = score;
  $('best').textContent = Math.max(life.best, score);
}

function tap() {
  audio();
  if (mode !== 'play' || !plank || (phase !== 'aim' && phase !== 'enter')) {
    return;
  }
  phase = 'drop';
  plank.vy = 300;
  fig.vy = -JUMP_V;
  fig.air = true;
  me.clear();
  me.push({ path: [P.squatF, P.swing, P.leap], d: 0.44 });
  SND.hop();
  if (!life.seenHint) {
    life.seenHint = true;
    store.set('life', life);
    $('hint').classList.add('hidden');
  }
}

function popAt(text, sub, hot) {
  const fx = fig.tx, fy = topY();
  const x = fx - view.fx, y = fy - 60 - view.fy;
  popup(text, sub, hot, x + 120, y);
}

function land() {
  const t = topLayer();
  const p0 = plankX(plank, plank.t), p1 = p0 + plank.w;
  const o0 = Math.max(t.x0, p0), o1 = Math.min(t.x1, p1);
  const y = t.y - PLANK_H;
  kick(60);
  buzz(15);
  if (o1 - o0 < 1) {
    offcuts.push(makeOffcut(p0, p1, y, p0 < t.x0 ? -1 : 1));
    plank = null;
    popAt('Trượt!', '', false);
    SND.thunk(0.5);
    me.clear();
    me.push({ pose: P.whoa, d: 0.18, ez: 'out' });
    endGame();
    return;
  }
  let x0, x1, perfect = false;
  if (Math.abs(p0 - t.x0) <= TOL) {
    perfect = true;
    x0 = t.x0;
    x1 = t.x1;
    streak++;
    perfects++;
    bestStreak = Math.max(bestStreak, streak);
    let grew = false;
    if (streak >= 3 && x1 - x0 < W0) {
      const g = Math.min(10, (W0 - (x1 - x0)) / 2);
      x0 -= g;
      x1 += g;
      grew = true;
    }
    SND.perfect(streak);
    popAt(grew ? 'Nở ra!' : 'Hoàn hảo', streak > 1 ? `${streak} LẦN LIÊN TIẾP` : '', true);
    burst((x0 + x1) / 2, y, grew ? 14 : 8);
  } else {
    x0 = o0;
    x1 = o1;
    streak = 0;
    if (p0 < t.x0) {
      offcuts.push(makeOffcut(p0, t.x0, y, -1));
      cuts.push({ x: t.x0, y, t: 0 });
    } else {
      offcuts.push(makeOffcut(t.x1, p1, y, 1));
      cuts.push({ x: t.x1, y, t: 0 });
    }
    SND.slice(1 - (o1 - o0) / plank.w);
  }
  tower.push({ x0, x1, y, h: PLANK_H, flash: perfect ? 0.45 : 0 });
  plank = null;
  score++;
  updateHud();
  fig.tx = clamp(fig.x, x0 + 12, x1 - 12);
  if (x1 - x0 < 24) {
    fig.tx = (x0 + x1) / 2;
  }
  SND.thunk(0.55);
  phase = 'gap';
  gapT = 0.12;
}

function makeOffcut(x0, x1, y, dir) {
  return { cx: (x0 + x1) / 2, cy: y + PLANK_H / 2, w: x1 - x0, vx: dir * 60, vy: -40, a: 0, va: dir * (2 + Math.random() * 2), t: 0 };
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  tap();
});
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'ArrowDown') {
    return;
  }
  e.preventDefault();
  if (e.repeat) {
    return;
  }
  if (mode !== 'play') {
    if ($('overlay').classList.contains('on')) {
      startGame();
    }
    return;
  }
  tap();
});
addEventListener('contextmenu', (e) => e.preventDefault());
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('shareBtn').addEventListener('click', () => share(lastResult));

// ── Bot ────────────────────────────────────────────────────────────────────
// Picks the next moment the plank lines up and taps with a human timing error.

const botRng = mulberry(7);
let botPlan = null;
function bot() {
  if (!plank || (phase !== 'aim' && phase !== 'enter')) {
    return;
  }
  if (!botPlan || botPlan.plank !== plank) {
    const t = topLayer();
    let at = plank.t + 0.5, best = Infinity;
    for (let s = plank.t + 0.35; s < plank.t + 0.35 + plank.T * 0.6; s += 1 / 240) {
      const d = Math.abs(plankX(plank, s) - t.x0);
      if (d < best) {
        best = d;
        at = s;
      }
    }
    const sloppy = botRng() < 0.08 ? 2.5 : 1;
    botPlan = { plank, at: at + gauss(botRng) * 0.045 * sloppy };
  }
  if (plank.t >= botPlan.at) {
    tap();
  }
}

// ── Update ─────────────────────────────────────────────────────────────────

function update(dt) {
  clock += dt;
  me.update(dt);
  updateFx(dt);
  if (mode === 'play') {
    runTime += dt;
    if (BOT) {
      bot();
    }
  }
  if (mode === 'menu' && !plank) {
    spawnPlank();
  }
  for (const l of tower) {
    l.flash = Math.max(0, l.flash - dt);
  }
  for (let i = cuts.length - 1; i >= 0; i--) {
    cuts[i].t += dt;
    if (cuts[i].t > 0.3) {
      cuts.splice(i, 1);
    }
  }

  const t = topLayer();
  const wantX = (t.x0 + t.x1) / 2, wantY = t.y - LIFT / 2;
  view.fx += (wantX - view.fx) * Math.min(1, dt * 5);
  view.fy += (wantY - view.fy) * Math.min(1, dt * 6);

  if (phase === 'gap' && mode === 'play') {
    gapT -= dt;
    if (gapT <= 0) {
      spawnPlank();
    }
  }
  if (plank) {
    if (phase === 'enter' || phase === 'aim') {
      plank.t += dt;
      const target = topY() - LIFT;
      plank.y += (target - plank.y) * Math.min(1, dt * 12);
      if (phase === 'enter' && target - plank.y < 4) {
        phase = 'aim';
      }
    } else if (phase === 'drop') {
      plank.vy += DROP_G * dt;
      plank.y += plank.vy * dt;
      if (plank.y >= topY() - PLANK_H) {
        land();
      }
    }
  }

  if (fig.air) {
    fig.vy += JUMP_G * dt;
    fig.y += fig.vy * dt;
    fig.x += (fig.tx - fig.x) * Math.min(1, dt * 10);
    if (fig.y >= topY() && fig.vy > 0) {
      fig.y = topY();
      fig.vy = 0;
      fig.air = false;
      fig.x = fig.tx;
      me.clear();
      if (mode === 'over') {
        me.push({ pose: P.land, d: 0.15 }, { pose: P.whoa, d: 0.25 });
      } else {
        me.push({ pose: P.land, d: 0.15 }, { pose: P.lower, d: 0.16 }, { pose: P.ready, d: 0.24 });
      }
      dust(fig.x, fig.y, 22, 4);
    }
  } else {
    fig.y = topY();
  }

  if (plank) {
    const px = plankX(plank, plank.t) + plank.w / 2;
    if (Math.abs(px - fig.x) > 14) {
      fig.face = px > fig.x ? 1 : -1;
    }
  }

  for (let i = offcuts.length - 1; i >= 0; i--) {
    const o = offcuts[i];
    o.t += dt;
    o.vy += FALL_G * dt;
    o.cx += o.vx * dt;
    o.cy += o.vy * dt;
    o.a += o.va * dt;
    if (o.t > 3) {
      offcuts.splice(i, 1);
    }
  }
}

// ── Render ─────────────────────────────────────────────────────────────────

function plankRect(x0, y, w, h, fill, lw) {
  ctx.beginPath();
  ctx.rect(x0, y, w, h);
  inkShape(fill, lw || 2);
}
function drawGrain(x0, y, w, h, seed) {
  ctx.strokeStyle = 'rgba(20,20,20,0.18)';
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  const r = mulberry(seed);
  const n = Math.max(0, Math.floor(w / 60));
  for (let i = 0; i < n; i++) {
    const gx = x0 + 10 + r() * (w - 40);
    const gw = 12 + r() * 18;
    const gy = y + h * (0.35 + r() * 0.3);
    line(gx, gy, gx + gw, gy);
  }
}

function drawTower(yMin, yMax) {
  for (let i = 0; i < tower.length; i++) {
    const l = tower[i];
    if (l.y > yMax || l.y + l.h < yMin) {
      continue;
    }
    plankRect(l.x0, l.y, l.x1 - l.x0, l.h, l.flash > 0 ? COL.butterSoft : '#fff', i === 0 ? 2.2 : 2);
    if (i > 0) {
      drawGrain(l.x0, l.y, l.x1 - l.x0, l.h, i * 31 + 7);
    }
    if (i > 0 && i % 10 === 0 && i < tower.length - 1) {
      ctx.save();
      ctx.translate(l.x0 - 12, l.y + l.h / 2);
      ctx.fillStyle = COL.muted;
      ctx.font = "400 14px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i), 0, 0);
      ctx.restore();
    }
  }
}

function drawOffcut(o) {
  ctx.save();
  ctx.translate(o.cx, o.cy);
  ctx.rotate(o.a);
  plankRect(-o.w / 2, -PLANK_H / 2, o.w, PLANK_H, '#fff', 2);
  ctx.restore();
}

function applyCam(c, s, sx0, sy0) {
  c.setTransform(dpr * s, 0, 0, dpr * s, dpr * sx0, dpr * (sy0 + shake));
  c.translate(-view.fx, -view.fy);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  applyCam(ctx, cam.s, cam.x, cam.y);
  const R = Math.hypot(cw, ch) / cam.s / 2 + 40;

  ctx.save();
  ctx.translate(view.fx, 0);
  drawGround(-R - 400, R + 400);
  ctx.restore();

  drawTower(view.fy - R, view.fy + R);

  if (plank && phase !== 'drop') {
    const x = plankX(plank, plank.t);
    const t = topLayer();
    const o0 = Math.max(t.x0, x), o1 = Math.min(t.x1, x + plank.w);
    if (o1 > o0) {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(o0, t.y - 4, o1 - o0, 4);
    }
  }
  if (plank) {
    const x = plankX(plank, plank.t);
    plankRect(x, plank.y, plank.w, PLANK_H, COL.butter, 2.2);
  }
  for (const c of cuts) {
    const k = c.t / 0.3;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    line(c.x, c.y - 16 - 10 * k, c.x, c.y + PLANK_H + 16 + 10 * k);
    ctx.restore();
  }
  offcuts.forEach(drawOffcut);

  const lift = topY() - fig.y;
  contactShadow(fig.x, 12 * clamp(1 - lift / 200, 0.5, 1), 0.12 * clamp(1 - lift / 120, 0.3, 1), topY() - 1);
  drawFigure(me, fig.x, fig.y + 8 * FS, mode === 'menu' ? Math.sin(clock * 2) * 1.2 : 0, { scale: FS, flip: fig.face < 0 });
  drawBits();

  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * cam.y);
  drawPopups(-cam.x / cam.s, (cw - cam.x) / cam.s);
}

// ── Share image ────────────────────────────────────────────────────────────

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.score), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = font(30);
  ctx.fillText(res.score === 1 ? 'TẦNG' : 'TẦNG', 82, 386);
  ctx.letterSpacing = '0px';
  const stats = [[res.perfects, 'LẦN THẢ CHUẨN'], [res.streak, 'CHUỖI DÀI NHẤT']];
  stats.forEach(([v, label], i) => {
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.letterSpacing = '0px';
    ctx.fillText(String(v), 82, 560 + i * 150);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(label, 84, 600 + i * 150);
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.fillText(GAME.toUpperCase(), 84, 1270);
  ctx.letterSpacing = '0px';

  const layers = res.tower;
  const show = Math.min(layers.length, 24);
  const from = layers.length - show;
  const last = layers[layers.length - 1];
  const sc = 1.7;
  ctx.save();
  ctx.translate(780, 1290);
  ctx.scale(sc, sc);
  ctx.translate(-(last.x0 + last.x1) / 2, -(layers[from].y + layers[from].h));
  for (let i = from; i < layers.length; i++) {
    const l = layers[i];
    plankRect(l.x0, l.y, l.x1 - l.x0, l.h, '#fff', i === 0 ? 2.2 : 2);
    if (i > 0) {
      drawGrain(l.x0, l.y, l.x1 - l.x0, l.h, i * 31 + 7);
    }
  }
  if (from === 0) {
    drawGround(-260, 260);
  }
  const fx = (last.x0 + last.x1) / 2;
  contactShadow(fx, 12, 0.12, last.y - 1);
  drawFigure({ pose: P.cheer }, fx, last.y + 8 * FS, 0, { live: false, scale: FS });
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.score}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  }
}

$('startFoot').innerHTML = lifetimeLine();
resetTower();
if (Q.has('autoplay') || BOT) {
  startGame();
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
