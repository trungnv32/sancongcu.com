<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Đấm Tứ Phía</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    font-family: var(--font); font-weight: 400; overscroll-behavior: none;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; outline: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  button:focus, button:focus-visible, canvas:focus { outline: none; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px 14px; display: grid; gap: 14px; }
  .tally { display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .distrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .korow { display: flex; align-items: center; gap: 12px; }
  #dist { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 5px; transition: color .3s; }
  #dist .unit { font-size: 13px; color: var(--muted); }
  #dist.record, #dist.record .unit { color: var(--amber); }
  #hearts { display: flex; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
  .heart { width: 19px; height: 19px; display: block; transition: opacity .25s; }
  .heart.lost { opacity: .22; }
  .heart.pop { animation: bump .4s ease; }
  #distLabel { font-variant-numeric: tabular-nums; }
  #streak {
    font-size: 14px; color: var(--amber); background: var(--butter-soft); border-radius: 8px; padding: 4px 10px;
    box-shadow: 0 0 0 1px rgba(180, 83, 9, .14); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s;
  }
  #streak.on { opacity: 1; transform: none; }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 12px; }
    #score { font-size: 38px; }
  }
  @media (max-height: 520px) {
    #hud { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); flex-direction: row; align-items: center; }
    .board { display: flex; align-items: center; gap: 16px; padding: 7px 14px; border-radius: 12px; }
    .tally { gap: 14px; align-items: baseline; }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat .label, .distrow .label { margin-top: 0; font-size: 11.5px; }
    #score { font-size: 24px; line-height: 1; }
    #best { font-size: 16px; }
    .distrow { display: flex; align-items: center; gap: 8px; padding: 0 0 0 16px; border-top: 0; border-left: 1px solid var(--line); }
    #dist { font-size: 16px; }
    #distLabel { display: none; }
    .heart { width: 16px; height: 16px; }
    #streak { font-size: 12.5px; padding: 3px 8px; }
  }
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 7px;
  }
  #hint.hidden { opacity: 0; }
  @media (max-height: 520px) {
    #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; font-size: 13px; }
  }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none !important; } }
  @media (hover: hover) { .touch-only { display: none !important; } }

  #zone {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 20px); left: 50%;
    padding: 12px 18px; text-align: center; pointer-events: none; white-space: nowrap;
    opacity: 0; transform: translate(-50%, -8px); transition: opacity .3s ease, transform .4s cubic-bezier(.2, .9, .3, 1);
  }
  #zone.on { opacity: 1; transform: translate(-50%, 0); }
  #zone .zk { font-size: 11.5px; color: var(--amber); letter-spacing: 1.5px; text-transform: uppercase; }
  #zone .zn { font-size: 26px; line-height: 1.05; margin-top: 5px; }
  #zone .zs { font-size: 13px; color: var(--muted); margin-top: 5px; }
  @media (max-width: 560px) {
    #zone { top: calc(env(safe-area-inset-top, 0px) + 222px); right: auto; left: 50%; transform: translate(-50%, -8px); text-align: center; padding: 10px 18px; max-width: calc(100vw - 32px); }
    #zone.on { transform: translate(-50%, 0); }
    #zone .zk { font-size: 10.5px; letter-spacing: 1.2px; }
    #zone .zn { font-size: 22px; margin-top: 3px; }
    #zone .zs { font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  @media (max-height: 520px) {
    #zone { top: calc(env(safe-area-inset-top, 0px) + 62px); right: auto; left: 50%; transform: translate(-50%, -8px); text-align: center; padding: 7px 14px; }
    #zone.on { transform: translate(-50%, 0); }
    #zone .zn { font-size: 18px; margin-top: 3px; }
    #zone .zs { display: none; }
  }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  @media (min-width: 760px) { #overlay.menu { place-items: center start; padding-left: max(6vw, 24px); } }
  @media (max-width: 759px) { #overlay.menu { align-items: start; padding-top: calc(env(safe-area-inset-top, 0px) + 48px); } }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  #startCard .title { margin-bottom: 2px; }
  #startCard .keys { margin: 12px 0 16px; }
  #startCard { padding: 22px; width: min(330px, 100%); }
  .meter { display: flex; align-items: center; gap: 8px; }
  .mbar { width: 92px; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .05); }
  #meterFill { height: 100%; width: 0; background: var(--ink); border-radius: 4px; transition: width .2s; }
  .meter.full #meterFill { background: var(--amber); }
  .meter .label { font-size: 11px; letter-spacing: 1px; }
  .meter.full .label { color: var(--amber); }
  #slamBtn {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 54px); transform: translate(-50%, 10px) scale(.96);
    display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 12px; font-size: 16px;
    background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .25), 0 6px 18px -6px rgba(180, 83, 9, .45);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .9, .3, 1);
  }
  #slamBtn.on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); animation: pulse 1s ease-in-out infinite; }
  #slamBtn kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 1px rgba(180, 83, 9, .25), 0 0 0 7px rgba(252, 211, 77, .35); } }
  @media (max-height: 520px) { #slamBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); height: 38px; font-size: 14px; } .mbar { width: 60px; } }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .btn.busy svg { display: none; }
  .btn.busy::after { content: ''; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--ink); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  #endWhere { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 24px; }
  .result .label { margin-top: 8px; }
  #endKos { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endScore { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  .minis { display: flex; justify-content: space-between; margin: 0 0 28px; }
  .minis .v { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .minis .label { margin-top: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #ffffff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) { .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; } }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<a class="back" href="/" target="_top">← all games</a>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="tally">
      <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
      <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="distrow">
      <div class="korow"><div id="dist"><span id="kosN">0</span><span class="unit">Hạ gục</span></div><div id="hearts"></div></div>
      <div class="meter" id="meter"><div class="mbar"><div id="meterFill"></div></div><div class="label">ĐẬP SÀN</div></div>
      <div class="label" id="distLabel">Con hẻm</div>
    </div>
  </div>
  <div id="streak"></div>
</div>

<div id="zone" class="panel"><div class="zk" id="zoneK"></div><div class="zn" id="zoneN"></div><div class="zs" id="zoneS"></div></div>

<div id="hint" class="hidden">
  <span class="kbd-only"><kbd>&larr;</kbd> <kbd>&rarr;</kbd></span><span class="kbd-only">đấm</span><span class="kbd-only"><kbd>&uarr;</kbd></span><span class="kbd-only">nhảy</span>
  <span class="touch-only">Chạm một bên để đấm · vuốt lên để nhảy</span>
</div>

<div id="overlay" class="on menu">
  <div class="card show" id="startCard">
    <h1 class="title">Đấm Tứ Phía</h1>
    <div class="keys kbd-only"><kbd>&larr;</kbd><kbd>&rarr;</kbd> đấm <kbd>&uarr;</kbd> nhảy <kbd>&darr;</kbd> đập sàn</div>
    <div class="keys touch-only">Chạm một bên để đấm, vuốt lên để nhảy</div>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chiến</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endWhere">Bị hạ</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endKos">0</span><div class="label">Hạ gục</div></div>
      <div><div id="endScore">0</div><div class="label">Điểm</div></div>
    </div>
    <div class="minis">
      <div><div class="v" id="endChain">0</div><div class="label">Combo cao nhất</div></div>
      <div><div class="v" id="endPerf">0%</div><div class="label">Đòn hoàn hảo</div></div>
      <div><div class="v" id="endBoss">0</div><div class="label">Trùm</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Đánh tiếp</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>

<button id="slamBtn"><kbd class="kbd-only">&darr;</kbd><span class="touch-only">Chạm</span><span>ĐẬP SÀN</span></button>
<div id="toast"></div>
<script id="core">
const DT = 1 / 120;
const REACH = 122, SPAWN = 500, AIR_REACH = 160, THROW_D = 262, LEAP_D = 250, SWEEP_D = 100, CRATE_D = 94, CRATE_FROM = 440;
const TUNE = {
  strike: 0.1, whiff: 0.34, inv: 1.3, queueAge: 0.24, hsP: 0.09, hsG: 0.07, hsO: 0.05, hsHurt: 0.13,
  slowT: 0.6, slowK: 0.25, feintT: 0.5, feintD: 34, flipT: 0.46, landT: 0.2, backT: 0.36, perfect: 0.5, good: 0.22, hp: 3, gap: 44,
  jumpT: 0.6, clearH: 0.26, airStrike: 0.12, furyBand: 26, cap: 5, slamT: 0.3, slipT: 1.3, lungeT: 0.2, meter: 26, chuteT: 3.1, aimT: 0.6, retT: 0.34, crouchT: 0.46, leapT: 0.72,
  sweepT: 0.8, openT: 1.15, tossT: 0.78, restT: 1.9,
};
const KINDS = {
  grunt: { speed: 1, hp: 1, stop: 58, wind: 1 },
  runner: { speed: 1.6, hp: 1, stop: 58, wind: 0.9 },
  armour: { speed: 0.88, hp: 2, stop: 58, wind: 1.05 },
  feint: { speed: 1.05, hp: 1, stop: 58, wind: 1 },
  staff: { speed: 0.95, hp: 1, stop: 92, wind: 1.1 },
  boss: { speed: 0.78, hp: 3, stop: 68, wind: 1.25 },
  thrower: { speed: 0.95, hp: 1, stop: THROW_D, wind: 1 },
  leaper: { speed: 1.05, hp: 1, stop: LEAP_D, wind: 1 },
  sweeper: { speed: 0.92, hp: 1, stop: SWEEP_D, wind: 1 },
  barrel: { speed: 1.1, hp: 1, stop: 0, wind: 1, low: true },
  skater: { speed: 1, hp: 1, stop: 0, wind: 1, low: true },
  bottle: { speed: 1, hp: 1, stop: 30, wind: 1, prop: true },
  crate: { speed: 1, hp: 1, stop: 40, wind: 1, prop: true },
};
const NOTE = {
  runner: 'gã chạy · nhanh lắm!', armour: 'mặc giáp · đấm hai lần', feint: 'gã đánh lừa · dừng đột ngột, chờ nó', pair: 'một cặp · hai bên cùng lúc', staff: 'gã cầm gậy · tầm xa hơn, đấm sớm',
  barrel: 'thùng gỗ · {up} để nhảy qua', thrower: 'gã ném · đấm chai bay ngược lại', crate: 'thùng · đập để lấy sức mạnh', leaper: 'gã nhảy · đấm khi nó trên không',
  sweeper: 'gã quét chân · nhảy né rồi đấm', skater: 'gã trượt ván · thấp quá không đấm được, {up}',
};
const FIRST = { 15: 'peel', 7: 'barrel', 12: 'runner', 18: 'thrower', 22: 'crate', 26: 'armour', 37: 'leaper', 46: 'feint', 55: 'pair', 66: 'sweeper', 82: 'staff', 100: 'boss', 112: 'skater' };
const MIX = [
  ['peel', 15, 0.035, 0.035], ['runner', 12, 0.1, 0.14], ['barrel', 7, 0.07, 0.09], ['thrower', 18, 0.06, 0.08], ['armour', 24, 0.08, 0.11], ['crate', 22, 0.065, 0.065],
  ['leaper', 37, 0.06, 0.08], ['feint', 46, 0.07, 0.09], ['pair', 55, 0.05, 0.07], ['sweeper', 66, 0.05, 0.08], ['staff', 82, 0.07, 0.09], ['skater', 112, 0.05, 0.08],
];
const ZONES = [
  { at: 0, d: 0, name: 'Con hẻm', where: 'ở Con hẻm', sub: 'Đấm khi tới tầm. Nhảy qua thùng' },
  { at: 22, d: 0.22, name: 'Võ đường', where: 'ở Võ đường', sub: 'Đập thùng lấy sức mạnh. Đấm gã nhảy giữa không trung' },
  { at: 52, d: 0.38, name: 'Sân thượng', where: 'trên Sân thượng', sub: 'Nhảy né cú quét rồi đấm' },
  { at: 88, d: 0.52, name: 'Toa tàu', where: 'trên Toa tàu', sub: 'Gã trượt ván đi thấp. Nhảy qua' },
  { at: 130, d: 0.64, name: 'Bậc đền', where: 'trên Bậc đền', sub: 'Tất cả cùng lúc' },
];
const HARD_AT = 700;

    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.textBaseline = 'alphabetic';
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.kos), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.font = font(30);
  ctx.fillStyle = COL.muted;
  ctx.fillText(res.kos === 1 ? 'HẠ GỤC' : 'LẦN HẠ GỤC', 82, 386);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = COL.ink;
  ctx.font = font(46);
  const words = res.where.split(' ');
  const lines = [''];
  for (const w of words) {
    const t = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
    if (ctx.measureText(t).width > 560 && lines[lines.length - 1]) {
      lines.push(w);
    } else {
      lines[lines.length - 1] = t;
    }
  }
  lines.forEach((l, i) => ctx.fillText(l, 80, 470 + i * 56));
  const stats = [[String(res.score), 'ĐIỂM'], [String(res.bestCombo), 'COMBO CAO NHẤT'], [res.perfPct + '%', 'ĐÒN HOÀN HẢO']];
  stats.forEach((st, i) => {
    const y = 700 + i * 140;
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.fillText(st[0], 82, y);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(st[1], 84, y + 40);
    ctx.letterSpacing = '0px';
  });
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.letterSpacing = '3px';
  ctx.fillText('ĐẤM TỨ PHÍA', 84, 1196);
  ctx.letterSpacing = '0px';
  const keep = clock;
  clock = 0.7;
  ctx.save();
  ctx.translate(650, 1240);
  ctx.scale(2.9, 2.9);
  drawGround(-170, 140, 40);
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = COL.ink;
    ctx.beginPath();
    ctx.ellipse(-120 + hash(i) * 220, 0.6, 1.5 + hash(i + 3) * 3, 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  drawFigure(P.down, -30, 7, 1, { head: 'hero', band: false });
  drawDazed([-60, -18], 0.6);
  drawFigure(G.taunt, 90, 7, -1, { head: 'goon', hat: hatOf(res.cause, 0, res.cause === 'armour'), plate: res.cause === 'armour', staff: res.cause === 'staff' ? 'wind' : null });
  ctx.save();
  ctx.translate(-118, -6);
  ctx.rotate(0.3);
  ctx.strokeStyle = COL.accent;
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.ellipse(0, 0, 8, 3, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, 1);
  ctx.quadraticCurveTo(-14, 7, -20, 4);
  ctx.stroke();
  ctx.restore();
  ctx.restore();
  clock = keep;
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
async function share(res) {
  const btn = $('shareBtn');
  if (!res || btn.disabled) {
    return;
  }
  btn.disabled = true;
  const later = setTimeout(() => btn.classList.add('busy'), 120);
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `keep-punching-${res.kos}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  } finally {
    clearTimeout(later);
    btn.classList.remove('busy');
    btn.disabled = false;
  }
}

function runSim(n, kinds, maxT) {
  let out = '';
  const q = (arr, f) => [...arr].sort((a, b) => a - b)[Math.min(arr.length - 1, Math.floor(arr.length * f))];
  for (const kind of kinds) {
    const kos = [], ts = [], causes = {}, zones = [0, 0, 0, 0, 0];
    let hits = 0, perf = 0, good = 0, ok = 0, close = 0, whiffs = 0, hurts = 0;
    for (let g = 0; g < n; g++) {
      const R = simGame(1000 + g * 13, kind, maxT);
      kos.push(R.kos);
      ts.push(R.t);
      const c = R.dead ? R.dead.cause : 'alive';
      causes[c] = (causes[c] || 0) + 1;
      zones[R.zone]++;
      hits += R.hits;
      perf += R.perfects;
      good += R.goods;
      ok += R.oks;
      close += R.closes;
      whiffs += R.whiffs;
      hurts += R.hurts;
    }
    const pc = (v) => Math.round((100 * v) / Math.max(1, hits)) + '%';
    out += `bot=${kind} games=${n}\n`;
    out += `  KOs: p10 ${q(kos, 0.1)}  median ${q(kos, 0.5)}  p90 ${q(kos, 0.9)}  max ${Math.max(...kos)}\n`;
    out += `  time s: p10 ${q(ts, 0.1).toFixed(0)}  median ${q(ts, 0.5).toFixed(0)}  p90 ${q(ts, 0.9).toFixed(0)}\n`;
    out += `  zone reached: ${zones.join('/')}   deaths by: ${Object.entries(causes).map(([k, v]) => `${k} ${v}`).join('  ')}\n`;
    out += `  hits: perfect ${pc(perf)}  good ${pc(good)}  early ${pc(ok)}  close calls ${pc(close)}   whiffs/game ${(whiffs / n).toFixed(1)}  hurts/game ${(hurts / n).toFixed(1)}\n`;
  }
  return out;
}

$('best').textContent = life.best;
resize();

window.__freeze = Q.has('still');
if (window.__freeze) {
  const st = document.createElement('style');
  st.textContent = '*{transition:none!important;animation:none!important}';
  document.head.appendChild(st);
}
newRound();
window.__punch = {
  get run() {
    return run;
  },
  get mode() {
    return mode;
  },
  P, G, TUNE, ZONES, KINDS, newRun, tickRun, pressRun, simGame, runSim, makeBot, botTick, diffAt,
  update, render, startGame, endGame, shareCanvas, pathPose,
  get lastResult() {
    return lastResult;
  },
  add(kind, side, d) {
    return addGoon(run, kind, side, d, 260, 0.3);
  },
  force(kind) {
    run.force = kind;
    run.nextAt = run.gt;
  },
  press(side) {
    pressRun(run, side);
  },
  step(sec) {
    const n = Math.round(sec / DT);
    for (let i = 0; i < n; i++) {
      update(DT);
    }
  },
};
(function boot() {
  if (SIM) {
    const kinds = (Q.get('bot') || 'pro,mid,new').split(',');
    const out = runSim(parseInt(Q.get('sim'), 10) || 40, kinds, parseFloat(Q.get('max') || '600'));
    document.body.innerHTML = `<pre id="sim" style="font:13px ui-monospace,monospace;padding:16px">${out}</pre>`;
    return;
  }
  if (Q.get('pose')) {
    me.pose = P[Q.get('pose')] || G[Q.get('pose')] || P.guard;
    $('overlay').classList.remove('on');
    return;
  }
  if (Q.has('poses')) {
    $('overlay').classList.remove('on');
    return;
  }
  if (Q.get('play') || Q.get('bot')) {
    startGame();
  }
  const T = parseFloat(Q.get('t') || '0');
  if (T) {
    const n = Math.round(T / DT);
    for (let i = 0; i < n; i++) {
      update(DT);
    }
  }
  if (Q.get('sharecard') && lastResult) {
    window.__freeze = true;
    setTimeout(() => {
      document.body.innerHTML = '';
      const c = shareCanvas(lastResult);
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain';
      document.body.appendChild(c);
    }, 50);
  }
  if (Q.has('bench')) {
    let ru = 0, rr = 0, worst = 0;
    for (let i = 0; i < 600; i++) {
      const a = performance.now();
      update(1 / 60);
      const b = performance.now();
      render();
      const c = performance.now();
      ru += b - a;
      rr += c - b;
      worst = Math.max(worst, c - b);
    }
    document.title = `update ${(ru / 600).toFixed(2)} ms, render ${(rr / 600).toFixed(2)} ms, worst ${worst.toFixed(1)} ms, kos ${run.kos}`;
  }
})();

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (SIM) {
    return;
  }
  if (!window.__freeze) {
    update(dt);
  }
  if (document.body.contains(cv) && !window.__hold) {
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
