<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Máy Bay Giấy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    font-family: var(--font); font-weight: 400; overscroll-behavior: none;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  button:focus, button:focus-visible { outline: none; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: row; align-items: flex-start; gap: 10px;
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px 14px; display: grid; gap: 14px; }
  .tally { display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .distrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  #dist { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 5px; transition: color .3s; }
  #dist .unit { font-size: 13px; color: var(--muted); }
  #dist.record, #dist.record .unit { color: var(--amber); }
  #distN { display: inline-block; transform-origin: left bottom; }
  #distN.bump { animation: bump .35s ease; }
  #distLabel { font-variant-numeric: tabular-nums; }
  #streak {
    font-size: 14px; color: var(--amber); background: var(--butter-soft); border-radius: 8px; padding: 4px 10px;
    box-shadow: 0 0 0 1px rgba(180, 83, 9, .14); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s;
  }
  #streak.on { opacity: 1; transform: none; }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 12px; }
    #score { font-size: 38px; }
  }
  @media (max-height: 520px) {
    #hud { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); align-items: center; }
    .board { display: flex; align-items: center; gap: 16px; padding: 7px 14px; border-radius: 12px; }
    .tally { gap: 14px; align-items: baseline; }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat .label, .distrow .label { margin-top: 0; font-size: 11.5px; }
    #score { font-size: 24px; line-height: 1; }
    #best { font-size: 16px; }
    .distrow { display: flex; align-items: baseline; gap: 6px; padding: 0 0 0 16px; border-top: 0; border-left: 1px solid var(--line); }
    #dist { font-size: 16px; }
    #streak { font-size: 12.5px; padding: 3px 8px; }
  }
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  @media (max-height: 520px) {
    #hint { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 14px); left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; }
  }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .btn.busy svg { display: none; }
  .btn.busy::after { content: ''; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--ink); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 24px; }
  .result .label { margin-top: 8px; }
  #endDist { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: inline-block; }
  #endDist small { font-size: 26px; color: var(--muted); margin-left: 4px; }
  #endScore { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  .minis { display: flex; justify-content: space-between; margin: 0 0 28px; }
  .minis .v { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .minis .label { margin-top: 6px; }
  #zone {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 20px); right: max(20px, env(safe-area-inset-right, 0px));
    padding: 12px 16px; text-align: right; pointer-events: none; white-space: nowrap;
    opacity: 0; transform: translateY(-8px); transition: opacity .3s ease, transform .4s cubic-bezier(.2, .9, .3, 1);
  }
  #zone.on { opacity: 1; transform: none; }
  #zone .zk { font-size: 11.5px; color: var(--amber); letter-spacing: 1.5px; text-transform: uppercase; }
  #zone .zn { font-size: 26px; line-height: 1.05; margin-top: 5px; }
  #zone .zs { font-size: 13px; color: var(--muted); margin-top: 5px; }
  @media (max-width: 560px) and (min-height: 521px) {
    #zone { top: auto; right: auto; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); text-align: center; transform: translate(-50%, 8px); }
    #zone.on { transform: translate(-50%, 0); }
    #zone .zn { font-size: 22px; }
    #zone .zs { display: none; }
  }
  @media (max-height: 520px) {
    #zone { top: calc(env(safe-area-inset-top, 0px) + 8px); padding: 7px 12px; }
    #zone .zn { font-size: 18px; margin-top: 3px; }
    #zone .zs { display: none; }
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #ffffff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  body:has(#zone.on) .back { opacity: 0; pointer-events: none; }
  .back { transition: opacity .3s ease; }
  @media (max-width: 420px) { .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; } }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="tally">
      <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
      <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="distrow">
      <div id="dist"><span id="distN">0</span><span class="unit">m</span></div>
      <div class="label" id="distLabel">Quãng đường</div>
    </div>
  </div>
  <div id="streak"></div>
</div>

<div id="zone" class="panel"><div class="zk" id="zoneK"></div><div class="zn" id="zoneN"></div><div class="zs" id="zoneS"></div></div>

<div id="hint" class="hidden"><span>Giữ để bay lên, thả để lượn</span><span class="kbd-only">hoặc</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l6.5 2.4L21 4z"/><path d="M21 4 9.5 13.4 11.5 20l2.8-4.6"/><path d="m21 4-6.7 11.4"/></svg></div>
    <h1 class="title">Máy Bay Giấy</h1>
    <div class="keys"><kbd>Giữ</kbd> để bay lên, <kbd>Thả</kbd> để lượn</div>
    <p class="tag">Lượn qua từng phòng. Bay lên lâu quá là rơi.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Phóng</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endWhere">Nhàu nát</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endDist">0</span><div class="label">Quãng đường</div></div>
      <div><div id="endScore">0</div><div class="label">Điểm</div></div>
    </div>
    <div class="minis">
      <div><div class="v" id="endPerf">0</div><div class="label">Hoàn hảo</div></div>
      <div><div class="v" id="endChain">0</div><div class="label">Chuỗi dài nhất</div></div>
      <div><div class="v" id="endStars">0</div><div class="label">Sao</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Phóng lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>

<div id="toast"></div>
<script id="core">
const UNIT = 74, CEIL = 250, DT = 1 / 120, VDT = 1 / 60, SEG = 20;
const PH = { GS: 200, KT: 0.9, UP: 0.62, DN: -0.42, STALL: -0.5, KP: 60, KD: 12.5, VS0: 118, VS1: 150, SINK: 45 };
const LAUNCH = { x: 40, y: -104, v: 230, th: 0.14 };
const HIT = [13, 0, -13, -5, -8, 4, 2, 2];
const FLOOR = { kind: 'floor' }, CEILING = { kind: 'ceiling' };
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const ZONES = [
  { at: 0, d: 0, name: 'Hành lang', sub: 'Luồn qua khe' },
  { at: 75, d: 0.3, name: 'Phòng khách', sub: 'Gió lùa, cờ dây & quạt' },
  { at: 175, d: 0.55, name: 'Nhà bếp', sub: 'Đèn đung đưa · sao vàng' },
  { at: 300, d: 0.78, name: 'Phòng làm việc', sub: 'Đèn nhấp nhô · khe hẹp hơn' },
  { at: 450, d: 0.92, name: 'Gác mái', sub: 'Hết tốc lực · giữ bình tĩnh' },
];
const HARD_AT = 600;
function zoneAt(m) {
  let z = 0;
  while (z + 1 < ZONES.length && m >= ZONES[z + 1].at) {
    z++;
  }
  return z;
}
function cruise(x) {
  return 200 + Math.min(85, (Math.max(0, x) / UNIT) * 0.16);
}
function authority(s) {
  return s.st ? 0 : clamp((s.v - PH.VS0) / 25, 0, 1);
}
function gustAt(W, x) {
  const G = W.gusts;
  for (let i = G.length - 1; i >= 0; i--) {
    const g = G[i];
    if (x >= g.x1) {
      return 0;
    }
    if (x > g.x0) {
      return g.s;
    }
  }
  return 0;
}
function plane(o) {
  return { x: o.x, y: o.y, v: o.v, th: o.th, w: o.w || 0, sink: o.sink || 0, gv: o.gv || 0, st: o.st || 0, vth: o.vth === undefined ? o.th : o.vth, sy: o.sy || 0, t: o.t || 0, a0: o.a0 || 0, sc: o.sc || 0 };
}
function stepPlane(s, hold, dt, W) {
  if (s.st) {
    if (s.v > PH.VS1) {
      s.st = 0;
    }
  } else if (s.v < PH.VS0) {
    s.st = 1;
  }
  const tgt = s.st ? PH.STALL : hold ? PH.UP : lerp(PH.DN, -0.05, clamp(1.7 - s.t, 0, 1));
  s.w += (PH.KP * (tgt - s.th) - PH.KD * s.w) * dt;
  s.th += s.w * dt;
  const hs = W.hs || 1;
  s.v += (-PH.GS * Math.sin(s.th) + PH.KT * (cruise(s.x / hs) - s.v)) * dt;
  s.sink += (s.st * PH.SINK - s.sink) * Math.min(1, dt * 4);
  s.gv += (gustAt(W, s.x) - s.gv) * Math.min(1, dt * 3);
  s.t += dt;
  s.x += s.v * Math.cos(s.th) * dt * hs;
  s.vth = hs === 1 ? s.th : Math.atan2(Math.sin(s.th), Math.cos(s.th) * hs);
  s.y += (s.sink + s.gv - s.v * Math.sin(s.th)) * dt;
}

function lampAngle(p, t) {
  return p.sw ? p.sw * Math.sin(t * p.om + p.ph) : 0;
}
function bobOff(p, t) {
  return p.bob ? p.bob * (0.5 - 0.5 * Math.cos(t * p.bom + p.bph)) : 0;
}
function ceilDrop(p) {
  return p.drop + (p.bob || 0);
}
function buntY(p, x) {
  const u = (x - p.x0) / (p.x1 - p.x0);
  return -CEIL + 5 + p.sag * 4 * u * (1 - u);
}
function hitPiece(p, px, py, m, t, mx) {
  mx = mx === undefined ? m : mx;
  if (px < p.x0 - mx || px > p.x1 + mx) {
    return false;
  }
  if (p.kind === 'bunting') {
    if (px < p.x0 || px > p.x1) {
      return false;
    }
    if (py < buntY(p, px) + 1.5 + m) {
      return true;
    }
    const k = Math.round((px - p.fx0) / p.fs);
    if (k < 0 || k >= p.nf) {
      return false;
    }
    const fx = p.fx0 + k * p.fs;
    return Math.abs(px - fx) < 4 + mx && py < buntY(p, fx) + 9 + m;
  }
  let qx = px, qy = py;
  if (p.sw) {
    if (t === null) {
      mx += p.sw * p.drop;
    } else {
      const a = -lampAngle(p, t);
      const dx = px - p.x, dy = py + CEIL;
      qx = p.x + dx * Math.cos(a) - dy * Math.sin(a);
      qy = -CEIL + dx * Math.sin(a) + dy * Math.cos(a);
    }
  }
  let ext = 0;
  if (p.bob) {
    if (t === null) {
      ext = p.bob;
    } else {
      qy -= bobOff(p, t);
    }
  }
  const R = p.rects;
  for (let j = 0; j < R.length; j += 4) {
    if (qx > R[j] - mx && qx < R[j + 2] + mx && qy > R[j + 1] - m && qy < R[j + 3] + m + ext) {
      return true;
    }
  }
  return false;
}
function hitTest(s, list, m, t, mx) {
  const c = Math.cos(s.vth), sn = Math.sin(s.vth);
  for (let i = 0; i < 8; i += 2) {
    const lx = HIT[i], ly = HIT[i + 1];
    const px = s.x + lx * c + ly * sn, py = s.y - lx * sn + ly * c;
    if (py > -m) {
      return FLOOR;
    }
    if (py < -CEIL + m) {
      return CEILING;
    }
    for (let k = 0; k < list.length; k++) {
      if (hitPiece(list[k], px, py, m, t, mx)) {
        return list[k];
      }
    }
  }
  return null;
}
function pieceDist(p, px, py, t) {
  if (p.kind === 'bunting') {
    if (px < p.x0 - 6 || px > p.x1 + 6) {
      return 99;
    }
    const k = clamp(Math.round((px - p.fx0) / p.fs), 0, p.nf - 1);
    const fx = p.fx0 + k * p.fs;
    const low = Math.abs(px - fx) < 8 ? buntY(p, fx) + 12 : buntY(p, clamp(px, p.x0, p.x1)) + 1.5;
    return py - low;
  }

const PIECE_SOLIDS = { plant: 1, fern: 1, shelf: 1, books: 1 };
function updateBall(dt) {
  const b = ball;
  b.k = Math.min(1, b.k + dt / 0.14);
  if (b.rest > 0.4) {
    return;
  }
  b.vy += 900 * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.a += b.va * dt;
  const R = 6.5;
  let hit = 0;
  if (b.y > -R) {
    b.y = -R;
    if (b.vy > 0) {
      hit = b.vy;
      b.vy = -b.vy * 0.36;
      b.vx *= 0.72;
      b.va = b.vx / R;
    }
  }
  for (let k = Math.max(0, run.si - 1); k < run.W.secs.length && run.W.secs[k].x0 < b.x + 30; k++) {
    for (const p of run.W.secs[k].pieces) {
      if (!PIECE_SOLIDS[p.kind] || b.x < p.x0 - R || b.x > p.x1 + R) {
        continue;
      }
      const r = p.rects;
      for (let j = 0; j < r.length; j += 4) {
        const l = r[j] - R, t = r[j + 1] - R, rr = r[j + 2] + R, bb = r[j + 3] + R;
        if (b.x <= l || b.x >= rr || b.y <= t || b.y >= bb) {
          continue;
        }
        const dl = b.x - l, dr = rr - b.x, dtp = b.y - t;
        const m = Math.min(dl, dr, dtp);
        if (m === dtp) {
          b.y = t;
          if (b.vy > 0) {
            hit = Math.max(hit, b.vy);
            b.vy = -b.vy * 0.36;
            b.vx *= 0.72;
          }
        } else if (m === dl) {
          b.x = l;
          b.vx = -Math.abs(b.vx) * 0.4;
        } else {
          b.x = rr;
          b.vx = Math.abs(b.vx) * 0.4;
        }

      bits.push({ x: b.x + (Math.random() - 0.5) * 10, y: b.y + R, vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 30, r: 0, vr: 0, c: '#b0b0b0', t: 0, life: 0.3, w: 3, g: 80, drag: 5 });

  } else {
    b.rest = 0;
  }

  const eF = solve('eF', shF, handF, UARM, FARM, p.eF, ARM_BEND);
  const eB = solve('eB', shB, handB, UARM, FARM, p.eB, ARM_BEND);
  const hd = [p.head[0] - p.chest[0], p.head[1] - p.chest[1]];
  const hl = Math.hypot(hd[0], hd[1]) || 1;
  const hc = [p.chest[0] + (hd[0] / hl) * 20.5, p.chest[1] + (hd[1] / hl) * 20.5];
  strokePath([shB, eB, handB], ARM, FAR);
  strokePath([p.hip, kB, p.fB], LIMB, FAR);
  strokePath([[p.hip[0] + u[0], p.hip[1] + u[1]], [p.chest[0] + u[0] * 0.5, p.chest[1] + u[1] * 0.5]], TORSO, COL.fig);
  strokePath([p.hip, kF, p.fF], LIMB, COL.fig);
  ctx.fillStyle = COL.fig;
  ctx.beginPath();
  ctx.arc(hc[0], hc[1], HEAD_R, 0, Math.PI * 2);
  ctx.fill();
  if (carry) {
    drawPlane(handF[0] + 5, handF[1] - 3, 0.16, null);
  }
  strokePath([shF, eF, handF], ARM, COL.fig);
  ctx.restore();
}

function drawPopups(xl, xr) {
  for (const p of popups) {
    if (p.t < 0) {
      continue;
    }
    const px = clamp(p.x, xl + 46, xr - 46);
    const k = p.t / 1.1;
    const a = k < 0.12 ? k / 0.12 : clamp(1 - (k - 0.55) / 0.45, 0, 1);
    const y = p.y - 16 - 22 * EASE.out(Math.min(1, k * 1.3));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    if (p.quiet) {
      ctx.fillStyle = COL.muted;
      ctx.font = FONT(12);
      ctx.fillText(p.text, px, y + 6);
    } else {
      const sc = (1 + 0.25 * Math.max(0, 1 - k * 5)) * p.big;
      ctx.translate(px, y);
      ctx.scale(sc, sc);
      ctx.fillStyle = p.hot ? COL.accent : COL.ink;
      ctx.font = FONT(22);
      ctx.fillText(p.text, 0, 0);
      if (p.sub) {
        ctx.font = FONT(9.5);
        ctx.letterSpacing = '1.5px';
        ctx.fillText(p.sub, 0, 12);
        ctx.letterSpacing = '0px';
      }
    }
    ctx.restore();
  }
}
function drawBits() {
  if (!bits.length) {
    return;
  }
  const k = dpr * VT.S, ox = dpr * VT.ox, oy = dpr * VT.oy;
  ctx.save();
  ctx.lineJoin = 'round';
  for (const b of bits) {
    const c = Math.cos(b.r) * k, s = Math.sin(b.r) * k;
    ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
    ctx.setTransform(c, s, -s, c, ox + b.x * k, oy + b.y * k);
    if (b.c === 'paper') {
      ctx.beginPath();
      ctx.moveTo(-b.w / 2, -b.w / 3);
      ctx.lineTo(b.w / 2, -b.w / 4);
      ctx.lineTo(b.w / 5, b.w / 3);
      ctx.closePath();
      inkShape(PAL.white, 0.9);
    } else {
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -0.8, b.w, 1.6);
    }
  }
  ctx.restore();
}

function drawMarks(xl, xr, best, passed) {
  ctx.save();
  ctx.font = FONT(9.5);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(20,20,20,0.35)';
  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  const step = 5 * UNIT * run.W.hs;
  const k0 = Math.max(1, Math.ceil((xl - LAUNCH.x) / step)), k1 = Math.floor((xr - LAUNCH.x) / step);
  for (let k = k0; k <= k1; k++) {
    const x = LAUNCH.x + k * step;
    const big = k % 5 === 0;
    line(x, 4, x, big ? 10 : 7);
    if (big) {
      ctx.fillStyle = '#a3a3a3';
      ctx.fillText(`${k * 5} m`, x, 18);
    }
  }
  if (best >= 1) {
    const bx = LAUNCH.x + best * UNIT * run.W.hs;
    if (bx > xl - 40 && bx < xr + 40) {
      const since = passed >= 0 ? clock - passed : -1;
      const flash = since >= 0 && since < 0.9 ? 1 - since / 0.9 : 0;
      ctx.globalAlpha = since < 0 ? 1 : Math.max(0.35, 1 - since / 1.6);
      ctx.strokeStyle = COL.accent;
      ctx.lineWidth = 1.2 + flash * 2.4;
      ctx.setLineDash([3, 4]);
      line(bx, -2, bx, -CEIL + 2);
      ctx.setLineDash([]);
      ctx.fillStyle = COL.accent;
      ctx.textAlign = 'left';
      ctx.fillText(since >= 0 ? 'kỷ lục cũ' : `kỷ lục ${Math.floor(best)} m`, bx + 5, 12);
    }
  }
  ctx.restore();
}

function view() {
  const S = cam.s * camZ;
  const pvx = (piv.x - camX) * cam.s, pvy = cam.oy + piv.y * cam.s;
  return { S, ox: pvx - piv.x * S, oy: pvy - piv.y * S };
}

let passedAt = -1;
const VT = { S: 1, ox: 0, oy: 0, live: false };
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const V = run ? view() : null;
  const sh = shake > 0.01 ? shake * 5 : 0;
  const ox = V ? V.ox + (sh ? (Math.random() - 0.5) * sh : 0) : 0, oy = V ? V.oy + (sh ? (Math.random() - 0.5) * sh : 0) : 0;
  const pat = bgPattern();
  bgMat.e = Math.round(((((12 + ox) % 24) + 24) % 24) * dpr);
  bgMat.f = Math.round(12 * dpr);
  pat.setTransform(bgMat);
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!run) {
    return;
  }
  const S = V.S;
  VT.S = S;
  VT.ox = ox;
  VT.oy = oy;
  VT.live = true;
  ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
  const xl = -ox / S - 4, xr = (cw - ox) / S + 4, yt = -oy / S - 4, yb = (ch - oy) / S + 4;
  const t = run.phase === 'fly' ? run.t : run.phase === 'dead' ? run.t + clock - deadAt : clock;
  drawScene(xl, xr, yt, yb, t, run.W.secs, run.W.windows, run.W.stars, true);
  drawBits();
  drawPopups(xl, xr);
  if (Q.has('hit')) {
    drawHitboxes(t);
  }
  VT.live = false;
}
function drawHitboxes(t) {
  ctx.save();
  ctx.strokeStyle = COL.accent;
  ctx.lineWidth = 0.6;
  for (const sec of run.W.secs) {
    for (const p of sec.pieces) {
      if (p.kind === 'bunting') {
        continue;
      }
      ctx.save();
      if (p.sw) {
        ctx.translate(p.x, -CEIL);
        ctx.rotate(lampAngle(p, t));
        ctx.translate(-p.x, CEIL);
      }
      if (p.bob) {
        ctx.translate(0, bobOff(p, t));
      }
      for (let j = 0; j < p.rects.length; j += 4) {
        ctx.strokeRect(p.rects[j], p.rects[j + 1], p.rects[j + 2] - p.rects[j], p.rects[j + 3] - p.rects[j + 1]);
      }
      ctx.restore();
    }
  }
  const s = run.p, c = Math.cos(s.vth), sn = Math.sin(s.vth);
  ctx.fillStyle = COL.accent;
  for (let i = 0; i < 8; i += 2) {
    ctx.fillRect(s.x + HIT[i] * c + HIT[i + 1] * sn - 0.8, s.y - HIT[i] * sn + HIT[i + 1] * c - 0.8, 1.6, 1.6);
  }
  ctx.restore();
}

function drawScene(xl, xr, yt, yb, t, secs, windows, stars, live) {
  drawZones(xl, xr, run.W.hs || 1);
  drawDeco(xl, xr, t);
  for (const g of windows) {
    if (g.wx + g.ww + 30 > xl && g.wx - 30 < xr) {
      drawGustWindow(g, t, 1);
      drawGustLabel(g);
    }
  }
  if (live) {
    drawWisps();
  }
  drawRoom(xl, xr, yt, yb);
  if (live) {
    drawMarks(xl, xr, run.prevBest, run.passedBest ? passedAt : -1);
  }
  for (const sec of secs) {
    if (sec.x1 < xl - 30 || sec.x0 > xr + 30) {
      continue;
    }
    for (const p of sec.pieces) {
      drawPiece(p, t);
    }
  }
  for (const s of stars) {
    if (!s.got && s.x > xl - 20 && s.x < xr + 20) {
      drawStar(s, t);
    }
  }
  if (!live) {
    return;
  }
  const carry = run.phase === 'hand' || run.phase === 'throw';
  if (fig.x > xl - 60 && fig.x < xr + 60) {
    contactShadow(fig.x + 4, 13, 0.12);
    drawFigure(me.pose, fig.x, 6, me.breath * (Math.sin(clock * 2.1) + 1) * 0.5, true, carry);
  }
  if (run.phase === 'fly' || run.phase === 'dead') {
    drawTrail(trail, 1);
  }
  if (run.phase === 'fly') {
    const s = run.p;
    const h = -IP.y;
    contactShadow(IP.x, 12 * (1 - h / 400), 0.13 * Math.max(0, 1 - h / 320));
    const warn = !s.st && run.hold && s.v < PH.VS0 + 16;
    const jit = s.st ? Math.sin(clock * 47) * 0.09 : warn ? Math.sin(clock * 40) * 0.035 : 0;
    drawPlane(IP.x, IP.y, IP.th, { jit, sq: clamp(s.w / 3, -1, 1), pop: Math.sin(Math.min(1, pop) * Math.PI) * pop });
  }
  if (ball) {
    contactShadow(ball.x, 7 * (1 + ball.y / 300), 0.14 * Math.max(0, 1 + ball.y / 260));
    drawBall(ball);
  }
}

function update(dt) {
  if (slow > 0) {
    slow -= dt;
    dt *= 0.35;
  }
  clock += dt;
  me.update(dt);
  const wantBreath = mode !== 'play' || (run && run.phase === 'fly' && me.idle) ? 1 : 0;
  me.breath += (wantBreath - me.breath) * Math.min(1, dt * 3);
  if (!run) {
    return;
  }
  if (run.phase === 'fly' && mode === 'play') {
    acc += dt;
    while (acc >= DT && run.phase === 'fly') {
      acc -= DT;
      const h = bot ? botTick(bot, run) : holding();
      const s = run.p;
      IP.x0 = s.x;
      IP.y0 = s.y;
      IP.th0 = s.vth;
      tickRun(run, h);
      const lp = trail[trail.length - 1];
      if (!lp || Math.abs(s.x - lp.x) > 5) {
        trail.push({ x: s.x - Math.cos(s.vth) * 11, y: s.y + Math.sin(s.vth) * 11 - 1, hot: run.combo >= 2 });
        if (trail.length > 260) {
          trail.shift();
        }
      }
      for (const e of run.ev) {
        onEvent(e);
        if (e.k === 'record') {
          passedAt = clock;
        }
      }
      run.ev.length = 0;
      if (run.W.secs.length > 80 && run.si > 60) {
        run.W.secs.splice(0, 30);
        run.si -= 30;
      }
    }
    const k = clamp(acc / DT, 0, 1);
    IP.x = lerp(IP.x0, run.p.x, k);
    IP.y = lerp(IP.y0, run.p.y, k);
    IP.th = lerp(IP.th0, run.p.vth, k);
    if (Math.floor(run.dist) !== hudDist) {
      updateHud();
    }
    if (Math.floor(run.dist / 50) > mile) {
      mile = Math.floor(run.dist / 50);
      popup(`${mile * 50} m`, '', false, true, LAUNCH.x + mile * 50 * UNIT * run.W.hs, -8);
      partial(1175, 1175, 0.3, 0.025, 'sine', 0.4);
      partial(1760, 1760, 0.3, 0.018, 'sine', 0.4, 0.06);
    }
    const sp = run.p;
    if (run.combo >= 6 && Math.random() < dt * (run.combo >= 10 ? 26 : 14)) {
      bits.push({ x: sp.x - 14 - Math.random() * 10, y: sp.y + (Math.random() - 0.5) * 12, vx: -90 - Math.random() * 60, vy: (Math.random() - 0.5) * 20, r: 0, vr: 0, c: Math.random() < 0.5 ? COL.butterHi : COL.accent, t: 0, life: 0.3 + Math.random() * 0.2, w: 6 + Math.random() * 8, g: 0, drag: 3 });
    }
    if (sp.v > 250 && Math.random() < (sp.v - 250) * dt * 0.5) {
      bits.push({ x: sp.x + 30 + Math.random() * 60, y: sp.y + (Math.random() - 0.5) * 50, vx: -20, vy: 0, r: -sp.vth * 0.5, vr: 0, c: '#c4c4c4', t: 0, life: 0.25 + Math.random() * 0.15, w: 14 + Math.random() * 16, g: 0, drag: 0 });
    }
  }
  if (ball) {
    updateBall(dt);
  }
  updateFig(dt);
  const need = camX + cam.vw / camZ + 420;
  if (run.W.genX < camX + cam.vw + 60) {
    ensureWorld(run.W, need, 0);
  } else {
    ensureWorld(run.W, need, SIM ? 0 : performance.now() + 2.5);
  }

  const s = run.p;
  if (run.phase === 'fly') {
    look += ((s.v - 210) * 0.45 * run.W.hs - look) * Math.min(1, dt * 1.5);
    camX = camTarget();
  } else if (run.phase === 'dead' && ball) {
    const tx = ball.x - cam.vw * 0.48;
    camX += (Math.max(camX, tx) - camX) * Math.min(1, dt * 2.2);
    camZ += (1.07 - camZ) * Math.min(1, dt * 3);
    piv.x += (ball.x - piv.x) * Math.min(1, dt * 3);
    piv.y += (ball.y - piv.y) * Math.min(1, dt * 3);
  } else {
    camX += (camTarget() - camX) * Math.min(1, dt * 6);
  }
  if (mode === 'menu' || mode === 'over') {
    camZ += (1 - camZ) * Math.min(1, dt * 2);
  }
  shake = Math.max(0, shake - dt * 3.2);
  pop = Math.max(0, pop - dt * 3.5);

  updateWisps(dt);
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t > 1.1) {
      popups.splice(i, 1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= 1 - Math.min(1, b.drag * dt);
    b.vy *= 1 - Math.min(1, b.drag * 0.4 * dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.r += b.vr * dt;
    if (b.t > b.life) {
      bits[i] = bits[bits.length - 1];
      bits.pop();
    }
  }
  airT -= dt;
  if (airT <= 0) {
    airT = 0.06;
    if (run.phase === 'fly' && mode === 'play') {
      const k = clamp((s.v - 110) / 180, 0, 1);
      airSet(0.012 + 0.05 * k * k + (run.hold ? 0.008 : 0), 380 + s.v * 3.2);
    } else {
      airSet(0, 400);
    }
  }
  if (run.phase === 'dead' && mode === 'play') {
    if (fig.mode === 'stand' && clock - deadAt > 0.12) {
      startChase();
    }
    if (clock - deadAt > 1.15) {
      endGame();
    }
  }
}

let gustIn = null;
function updateWisps(dt) {
  const xl = camX - 40, xr = camX + cam.vw + 40;
  for (const g of run.W.windows) {
    if (g.x1 < xl || g.x0 > xr) {
      continue;
    }
    g.acc = (g.acc || 0) + dt * (g.x1 - g.x0) * 0.055;
    while (g.acc > 1) {
      g.acc -= 1;
      const dir = g.s < 0 ? 1 : -1;
      wisps.push({ x: g.x0 + 10 + Math.random() * (g.x1 - g.x0 - 20), y: -20 - Math.random() * (CEIL - 40), dir, t: 0, life: 0.8 + Math.random() * 0.6, len: 18 + Math.random() * 22, ph: Math.random() * 6, v: 110 + Math.random() * 60 });
    }
  }
  for (let i = wisps.length - 1; i >= 0; i--) {
    const w = wisps[i];
    w.t += dt;
    w.y -= w.dir * w.v * dt;
    if (w.t > w.life) {
      wisps.splice(i, 1);
    }
  }
  if (run.phase === 'fly') {
    const gx = run.W.windows.find((g) => run.p.x > g.x0 - 160 && run.p.x < g.x1);
    if (gx && gx !== gustIn) {
      gustIn = gx;
      SND.gust(1);
    }
  }
}

    btn.disabled = false;
  }

function runSim(n) {
  const kinds = (Q.get('bot') || 'new,mid,pro').split(',');
  const maxT = parseFloat(Q.get('max') || '400');
  let out = '';
  const q = (arr, f) => [...arr].sort((a, b) => a - b)[Math.min(arr.length - 1, Math.floor(arr.length * f))];
  for (const kind of kinds) {
    const ts = [], ds = [], sc = [], pf = [], deaths = {};
    for (let g = 0; g < n; g++) {
      const R = simGame(1000 + g * 13, kind, maxT);
      ts.push(R.t);
      ds.push(R.dist);
      sc.push(R.score);
      pf.push(R.perfects / Math.max(1, R.passed));
      const hk = R.hit ? R.hit.kind : 'alive';
      deaths[hk] = (deaths[hk] || 0) + 1;
    }
    out += `bot=${kind} games=${n}\n`;
    out += `time s: p10 ${q(ts, 0.1).toFixed(0)}  median ${q(ts, 0.5).toFixed(0)}  p90 ${q(ts, 0.9).toFixed(0)}\n`;
    out += `distance m: median ${q(ds, 0.5).toFixed(0)}  p90 ${q(ds, 0.9).toFixed(0)}  max ${Math.max(...ds).toFixed(0)}\n`;
    out += `score: median ${q(sc, 0.5)}  p90 ${q(sc, 0.9)}  perfect rate ${((pf.reduce((a, b) => a + b, 0) / n) * 100).toFixed(0)}%\n`;
    out += `deaths: ${Object.entries(deaths).map(([k, v]) => `${k} ${v}`).join('  ')}\n\n`;
  }
  return out;
}

$('startFoot').innerHTML = lifetimeLine();
$('best').textContent = life.best;

window.__freeze = /[?&]still/.test(location.search);
if (window.__freeze) {
  const st = document.createElement('style');
  st.textContent = '*{transition:none!important;animation:none!important}';
  document.head.appendChild(st);
}
newRound();
(function fastForward() {
  if (SIM) {
    const out = runSim(parseInt(Q.get('sim'), 10) || 20);
    document.body.innerHTML = `<pre id="sim">${out}</pre>`;
    return;
  }
  if (Q.get('play')) {
    startGame();
  }
  if (Q.has('bench')) {
    let ru = 0, rr = 0, worst = 0;
    for (let i = 0; i < 1200; i++) {
      const a = performance.now();
      update(1 / 60);
      const b = performance.now();
      render();
      const c = performance.now();
      ru += b - a;
      rr += c - b;
      worst = Math.max(worst, c - b);
    }
    document.title = `update ${(ru / 1200).toFixed(2)} ms, render ${(rr / 1200).toFixed(2)} ms, worst render ${worst.toFixed(1)} ms, x ${run.p.x.toFixed(0)}, ${run.phase}`;
    return;
  }
  const T = parseFloat(Q.get('t') || '0');
  if (!T) {
    return;
  }
  const holds = (Q.get('p') || '').split(',').filter(Boolean).map((s) => s.split('-').map(parseFloat));
  let t = 0;
  while (t < T) {
    const want = holds.some((h) => t >= h[0] && t < (h[1] || h[0] + 0.15));
    if (want && !ptrs.has(1)) {
      ptrs.add(1);
      press();
    } else if (!want && ptrs.has(1)) {
      ptrs.delete(1);
      release();
    }
    update(1 / 120);
    t += 1 / 120;
  }
  if (Q.get('sharecard') && lastResult) {
    window.__freeze = true;
    Promise.resolve().then(() => setTimeout(() => {
      document.body.innerHTML = '';
      const c = shareCanvas(lastResult);
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain';
      document.body.appendChild(c);
    }, 50));
  }
})();

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  if (document.body.contains(cv)) {
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
