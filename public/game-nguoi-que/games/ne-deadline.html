<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Né Deadline</title>

<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    background-image: radial-gradient(circle, var(--dot) 0.8px, transparent 1px);
    background-size: 24px 24px; background-position: 12px 12px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px; display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 28px; margin: 22px 0 28px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endBest, #endCups { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; }
    #score { font-size: 38px; }
    .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; }
  }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← tất cả game</a>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
    <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
  </div>
</div>

<div id="hint" class="hidden"><span>Chạm để nhảy</span><span class="kbd-only">hoặc</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><circle cx="12" cy="14" r="3.6"/><path d="M12 12.2V14l1.3 1"/></svg></div>
    <h1 class="title">Né Deadline</h1>
    <div class="keys"><kbd>Chạm</kbd> để nhảy qua tờ deadline</div>
    <p class="tag">Né mỗi tờ được 1 điểm, chụp ly cà phê trên cao +3. Sếp giao càng lúc càng gấp.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chơi</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← Tất cả game</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label">Trễ deadline rồi!</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Điểm</div></div>
      <div><div id="endCups">0</div><div class="label">Cà phê</div></div>
      <div><div id="endBest">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Chơi lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Tải ảnh" title="Tải ảnh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← Tất cả game</a>
  </div>
</div>
<div id="toast"></div>

<script>
const SLUG = 'ne-deadline';
const GAME = 'Né Deadline';
const FONT = "'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif";
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', butter: '#fde68a', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// Shared building blocks, copied from references/snippets.js. Keep what you use, delete the rest.

// ── Helpers ────────────────────────────────────────────────────────────────

const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};

function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Fitting the world to any screen ────────────────────────────────────────
// Design the game in fixed world units (a VIEW box), then scale it to fit the screen, leaving room for the HUD.
// Draw with ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * cam.y) and world coordinates.
// Portrait phones can't fit the whole width at a readable size, so they show at least minW world units
// centred on focusX (put the action there), and things off to the side scroll or roll into view.

const VIEW = { x0: -260, x1: 260, y0: -360, y1: 80, minW: 320, focusX: -55 };
let dpr = 1, cw = 0, ch = 0, cam = { s: 1, x: 0, y: 0 };

function fitView() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = innerWidth;
  ch = innerHeight;
  const narrow = cw < ch;
  const top = narrow ? 150 : 110;
  const bottom = 64;
  const vw = VIEW.x1 - VIEW.x0, vh = VIEW.y1 - VIEW.y0;
  const fitH = (ch - top - bottom) / vh;
  const s = narrow ? Math.min(fitH, cw / VIEW.minW, 1.75) : Math.min((cw - 120) / vw, fitH, 1.75);
  const centre = narrow ? VIEW.focusX : (VIEW.x0 + VIEW.x1) / 2;
  cam = {
    s,
    x: cw / 2 - centre * s,
    y: top + (ch - top - bottom - vh * s) * (narrow ? 0.62 : 0.6) - VIEW.y0 * s,
  };
}
function toWorld(px, py) {
  return [(px - cam.x) / cam.s, (py - cam.y) / cam.s];
}

// ── Stick figure ───────────────────────────────────────────────────────────
// Poses are joint positions in figure space: facing right, feet near y = -8, head near y = -121.
// Draw at (x, groundY + 8) so the feet touch the ground. Needs: Helpers, strokePath, COL.fig.
// Make new poses with mk({...}) by moving a few joints of BASE; play them with an Actor.

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const LIMB = 5, ARM = 4.2, TORSO = 8.5, HEAD_R = 7.8, FAR = '#9a9a9a';
const BASE = {
  face: 1,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({});
P.ready = mk({ head: [2, -121], hF: [15, -84], eF: [5, -71], hB: [-4, -56], eB: [-6, -77] });
P.crouch = mk({ head: [6, -100], chest: [4, -76], hip: [-2, -46], kF: [24, -30], kB: [12, -28], hF: [16, -60], eF: [10, -56], hB: [-8, -52], eB: [-8, -60] });
P.leap = mk({ head: [4, -124], chest: [2, -99], hip: [0, -68], fF: [14, -30], fB: [-14, -26], kF: [20, -52], kB: [-2, -48], hF: [18, -140], eF: [16, -120], hB: [-14, -134], eB: [-12, -116] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-12, -134], eF: [14, -118], eB: [-12, -116] });
P.wince = mk({ head: [-3, -118], chest: [-2, -94], hip: [0, -65], kF: [20, -37], hF: [7, -125], eF: [19, -111], hB: [-7, -125], eB: [-20, -109] });
P.phew = mk({ head: [-1, -120], chest: [-1, -95], hip: [0, -65], hF: [13, -80], eF: [4, -68], hB: [2, -122], eB: [-14, -106] });
P.punch = mk({ head: [8, -118], chest: [6, -94], hip: [0, -64], kF: [24, -36], kB: [-8, -34], fF: [18, -8], fB: [-16, -8], hF: [44, -98], eF: [26, -96], hB: [2, -88], eB: [-6, -78] });

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];

// Joints only bend the way real ones do, in the figure's own facing-right space (y down):
// an elbow folds the forearm toward the front of the body (ARM_BEND), a knee folds the shin back (KNEE_BEND).
// Pass the bend as the last argument; the hint then only matters when the limb is almost straight.
const ARM_BEND = -1, KNEE_BEND = 1;
function ik(a, b, l1, l2, hint, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let d = Math.hypot(dx, dy);
  const base = Math.atan2(dy, dx);
  // Ease into full extension so a straightening limb's joint doesn't race across the last few units.
  const L = l1 + l2, soft = L * 0.96;
  if (d > soft) {
    d = soft + (L - soft) * (1 - Math.exp(-(d - soft) / (L - soft)));
  }
  d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(L - 0.001, d));
  const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
  const ang = Math.acos(c);
  const j1 = [a[0] + l1 * Math.cos(base + ang), a[1] + l1 * Math.sin(base + ang)];
  const j2 = [a[0] + l1 * Math.cos(base - ang), a[1] + l1 * Math.sin(base - ang)];
  if (bend) {
    const side = (j) => (j[0] - a[0]) * (b[1] - j[1]) - (j[1] - a[1]) * (b[0] - j[0]);
    return Math.sign(side(j1)) === bend ? j1 : j2;
  }
  const d1 = Math.hypot(j1[0] - hint[0], j1[1] - hint[1]);
  const d2 = Math.hypot(j2[0] - hint[0], j2[1] - hint[1]);
  return d1 < d2 ? j1 : j2;
}
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function pathPose(list, u) {
  const n = list.length - 1;
  const x = Math.min(n - 1e-6, Math.max(0, u * n));
  const i = Math.floor(x), t = x - i;
  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  return o;
}

// An Actor plays queued pose steps: actor.push({ pose: P.crouch, d: 0.12 }, { pose: P.leap, d: 0.2, ez: 'out' }).
// A step can also be { path: [P.a, P.b, P.c], d } for a smooth curve through several poses, or { fn: () => {} } to run code.
class Actor {
  constructor(pose) {
    this.pose = pose || P.ready;
    this.q = [];
    this.step = null;
    this.t = 0;
    this.id = Math.random().toString(36).slice(2);
  }
  push(...steps) {
    this.q.push(...steps);
  }
  clear() {
    this.q = [];
    this.step = null;
  }
  get idle() {
    return !this.step && !this.q.length;
  }
  update(dt) {
    for (let guard = 0; guard < 20; guard++) {
      if (!this.step) {
        if (!this.q.length) {
          return;
        }
        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {
          const fn = this.step.fn;
          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);
        this.step.list = [this.pose, ...targets];
      }
      this.t += dt;
      const s = this.step;
      const k = Math.min(1, this.t / s.d);
      this.pose = pathPose(s.list, (EASE[s.ez] || EASE.soft)(k));
      if (k < 1) {
        return;
      }
      dt = this.t - s.d;
      this.step = null;
    }
  }
}

// A back hand resting low under the shoulder hangs from a nearly straight arm, the way a relaxed arm does.
// Set hang: 0 on a pose when the back hand has to work there (it blends between poses like any number).
function relax(sh, t, amount) {
  const dx = t[0] - sh[0], dy = t[1] - sh[1];
  const d = Math.hypot(dx, dy);
  const want = (UARM + FARM) * 0.96;
  if (dy <= 0 || d < 1 || d >= want) {
    return t;
  }
  const w = (amount ?? 1) * Math.min(1, Math.max(0, (dy / d - 0.8) / 0.18));
  const k = w * w * (3 - 2 * w);
  const nd = d + (want - d) * k;
  return [sh[0] + (dx / d) * nd, sh[1] + (dy / d) * nd];
}
function reach(a, b, max) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d = Math.hypot(dx, dy);
  if (d <= max) {
    return b;
  }
  return [a[0] + (dx / d) * max, a[1] + (dy / d) * max];
}
function breathe(p, amt) {
  if (!amt) {
    return p;
  }
  const o = Object.assign({}, p);
  const up = (v, k) => [v[0], v[1] - amt * k];
  o.head = up(p.head, 1);
  o.chest = up(p.chest, 0.85);
  o.hF = up(p.hF, 0.6);
  o.hB = up(p.hB, 0.6);
  return o;
}
const prevJ = {};
function mirrorJoint(a, b, j) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy || 1;
  const t = ((j[0] - a[0]) * dx + (j[1] - a[1]) * dy) / L2;
  const px = a[0] + dx * t, py = a[1] + dy * t;
  return [2 * px - j[0], 2 * py - j[1]];
}
function ikC(key, a, b, l1, l2, hint, bend) {
  const j = ik(a, b, l1, l2, hint, bend);
  if (bend) {
    prevJ[key] = j;
    return j;
  }
  const pj = prevJ[key];
  if (pj) {
    const alt = mirrorJoint(a, b, j);
    const dj = Math.hypot(j[0] - pj[0], j[1] - pj[1]);
    const da = Math.hypot(alt[0] - pj[0], alt[1] - pj[1]);

// opts: { flip: true } faces left, { ink, far } recolours (goons are drawn all grey), { scale } resizes,

// ── Popups, particles and shake ────────────────────────────────────────────
// popup('Hoàn hảo!', 'CHUỖI ×2', true) over the action; burst() for hits; dust() for landings.

// ── Sound ──────────────────────────────────────────────────────────────────

  tok(k) {

    hiss(0.03, 0.16 * k, 'bandpass', 520, 400, 1.2, 0.1);
  },
  whoosh() {
    hiss(0.25, 0.08, 'bandpass', 600, 1600, 1.4, 0.1, 0.06);
  },
  perfect() {
    partial(1568, 1568, 0.5, 0.035, 'sine', 0.5, 0.04);
    partial(2093, 2093, 0.45, 0.028, 'sine', 0.5, 0.1);
  },
  streak(m) {
    const base = m >= 6 ? 784 : 659;
    partial(base, base, 0.22, 0.045, 'triangle', 0.4);
    partial(base * 1.5, base * 1.5, 0.3, 0.035, 'triangle', 0.4, 0.08);
  },
  record() {
    [523, 659, 784, 1047].forEach((f, i) => {
      partial(f, f, 0.32, 0.05, 'triangle', 0.45, 0.1 + i * 0.075);
    });
  },
  slurp() {
    partial(520, 900, 0.12, 0.08, 'sine', 0.3);
    partial(780, 1320, 0.16, 0.06, 'triangle', 0.35, 0.07);
    hiss(0.12, 0.05, 'bandpass', 1800, 2600, 2, 0.2, 0.01, 0.02);
  },
  rustle() {
    hiss(0.35, 0.12, 'highpass', 2500, 4200, 0.8, 0.2, 0.01);
    hiss(0.2, 0.08, 'bandpass', 1400, 900, 1.2, 0.2, 0.01, 0.12);
  },
  lose() {
    partial(220, 90, 0.5, 0.25, 'triangle', 0.3);
    hiss(0.3, 0.1, 'lowpass', 900, 200, 0.7, 0.3);
  },
};

function gauss(r) {

}

// tap to jump over them. Coffee cups float up high: catch them mid-jump for a bonus. It keeps speeding up.

const HOP = 790;
const FIG_X = -110;

const PAPER_W = 42, PAPER_H = 32;

const life = Object.assign({ best: 0, games: 0, dodged: 0, cups: 0, bestChain: 0, seenHint: false }, TEST ? {} : store.get('life', {}));

// Run cycle (same keys as Keep Rolling), played on a looping spline.
const TAU = Math.PI * 2;
P.runA = mk({ hang: 0, head: [9, -120], chest: [6, -95], hip: [0, -65], fF: [21, -9], kF: [17, -38], fB: [-19, -14], kB: [-5, -37], hF: [-15, -60], hB: [24, -78] });
P.runB = mk({ hang: 0, head: [8, -123], chest: [5, -98], hip: [0, -67], fF: [-1, -8], kF: [9, -38], fB: [5, -35], kB: [18, -49], hF: [1, -57], hB: [9, -58] });
P.runC = mk({ hang: 0, head: [9, -120], chest: [6, -95], hip: [0, -65], fF: [-19, -14], kF: [-5, -37], fB: [21, -9], kB: [17, -38], hF: [24, -78], hB: [-15, -60] });
P.runD = mk({ hang: 0, head: [8, -123], chest: [5, -98], hip: [0, -67], fF: [5, -35], kF: [18, -49], fB: [-1, -8], kB: [9, -38], hF: [9, -58], hB: [1, -57] });
P.tuck = mk({ hang: 0, head: [8, -122], chest: [5, -98], hip: [0, -70], fF: [22, -40], kF: [26, -62], fB: [6, -34], kB: [14, -58], hF: [26, -112], eF: [18, -90], hB: [18, -104], eB: [8, -86] });
P.drop = mk({ hang: 0, head: [6, -122], chest: [4, -97], hip: [0, -67], fF: [16, -14], kF: [20, -42], fB: [-6, -18], kB: [6, -44], hF: [24, -100], eF: [16, -80], hB: [14, -96], eB: [4, -80] });
P.sip = mk({ hang: 0, head: [6, -121], chest: [4, -96], hip: [0, -66], fF: [18, -30], kF: [22, -52], fB: [-4, -26], kB: [6, -46], hF: [16, -116], eF: [18, -92], hB: [12, -106], eB: [2, -88] });
const RUN = [P.runA, P.runB, P.runC, P.runD];
function armAngle(x, y) {
  const a = Math.atan2(y, x);
  return a < -Math.PI / 2 ? a + TAU : a;
}
function cycle(list, ph) {
  const n = list.length;
  const u = (((ph % 1) + 1) % 1) * n;
  const i = Math.floor(u), t = u - i;
  const a = list[(i + n - 1) % n], b = list[i], c = list[(i + 1) % n], d = list[(i + 2) % n];
  const o = { face: 1, hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };
  for (const k of PTS) {
    o[k] = [catmull(a[k][0], b[k][0], c[k][0], d[k][0], t), catmull(a[k][1], b[k][1], c[k][1], d[k][1], t)];
  }
  for (const h of ['hF', 'hB']) {
    const pol = [a, b, c, d].map((q) => [armAngle(q[h][0] - q.chest[0], q[h][1] - q.chest[1]), Math.hypot(q[h][0] - q.chest[0], q[h][1] - q.chest[1])]);
    const ang = catmull(pol[0][0], pol[1][0], pol[2][0], pol[3][0], t), len = catmull(pol[0][1], pol[1][1], pol[2][1], pol[3][1], t);
    o[h] = [o.chest[0] + Math.cos(ang) * len, o.chest[1] + Math.sin(ang) * len];
  }
  return o;
}

let mode = 'menu';
let clock = 0, runTime = 0, dist = 0, runPh = 0;
const me = new Actor(P.ready);
let running = false; // true while the run cycle drives the pose
const body = { y: 0, vy: 0, air: false };
let papers = [], cups = [], nextId = 0;
let score = 0, chain = 0, bestChain = 0, cupCount = 0, speed = 260, spawnIn = 1, lastArrive = 0, lastResult = null;
let fall = 0, fallV = 0;

function startGame() {
  audio();
  mode = 'play';
  score = 0;
  chain = 0;
  bestChain = 0;
  cupCount = 0;
  speed = 260;
  spawnIn = 1.2;
  lastArrive = 0;
  runTime = 0;
  papers = [];
  cups = [];
  body.y = 0;
  body.vy = 0;
  body.air = false;
  fall = 0;
  fallV = 0;
  me.clear();
  me.push({ pose: cycle(RUN, runPh), d: 0.2 }, { fn: () => (running = true) });
  $('overlay').classList.remove('on');
  $('hud').classList.remove('hidden');
  $('hint').classList.toggle('hidden', life.seenHint || BOT);
  updateHud();
}

function endGame() {
  mode = 'over';
  running = false;
  me.clear();
  me.push({ pose: P.wince, d: 0.15, ez: 'out' });
  fallV = 3.2;
  SND.lose();
  SND.rustle();
  kick(160);
  buzz(40);
  popup('Trễ deadline!', '', true, FIG_X + 40, -150 + body.y);
  life.games++;
  const isBest = score > life.best;
  life.best = Math.max(life.best, score);
  life.bestChain = Math.max(life.bestChain, bestChain);
  store.set('life', life);
  lastResult = { score, isBest, chain: bestChain, cups: cupCount, time: runTime };
  window.__lastRun = { score, time: runTime };
  setTimeout(() => {
    $('endScore').textContent = score;
    $('endBest').textContent = life.best;
    $('endCups').textContent = cupCount;
    $('endChip').style.display = isBest && score > 0 ? '' : 'none';
    $('endFoot').innerHTML = lifetimeLine();
    $('startCard').classList.remove('show');
    $('endCard').classList.add('show');
    $('overlay').classList.add('on');
    $('hud').classList.add('hidden');
    $('hint').classList.add('hidden');
    if (BOT) {
      setTimeout(() => {
        if (mode === 'over') {
          startGame();
        }
      }, 2600);
    }
  }, 900);
}

function lifetimeLine() {
  if (!life.games) {
    return '';
  }
  return `Kỷ lục ${life.best} · chuỗi dài nhất ${life.bestChain}<br>${life.games} ván · ${life.dodged.toLocaleString('vi-VN')} deadline đã né · ${life.cups} ly cà phê`;
}

function updateHud() {
  const el = $('score');
  if (el.textContent !== String(score)) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  el.textContent = score;
  $('best').textContent = Math.max(life.best, score);
}

function hop() {
  audio();
  if (mode !== 'play' || body.air) {
    return;
  }
  body.vy = -HOP;
  body.air = true;
  running = false;
  me.clear();
  me.pose = cycle(RUN, runPh);
  me.push({ pose: P.crouch, d: 0.05 }, { pose: P.tuck, d: 0.18, ez: 'out' }, { pose: P.tuck, d: 0.12 }, { pose: P.drop, d: 0.25, ez: 'io' });
  SND.whoosh();
  dust(FIG_X, 0, 26, 6);
  if (!life.seenHint) {
    life.seenHint = true;
    store.set('life', life);
    $('hint').classList.add('hidden');
  }
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  hop();
});
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'ArrowUp') {
    return;
  }
  e.preventDefault();
  if (e.repeat) {
    return;
  }
  if (mode === 'menu' || (mode === 'over' && $('overlay').classList.contains('on'))) {
    startGame();
    return;
  }

});
addEventListener('contextmenu', (e) => e.preventDefault());
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('shareBtn').addEventListener('click', () => share(lastResult));

// ?bot: reacts with a human delay, chases coffee when it's safe, and now and then fumbles a jump
// (more often as things speed up), so runs end on their own.
const botRng = mulberry(20261124);
const botPlan = new Map();
function bot() {
  if (body.air) {
    return;
  }
  const p = papers.find((x) => !x.passed && x.x + PAPER_W / 2 > FIG_X - 4);
  if (p) {
    if (!botPlan.has(p.id)) {
      const flubChance = runTime < 5 ? 0 : 0.03 + runTime * 0.0045;
      const r = botRng();
      let lead = 0.2 + gauss(botRng) * 0.03;
      if (r < flubChance) {
        lead = botRng() < 0.5 ? 0.62 : 0.02; // too early (lands on it) or too late
      }
      botPlan.set(p.id, lead);
    }
    const t = (p.x - PAPER_W / 2 - FIG_X - 10) / (speed * p.k);
    if (t < botPlan.get(p.id)) {
      hop();
      return;
    }
    if (t < 0.9) {
      return; // a sheet is close: don't waste the jump
    }
  }
  const c = cups.find((x) => !x.got && x.x > FIG_X - 4);
  if (c) {
    if (!botPlan.has('c' + c.id)) {
      botPlan.set('c' + c.id, botRng() < 0.85 ? 0.33 + gauss(botRng) * 0.03 : -1);
    }
    const t = (c.x - FIG_X) / speed;
    if (t < botPlan.get('c' + c.id)) {
      hop();
    }
  }
}

function spawn() {
  const urgent = runTime > 6 && Math.random() < 0.22;
  const k = urgent ? 1.12 : 1;
  const arrive = runTime + (SPAWN_X - FIG_X) / (speed * k);
  const gap = 0.98 + 32 / speed;
  if (arrive < lastArrive + gap) {
    spawnIn = 0.08;
    return;
  }
  lastArrive = arrive;
  const lift = 4 + Math.random() * 22;
  papers.push({ id: nextId++, x: SPAWN_X, lift, ph: Math.random() * TAU, urgent, k, passed: false });
  // Sometimes a coffee floats above a sheet, or between two of them.
  if (Math.random() < 0.3) {
    cups.push({ id: nextId++, x: SPAWN_X + (Math.random() < 0.5 ? 0 : 150), y: -170 - Math.random() * 30, ph: Math.random() * TAU, got: false, t: 0 });
  }
  spawnIn = Math.max(0.5, 1.05 + Math.random() * 1.0 - runTime * 0.018);
}

function paperBox(p) {
  const bob = Math.sin(clock * 5 + p.ph) * 5;
  const yb = -p.lift + bob; // bottom edge (y is up-negative)
  return { x0: p.x - PAPER_W / 2, x1: p.x + PAPER_W / 2, y0: yb - PAPER_H, y1: yb };
}

function update(dt) {
  clock += dt;
  updateFx(dt);
  if (mode === 'menu') {
    me.update(dt);
    return;
  }
  if (mode === 'over') {
    me.update(dt);
    fall = Math.min(1.35, fall + fallV * dt);
    for (const p of papers) {
      p.x -= 40 * dt;
    }
    if (body.y < 0) {
      body.vy += GRAVITY * dt;
      body.y = Math.min(0, body.y + body.vy * dt);
    }
    return;
  }
  runTime += dt;
  speed = Math.min(600, speed + dt * 9);
  dist += speed * dt;
  runPh += (speed * dt) / 150;
  me.update(dt);
  if (BOT) {
    bot();
  }
  body.vy += GRAVITY * dt;
  body.y += body.vy * dt;
  if (body.y >= 0) {
    if (body.air) {
      SND.thunk(0.6);
      dust(FIG_X, 0, 30, 8);
      me.clear();
      me.push({ pose: P.crouch, d: 0.06 }, { pose: cycle(RUN, runPh + 0.12), d: 0.1 }, { fn: () => (running = true) });
    }
    body.y = 0;
    body.vy = 0;
    body.air = false;
  }
  if (running) {
    me.pose = cycle(RUN, runPh);
  }
  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawn();
  }
  const fx0 = FIG_X - 9, fx1 = FIG_X + 13, fy0 = body.y - 118, fy1 = body.y - 2;
  for (const p of papers) {
    p.x -= speed * p.k * dt;
    const b = paperBox(p);
    if (b.x1 - 4 > fx0 && b.x0 + 4 < fx1 && b.y1 - 3 > fy0 && b.y0 + 3 < fy1) {
      for (let i = 0; i < 10; i++) {
        bits.push({ x: p.x, y: b.y0 + 10, vx: (Math.random() - 0.3) * 260, vy: -80 - Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, c: i % 3 ? '#ffffff' : RED, t: 0, life: 1 + Math.random() * 0.6, w: 7 + Math.random() * 5, g: 220, drag: 2.5, sheet: true });
      }
      p.hit = true;
      p.stick = [p.x - FIG_X, b.y1 - body.y];
      endGame();
      return;
    }
    if (!p.passed && b.x1 < fx0) {
      p.passed = true;
      chain++;
      life.dodged++;
      bestChain = Math.max(bestChain, chain);
      const pts = (p.urgent ? 2 : 1) * (chain >= 12 ? 3 : chain >= 6 ? 2 : 1);
      score += pts;
      SND.tok(0.8);
      if (chain === 6 || chain === 12) {
        popup(`${chain} lần liên tiếp`, `×${chain >= 12 ? 3 : 2} ĐIỂM`, true, FIG_X + 30, -170 + body.y);
        SND.streak(chain >= 12 ? 6 : 3);
      } else if (p.urgent) {
        popup('+2', 'GẤP', true, FIG_X + 30, -150 + body.y);
      }
      updateHud();
    }
  }
  for (const c of cups) {
    c.x -= speed * dt;
    if (c.got) {
      c.t += dt;
      continue;
    }
    const cy = c.y + Math.sin(clock * 3 + c.ph) * 4;
    if (Math.abs(c.x - FIG_X) < 22 && body.y - 136 < cy + 12 && body.y - 20 > cy - 12) {
      c.got = true;
      cupCount++;
      life.cups++;
      score += 3;
      SND.slurp();
      popup('+3', 'TỈNH TÁO', true, FIG_X + 30, cy - 6);
      if (body.air) {
        me.clear();
        me.push({ pose: P.sip, d: 0.12, ez: 'out' }, { pose: P.drop, d: 0.3 });
      }
      updateHud();
    }
  }
  papers = papers.filter((p) => p.x > VIEW.x0 - 120);
  cups = cups.filter((c) => c.x > VIEW.x0 - 120 && c.t < 0.5);
  for (const k of botPlan.keys()) {
    if (botPlan.size > 40) {
      botPlan.delete(k);
    }
  }
}

// ── Drawing ────────────────────────────────────────────────────────────────

function drawFloor(xl, xr) {
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const off = dist % 6;
  const x0 = Math.floor(xl / 6) * 6;
  const base = Math.floor(dist / 6);
  for (let x = x0; x <= xr + 6; x += 6) {
    const w = WOBBLE[(((x / 6 + base) % 512) + 512) % 512];
    if (x === x0) {
      ctx.moveTo(x - off, w);
    } else {
      ctx.lineTo(x - off, w);
    }
  }
  ctx.stroke();
  // floor tile ticks scroll by, so you feel the run
  ctx.strokeStyle = COL.faint;
  ctx.lineWidth = 1.6;
  const step = 70;
  for (let x = Math.floor((xl + dist) / step) * step; x < xr + dist + step; x += step) {
    const sx = x - dist;
    line(sx, 9, sx - 10, 20);
  }
}

// Faint office in the background, slower than the floor (parallax).
const PROPS = ['window', 'plant', 'clock', 'cooler', 'board', 'window', 'lamp'];
function drawOffice(xl, xr) {
  const par = 0.45, step = 190;
  const d = dist * par;
  ctx.save();
  ctx.strokeStyle = '#cfcfcf';
  ctx.fillStyle = '#fff';
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (let i = Math.floor((xl + d) / step) - 1; i < (xr + d) / step + 1; i++) {
    const x = i * step - d;
    const kind = PROPS[((i % PROPS.length) + PROPS.length) % PROPS.length];
    if (kind === 'window') {
      roundRect(x - 40, -250, 80, 92, 4);
      ctx.fill();
      ctx.stroke();
      line(x, -250, x, -158);
      line(x - 40, -204, x + 40, -204);
    } else if (kind === 'plant') {
      roundRect(x - 13, -34, 26, 34, 3);
      ctx.fill();
      ctx.stroke();
      for (const [a, l] of [[-0.5, 34], [0, 44], [0.5, 34], [-0.25, 40], [0.25, 40]]) {
        ctx.beginPath();
        ctx.ellipse(x + Math.sin(a) * l * 0.5, -34 - Math.cos(a) * l * 0.5, 5, l * 0.5, a, 0, TAU);
        ctx.fill();
        ctx.stroke();
      }
    } else if (kind === 'clock') {
      ctx.beginPath();
      ctx.arc(x, -215, 22, 0, TAU);
      ctx.fill();
      ctx.stroke();
      const a = clock * 6; // the clock races: it's deadline day
      line(x, -215, x + Math.cos(a) * 16, -215 + Math.sin(a) * 16);
      line(x, -215, x + Math.cos(a / 12) * 10, -215 + Math.sin(a / 12) * 10);
    } else if (kind === 'cooler') {
      roundRect(x - 14, -60, 28, 60, 3);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, -78, 12, 18, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
    } else if (kind === 'board') {
      roundRect(x - 50, -236, 100, 64, 4);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 38, -186);
      ctx.lineTo(x - 18, -200);
      ctx.lineTo(x + 2, -192);
      ctx.lineTo(x + 34, -222);
      ctx.stroke();
    } else if (kind === 'lamp') {
      line(x, 0, x, -120);
      ctx.beginPath();
      ctx.moveTo(x - 18, -120);
      ctx.lineTo(x + 18, -120);
      ctx.lineTo(x + 10, -142);
      ctx.lineTo(x - 10, -142);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPaper(p) {
  const b = paperBox(p);
  const tilt = Math.sin(clock * 7 + p.ph) * 0.16 - 0.08;
  ctx.save();
  contactShadow(p.x, 16, 0.07);
  ctx.translate(p.x, (b.y0 + b.y1) / 2);
  ctx.rotate(tilt);
  // speed lines behind
  ctx.strokeStyle = COL.faint;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for (const yy of [-8, 2, 11]) {
    line(PAPER_W / 2 + 8, yy, PAPER_W / 2 + 22 + (yy & 7), yy);
  }
  // sheet with a folded corner
  const w = PAPER_W, h = PAPER_H;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2);
  ctx.lineTo(w / 2 - 9, -h / 2);
  ctx.lineTo(w / 2, -h / 2 + 9);
  ctx.lineTo(w / 2, h / 2);
  ctx.lineTo(-w / 2, h / 2);
  ctx.closePath();
  inkShape(p.urgent ? COL.butter : '#fff', 1.8);
  ctx.beginPath();
  ctx.moveTo(w / 2 - 9, -h / 2);
  ctx.lineTo(w / 2 - 9, -h / 2 + 9);
  ctx.lineTo(w / 2, -h / 2 + 9);
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // text lines
  ctx.strokeStyle = '#bdbdbd';
  ctx.lineWidth = 1.2;
  line(-w / 2 + 6, -h / 2 + 7, w / 2 - 14, -h / 2 + 7);
  line(-w / 2 + 6, h / 2 - 6, w / 2 - 8, h / 2 - 6);
  // red stamp
  ctx.save();
  ctx.rotate(-0.14);
  ctx.strokeStyle = RED;
  ctx.lineWidth = 1.4;
  roundRect(-w / 2 + 3, -6, w - 8, 12, 2);
  ctx.stroke();
  ctx.fillStyle = RED;
  const label = p.urgent ? 'GẤP!!' : 'DEADLINE';
  ctx.font = `400 8px ${FONT}`;
  const fit = Math.min(1, (w - 13) / ctx.measureText(label).width);
  ctx.font = `400 ${(8 * fit).toFixed(2)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, -2.5, 0.5);
  ctx.restore();
  ctx.restore();
}

function drawCup(c) {
  const cy = c.y + Math.sin(clock * 3 + c.ph) * 4;
  const a = c.got ? Math.max(0, 1 - c.t / 0.5) : 1;
  const sc = c.got ? 1 + c.t * 1.2 : 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(c.x, cy);
  ctx.scale(sc, sc);
  // steam
  ctx.strokeStyle = '#b8b8b8';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  for (const sx of [-4, 4]) {
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const yy = -16 - i * 1.8;
      const xx = sx + Math.sin(clock * 6 + i * 0.8 + sx) * 2;
      ctx[i ? 'lineTo' : 'moveTo'](xx, yy);
    }
    ctx.stroke();
  }
  // handle
  ctx.beginPath();
  ctx.arc(11, 0, 5.5, -Math.PI / 2, Math.PI / 2);
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = COL.ink;
  ctx.stroke();
  // cup
  ctx.beginPath();
  ctx.moveTo(-11, -11);
  ctx.lineTo(11, -11);
  ctx.lineTo(8, 11);
  ctx.lineTo(-8, 11);
  ctx.closePath();
  inkShape('#fff', 1.8);
  ctx.beginPath();
  ctx.moveTo(-10, -4);
  ctx.lineTo(10, -4);
  ctx.lineTo(9, 3);
  ctx.lineTo(-9, 3);
  ctx.closePath();
  ctx.fillStyle = COFFEE;
  ctx.fill();
  ctx.restore();
}

// Office tie, drawn between the body and the front arm.
function drawTie(J) {
  const c = J.chest, h = J.hip;
  const ux = h[0] - c[0], uy = h[1] - c[1];
  const L = Math.hypot(ux, uy) || 1;
  const u = [ux / L, uy / L], n = [-u[1], u[0]];
  const swing = body.air ? -0.35 : Math.sin(clock * 14) * 0.12;
  const p = (along, side) => [c[0] + u[0] * along + n[0] * side, c[1] + u[1] * along + n[1] * side];
  const knot = p(3, 0);
  ctx.save();
  ctx.translate(knot[0], knot[1]);
  ctx.rotate(swing);
  ctx.translate(-knot[0], -knot[1]);
  ctx.beginPath();
  const a = p(2, -3), b = p(2, 3), t1 = p(18, 4.5), tip = p(24, 0), t2 = p(18, -4.5);
  ctx.moveTo(a[0] + 4, a[1]);
  ctx.lineTo(b[0] + 4, b[1]);
  ctx.lineTo(t1[0] + 4, t1[1]);
  ctx.lineTo(tip[0] + 4, tip[1]);
  ctx.lineTo(t2[0] + 4, t2[1]);
  ctx.closePath();
  ctx.fillStyle = RED;
  ctx.fill();
  ctx.lineWidth = 1.4 * J.m;
  ctx.strokeStyle = J.ink;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawSheetBits() {
  for (const b of bits) {
    if (!b.sheet) {
      continue;
    }
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
    ctx.translate(b.x, b.y);
    ctx.rotate(b.r);
    ctx.fillStyle = b.c;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1;
    ctx.fillRect(-b.w / 2, -b.w * 0.35, b.w, b.w * 0.7);
    ctx.strokeRect(-b.w / 2, -b.w * 0.35, b.w, b.w * 0.7);
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.x, dpr * (cam.y + shake));
  const left = toWorld(0, 0)[0], right = toWorld(cw, 0)[0];
  drawOffice(left - 60, right + 60);
  drawFloor(left - 20, right + 20);
  for (const c of cups) {
    drawCup(c);
  }
  contactShadow(FIG_X, 14 + body.y * 0.04, 0.1);
  const breath = mode === 'menu' ? Math.sin(clock * 2) * 1.2 : 0;
  const rot = -EASE.out(Math.min(1, fall)) * 1.05;
  drawFigure(me, FIG_X, 8 + body.y, breath, { rot, pivot: [-6, -8], mid: drawTie });
  for (const p of papers) {
    if (p.hit) {
      continue;
    }
    drawPaper(p);
  }
  // the sheet that got you sticks to the face
  for (const p of papers) {
    if (!p.hit) {
      continue;
    }
    ctx.save();
    ctx.translate(FIG_X, 8 + body.y);
    ctx.rotate(rot);
    ctx.translate(-FIG_X, -(8 + body.y));
    drawPaper({ x: FIG_X + 14, lift: 96 - body.y * 0, ph: 1.2, urgent: p.urgent });
    ctx.restore();
  }
  drawBits();
  drawSheetBits();
  drawPopups(left, right);
}

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px ${FONT}`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC MỚI', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.score), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = COL.muted;
  ctx.font = font(30);
  ctx.fillText('ĐIỂM', 82, 386);
  ctx.fillStyle = COL.ink;
  ctx.font = font(64);
  ctx.letterSpacing = '0px';
  ctx.fillText(String(res.chain), 82, 560);
  ctx.fillText(String(res.cups), 382, 560);
  ctx.fillStyle = COL.muted;
  ctx.font = font(21);
  ctx.letterSpacing = '3px';
  ctx.fillText('CHUỖI DÀI NHẤT', 84, 600);
  ctx.fillText('LY CÀ PHÊ', 384, 600);
  ctx.fillStyle = COL.faint;
  ctx.font = font(26);
  ctx.fillText(GAME.toUpperCase(), 84, 1196);
  ctx.letterSpacing = '0px';
  ctx.save();
  ctx.translate(760, 1250);
  ctx.scale(2.6, 2.6);
  const saveDist = dist;
  dist = 0;
  drawFloor(-120, 120);
  dist = saveDist;
  contactShadow(0, 16, 0.1);
  drawFigure({ pose: P.cheer }, 0, 8, 0, { live: false, mid: drawTie });
  drawCup({ x: 46, y: -150, ph: 0, got: false });
  ctx.restore();
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  if (!res) {
    return;
  }
  try {
    await document.fonts.ready;
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${SLUG}-${res.score}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  }
}

$('startFoot').innerHTML = lifetimeLine();
if (Q.has('autoplay')) {
  startGame();
} else if (BOT) {
  // Let the start card show for a moment, then "press" Play, like a person would.
  setTimeout(() => {
    if (mode === 'menu') {
      startGame();
    }
  }, 2200);
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
