<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nhảy Đá Qua Sông</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #1f2329;
    --muted: #7a7a7a;
    --soft: #a3a3a3;
    --faint: #d4d4d4;
    --line: #ededed;
    --dot: rgba(31, 41, 55, .13);
    --chip: #f5f5f5;
    --ring: rgba(0, 0, 0, .06);
    --butter: #fde68a;
    --butter-hi: #fcd34d;
    --butter-soft: #fef3c7;
    --umber: #78350f;
    --amber: #b45309;
    --font: 'Balsamiq Sans', 'Comic Sans MS', ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--ink); overflow: hidden;
    background-color: var(--paper);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--font); font-weight: 400;
    overscroll-behavior: none;
  }
  #zone {
    position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); text-align: center; pointer-events: none;
    padding: 14px 22px 15px; opacity: 0; transition: opacity .35s ease, transform .45s cubic-bezier(.2, .9, .3, 1); white-space: nowrap;
  }
  #zone.on { opacity: 1; transform: translate(-50%, 0); }
  #zoneNum { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--amber); }
  #zoneName { font-size: 28px; line-height: 1.1; margin-top: 4px; }
  #zoneTip { font-size: 13px; color: var(--muted); margin-top: 5px; }
  #zoneTip:empty { display: none; }
  @media (max-width: 420px) {
    #zone { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); }
  }
  h1, b, strong { font-weight: 400; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; outline: none; padding: 0; }
  button:focus, button:focus-visible { outline: none; }
  .panel { background: var(--card); border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
  .label { font-size: 13px; color: var(--muted); line-height: 1.2; }

  #hud {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 0 max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    pointer-events: none; transition: opacity .35s ease;
  }
  #hud.hidden { opacity: 0; }
  .board { padding: 14px 18px 14px; display: grid; gap: 14px; }
  .tally { display: flex; align-items: flex-end; gap: 28px; }
  .stat .label { margin-top: 6px; }
  #score { font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: left bottom; }
  #score.bump { animation: bump .35s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #best { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
  .distrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  #dist { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; transition: color .3s; }
  #dist .unit { font-size: 13px; color: var(--muted); }
  #dist .sep { color: var(--faint); }
  #hM { font-size: 16px; color: var(--muted); }
  #dist.record, #dist.record #hM { color: var(--amber); }
  #hStones { display: inline-block; transform-origin: left bottom; }
  #hStones.bump { animation: bump .35s ease; }
  #distLabel { font-variant-numeric: tabular-nums; }
  .minis { display: flex; justify-content: space-between; margin: 0 0 28px; }
  .minis .v { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .minis .label { margin-top: 6px; }
  #streak {
    font-size: 14px; color: var(--amber); background: var(--butter-soft); border-radius: 8px; padding: 4px 10px;
    box-shadow: 0 0 0 1px rgba(180, 83, 9, .14); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s;
  }
  #streak.on { opacity: 1; transform: none; }
  @media (max-width: 420px) {
    #hud { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); }
    .board { padding: 12px 14px; gap: 12px; }
    #score { font-size: 38px; }
  }

  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    font-size: 14.5px; color: var(--muted); white-space: nowrap; pointer-events: none; transition: opacity .4s;
    display: flex; align-items: center; gap: 8px;
  }
  #hint.hidden { opacity: 0; }
  kbd { font: inherit; font-size: 12px; color: #5a5a5a; background: var(--chip); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07); border-radius: 6px; padding: 3px 8px; line-height: 1.25; }
  @media (hover: none) { .kbd-only { display: none; } }

  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
    background: rgba(20, 22, 26, .24);
    opacity: 0; pointer-events: none; transition: opacity .3s ease; overflow-y: auto;
  }
  #overlay.on { opacity: 1; pointer-events: auto; }
  .card {
    width: min(360px, 100%); background: var(--card); border-radius: 18px; padding: 28px;
    transform: translateY(12px); transition: transform .35s cubic-bezier(.2, .9, .3, 1); display: none;
  }
  #overlay.on .card.show { transform: none; }
  .card.show { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: #262626; display: grid; place-items: center; margin-bottom: 20px; }
  .logo svg { width: 26px; height: 26px; }
  .title { font-size: 32px; line-height: 1; margin: 0; }
  .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; margin: 18px 0 10px; }
  .tag { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--butter); color: var(--umber); white-space: nowrap; }
  .actions { display: flex; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 50px; border-radius: 12px; font-size: 17px; transition: transform .12s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { flex: 1; background: var(--butter); color: var(--umber); box-shadow: 0 0 0 1px rgba(180, 83, 9, .2), 0 2px 8px rgba(0, 0, 0, .04); }
  .btn.primary kbd { background: rgba(255, 255, 255, .55); color: #92400e; box-shadow: none; }
  .btn.ghost { width: 50px; flex: none; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
  @media (hover: hover) {
    .btn.primary:hover { background: var(--butter-hi); }
    .btn.ghost:hover { background: #ececec; }
  }
  .btn svg { width: 19px; height: 19px; }
  .btn.busy svg { display: none; }
  .btn.busy::after { content: ''; width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--ink); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; color: var(--soft); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; margin-top: 22px; }
  .foot:empty { display: none; }
  .exit { display: block; width: fit-content; margin: 18px auto 0; font-size: 14px; color: var(--soft); text-decoration: none; }
  @media (hover: hover) { .exit:hover { color: var(--ink); } }
  .result { display: flex; align-items: flex-end; gap: 36px; margin: 22px 0 24px; }
  .result .label { margin-top: 8px; }
  #endScore { font-size: 72px; line-height: .8; font-variant-numeric: tabular-nums; display: block; }
  #endDist { font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 20px);
    background: #262626; color: #ffffff; font-size: 14px; padding: 10px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .back { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(20px, env(safe-area-inset-right, 0px)); font-size: 14px; color: var(--soft); text-decoration: none; }
  .back:hover { color: var(--ink); }
  @media (max-width: 420px) { .back { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(14px, env(safe-area-inset-right, 0px)); font-size: 13px; } }
</style>
<style id="sancongcu-vi">
  /* SanCongCu: font có dấu tiếng Việt cho phần chữ HTML, ẩn link về trang gốc */
  :root { --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, 'Segoe UI', system-ui, sans-serif; }
  .back, .exit, a[href="/"][target="_top"] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/" target="_top">← all games</a>
<div id="zone" class="panel"><div id="zoneNum"></div><div id="zoneName"></div><div id="zoneTip"></div></div>

<div id="hud" class="hidden">
  <div class="board panel">
    <div class="tally">
      <div class="stat"><div id="score">0</div><div class="label">Điểm</div></div>
      <div class="stat"><div id="best">0</div><div class="label">Kỷ lục</div></div>
    </div>
    <div class="distrow">
      <div id="dist"><span id="hStones">0</span><span class="unit">hòn đá</span><span class="sep">·</span><span id="hM">0.0 m</span></div>
      <div class="label" id="distLabel">Đã qua</div>
    </div>
  </div>
  <div id="streak"></div>
</div>

<div id="hint" class="hidden"><span>Giữ để lấy đà, thả để nhảy</span><span class="kbd-only">hoặc</span><kbd class="kbd-only">Space</kbd></div>

<div id="overlay" class="on">
  <div class="card show" id="startCard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19.5c1.7-1 3.3-1 5 0s3.3 1 5 0 3.3-1 5 0 3.3 1 5 0"/><path d="M3.5 16.5c.4-1.8 1.6-2.6 3-2.6s2.6.8 3 2.6"/><path d="M14.5 16.5c.4-1.8 1.6-2.6 3-2.6s2.6.8 3 2.6"/><path d="M7 10.5c2-4.6 8-4.6 10 0" stroke-dasharray="2 2.6"/></svg></div>
    <h1 class="title">Nhảy Đá Qua Sông</h1>
    <div class="keys"><kbd>Giữ</kbd> để lấy đà, <kbd>Thả</kbd> để nhảy</div>
    <p class="tag">Vượt sông. Đáp giữa tâm đá để ăn combo.</p>
    <div class="actions">
      <button class="btn primary" id="playBtn"><span>Chơi</span><kbd class="kbd-only">Space</kbd></button>
    </div>
    <div class="foot" id="startFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
  <div class="card" id="endCard">
    <div class="row">
      <div class="label" id="endLabel">Ùm</div>
      <span class="chip" id="endChip" style="display:none">Kỷ lục mới</span>
    </div>
    <div class="result">
      <div><span id="endScore">0</span><div class="label">Đá đã qua</div></div>
      <div><div id="endDist">0 m</div><div class="label">Quãng đường</div></div>
    </div>
    <div class="minis">
      <div><div class="v" id="endPts">0</div><div class="label">Điểm</div></div>
      <div><div class="v" id="endPerf">0</div><div class="label">Hoàn hảo</div></div>
      <div><div class="v" id="endChain">0</div><div class="label">Chuỗi dài nhất</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn"><span>Chơi lại</span><kbd class="kbd-only">Space</kbd></button>
      <button class="btn ghost" id="shareBtn" aria-label="Download image" title="Download image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
    </div>
    <div class="foot" id="endFoot"></div>
    <a class="exit" href="/" target="_top">← All games</a>
  </div>
</div>

<div id="toast"></div>
<script>
const G = 1900;
const UNIT = 74;
const DMIN = 34, DMAX = 256;
const SWEEP = 1.0;
const PERFECT = 4.5;
const EDGE = 7;
const TOL = 2.5;
const CURRENT = 24;
const BED = 112;
const VIEW = { y0: -250, y1: 80 };
const COL = { bg: '#ffffff', ink: '#141414', fig: '#141414', muted: '#737373', faint: '#d4d4d4', accent: '#b45309', dot: 'rgba(31,41,55,0.13)' };
const PAL = { water: '#fafafa', white: '#ffffff', under: '#f2f2f2', subInk: '#cfcfcf', far: '#c9c9c9', farInk: '#cdcdcd' };

const THIGH = 30, SHIN = 30, UARM = 21, FARM = 21;
const BASE = {
  face: 1, flick: 0,
  head: [0, -121], chest: [0, -96], hip: [0, -65],
  fF: [1, -8], fB: [-4, -8], kF: [22, -38], kB: [10, -38],
  hF: [3, -57], hB: [-1, -57], eF: [-6, -78], eB: [-6, -78],
};
const mk = (o, base = BASE) => Object.assign({}, base, o);
const P = {};
P.stand = mk({ head: [1, -121], fF: [4, -8], fB: [-5, -8], hF: [7, -56], eF: [2, -78], hB: [-6, -58], eB: [-4, -78] });
P.crouch = mk({ head: [20, -97], chest: [9, -76], hip: [-7, -50], kF: [17, -30], kB: [11, -29], fF: [5, -8], fB: [-4, -8], hF: [-28, -54], eF: [-10, -72], hB: [-24, -48], eB: [-13, -76] });
P.launch = mk({ head: [15, -121], chest: [9, -97], hip: [2, -67], kF: [10, -38], kB: [0, -37], fF: [-2, -9], fB: [-10, -7], hF: [38, -126], eF: [25, -103], hB: [47, -111], eB: [20, -99] });
P.tuck = mk({ head: [9, -117], chest: [4, -92], hip: [-1, -61], kF: [22, -48], kB: [17, -46], fF: [6, -26], fB: [0, -24], hF: [44, -84], eF: [19, -92], hB: [44, -98], eB: [15, -96] });
P.reach = mk({ head: [1, -121], chest: [-1, -95], hip: [-2, -64], kF: [17, -36], kB: [11, -36], fF: [9, -7], fB: [2, -9], hF: [34, -75], eF: [16, -97], hB: [39, -88], eB: [-13, -99] });
P.land = mk({ head: [8, -103], chest: [3, -79], hip: [-3, -50], kF: [18, -30], kB: [12, -29], fF: [4, -8], fB: [-5, -8], hF: [34, -53], eF: [14, -66], hB: [41, -65], eB: [-11, -68] });
P.pump = mk({ head: [2, -123], chest: [0, -98], hip: [0, -66], hF: [16, -140], eF: [19, -118], hB: [-6, -58], eB: [-6, -78] });
P.cheer = mk({ head: [0, -122], chest: [0, -97], hip: [0, -67], hF: [16, -136], hB: [-10, -137], eF: [14, -118], eB: [-6, -117] });
P.teeterA = mk({ head: [16, -116], chest: [9, -93], hip: [1, -63], kF: [22, -37], kB: [12, -37], hF: [32, -116], eF: [27, -96], hB: [-22, -128], eB: [-8, -112] });
P.teeterB = mk({ head: [14, -117], chest: [8, -94], hip: [1, -63], kF: [22, -37], kB: [12, -37], hF: [-14, -130], eF: [0, -114], hB: [30, -104], eB: [21, -92] });
P.backA = mk({ head: [-13, -118], chest: [-7, -94], hip: [0, -64], kF: [20, -37], kB: [8, -37], hF: [26, -124], eF: [15, -108], hB: [-36, -118], eB: [-20, -106] });
P.backB = mk({ head: [-11, -119], chest: [-6, -95], hip: [0, -64], kF: [20, -37], kB: [8, -37], hF: [-26, -132], eF: [-14, -114], hB: [18, -126], eB: [10, -108] });
P.flail = mk({ head: [-5, -119], chest: [-2, -95], hip: [0, -64], fF: [14, -14], kF: [22, -42], fB: [-12, -16], kB: [-6, -42], hF: [12, -140], eF: [16, -117], hB: [-20, -134], eB: [-16, -112] });
P.flail2 = mk({ hF: [22, -134], eF: [20, -112], hB: [-12, -140], eB: [-18, -118], fF: [6, -10], fB: [-4, -18] }, P.flail);
P.shake = mk({ head: [5, -121], chest: [2, -96], hip: [0, -65], hF: [24, -128], eF: [24, -106], hB: [-2, -56], eB: [-8, -76] });
P.shake2 = mk({ hF: [28, -122], eF: [22, -102] }, P.shake);

const PTS = ['head', 'chest', 'hip', 'fF', 'fB', 'kF', 'kB', 'hF', 'hB', 'eF', 'eB'];
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  in: (k) => k * k,
  out: (k) => 1 - (1 - k) * (1 - k),
  lin: (k) => k,
  soft: (k) => 0.5 - Math.cos(Math.PI * k) / 2,
};
function armAngle(x, y) {
  const a = Math.atan2(y, x);
  return a < -Math.PI / 2 ? a + Math.PI * 2 : a;
}
function swingHand(ha, ca, hb, cb, c, k) {
  const ax = ha[0] - ca[0], ay = ha[1] - ca[1], bx = hb[0] - cb[0], by = hb[1] - cb[1];
  const a0 = armAngle(ax, ay);
  const ang = a0 + (armAngle(bx, by) - a0) * k;
  const len = lerp(Math.hypot(ax, ay), Math.hypot(bx, by), k);
  return [c[0] + Math.cos(ang) * len, c[1] + Math.sin(ang) * len];
}
function lerpPose(a, b, k) {
  const o = { face: lerp(a.face, b.face, k), flick: 0, hang: lerp(a.hang ?? 1, b.hang ?? 1, k) };
  for (const n of PTS) {
    o[n] = lerp2(a[n], b[n], k);
  }
  o.hF = swingHand(a.hF, a.chest, b.hF, b.chest, o.chest, k);
  o.hB = swingHand(a.hB, a.chest, b.hB, b.chest, o.chest, k);
  return o;
}

// The drawn pose chases me.pose, but each joint's velocity changes by at most `acc` per second,
// so big moves (a release, a landing, a splash) take a few frames instead of snapping. Hands swing around the chest
// (angle and reach, the same way round as swingHand) rather than cutting straight through the shoulder.
function brake(e, rate, acc) {
  return Math.sign(e) * Math.min(Math.abs(e) * rate, Math.sqrt(2 * acc * Math.abs(e)));
}
function followPose(cur, vel, target, rate, dt, acc) {
  const o = { hang: lerp(cur.hang ?? 1, target.hang ?? 1, 1 - Math.exp(-dt * rate)) };
  const step = (n, want) => {
    const v = vel[n] || (vel[n] = [0, 0]);
    const dx = want[0] - v[0], dy = want[1] - v[1];
    const dl = Math.hypot(dx, dy), k = dl > acc * dt ? (acc * dt) / dl : 1;
    v[0] += dx * k;
    v[1] += dy * k;
    o[n] = [cur[n][0] + v[0] * dt, cur[n][1] + v[1] * dt];
  };
  for (const n of PTS) {
    if (n === 'hF' || n === 'hB') {
      continue;
    }
    const ex = target[n][0] - cur[n][0], ey = target[n][1] - cur[n][1];
    const el = Math.hypot(ex, ey);
    const sp = el > 1e-6 ? brake(el, rate, acc * 0.5) / el : 0;
    step(n, [ex * sp, ey * sp]);
  }
  for (const n of ['hF', 'hB']) {
    const cx = cur[n][0] - cur.chest[0], cy = cur[n][1] - cur.chest[1];
    const tx = target[n][0] - target.chest[0], ty = target[n][1] - target.chest[1];
    const r = Math.hypot(cx, cy), tr = Math.hypot(tx, ty), ang = Math.atan2(cy, cx);
    const da = armAngle(tx, ty) - armAngle(cx, cy);

function catmull(p0, p1, p2, p3, t) {

  const a = list[Math.max(0, i - 1)], b = list[i], c = list[i + 1], d = list[Math.min(n, i + 2)];
  const o = { face: lerp(b.face, c.face, t), flick: lerp(b.flick, c.flick, t), hang: lerp(b.hang ?? 1, c.hang ?? 1, t) };

  }
  push(...steps) {

  }
  clear() {

    this.step = null;
  }
  get idle() {

  }
  update(dt) {

        this.step = this.q.shift();
        this.t = 0;
        if (this.step.fn) {

          this.step = null;
          fn();
          continue;
        }
        const targets = this.step.path || (this.step.pose ? [this.step.pose] : [this.pose]);

    fig.y += fig.vy * dt;
    fig.x += fig.vx * dt;
    fig.vx *= Math.exp(-4 * dt);
    if (Math.random() < dt * 20) {
      bubbles.push({ x: fig.x + (Math.random() - 0.5) * 14, y: fig.y - 100 + Math.random() * 30, r: 1 + Math.random() * 2, vy: -50 - Math.random() * 30, t: 0, ph: Math.random() * 6 });
    }
    return;
  }
  const target = 72;
  fig.y += (target - fig.y) * smooth(7, dt);
  fig.x += CURRENT * 0.15 * dt;
  if (!fig.surfaced && fig.y - 121 < wl) {
    fig.surfaced = true;
    SND.splutter();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      const sp = 80 + Math.random() * 120;
      drops.push({ x: fig.x + (Math.random() - 0.5) * 12, y: wl - 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 1 + Math.random() * 1.4, t: 0 });
    }
    ripple(fig.x, wl, 10, 1.6, 1.2, 1.2);
  }
}

function flyY(s, f) {
  return topAt(s, clock) - f.h + Math.sin(clock * 3 + f.ph) * 2.5;
}
function updateFlies(dt) {
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    f.t += dt;
    f.vy -= 60 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (f.t > 0.9) {
      flies[i] = flies[flies.length - 1];
      flies.pop();
    }
  }
  if (!round || mode !== 'play') {
    return;
  }
  const settled = state === 'stand' || state === 'land' || state === 'teeter' || state === 'charge';
  for (let i = Math.max(1, round.cur - 2); i <= round.cur + 3; i++) {
    const s = stone(i);
    const f = s.fly;
    if (!f || f.st !== 'hover') {
      continue;
    }
    const fx = cxAt(s, clock) + f.off;
    const fy = flyY(s, f);
    if (state !== 'sink' && Math.abs(fig.x - fx) < 12 && fy > fig.y - 122 && fy < fig.y - 4) {
      f.st = 'got';
      round.flies++;
      round.score += 5;
      popup('+5', 'CHUỒN CHUỒN', true, false, fx, fy - 46);
      burst(fx, fy, 16, true);
      SND.fly();
      buzz([8, 20, 8]);
      bumpScore();
      updateHud();
      continue;
    }
    if ((settled && fig.on >= s.i) || round.cur > s.i) {
      f.st = 'gone';
      flies.push({ x: fx, y: fy, vx: 120 + Math.random() * 60, vy: -70 - Math.random() * 40, t: 0, ph: f.ph });
    }
  }
}

function updateFx(dt) {
  updateFlies(dt);
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t > 1.1) {
      unorderedRemove(popups, i);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.t += dt;
    b.vy += b.g * dt;
    b.vx *= Math.exp(-b.drag * dt);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.r += b.vr * dt;
    if (b.t > b.life) {
      unorderedRemove(bits, i);
    }
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt;
    d.vy += 900 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if ((d.vy > 0 && d.y > waterAt(d.x)) || d.t > 2) {
      if (d.r > 2 && ripples.length < 40) {
        ripple(d.x, 0, 1, 0.6, 0.6, 0);
      }
      unorderedRemove(drops, i);
    }
  }
  for (let i = crowns.length - 1; i >= 0; i--) {
    crowns[i].t += dt;
    if (crowns[i].t > crowns[i].life) {
      unorderedRemove(crowns, i);
    }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.t += dt;
    if (r.t < 0) {
      continue;
    }
    r.r += r.v * dt * (1 - 0.5 * r.t / r.life);
    if (r.t > r.life) {
      unorderedRemove(ripples, i);
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.t += dt;
    if (b.t < 0) {
      continue;
    }
    b.y += b.vy * dt;
    if (b.y < waterAt(b.x) + b.r || b.t > 4) {
      if (ripples.length < 40) {
        ripple(b.x, 0, 1, 0.3, 0.45, 0);
      }
      if (Math.random() < 0.3 && !SIM) {
        SND.bloop(0.5);
      }
      unorderedRemove(bubbles, i);
    }
  }
  if (hat.on) {
    hat.t += dt;
    const wl = waterAt(hat.x);
    if (!hat.water) {
      hat.vy += 900 * dt;
      hat.x += hat.vx * dt;
      hat.y += hat.vy * dt;
      hat.a += hat.va * dt;
      if (hat.vy > 0 && hat.y > wl - 2) {
        hat.water = true;
        hat.a = ((hat.a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (hat.a > Math.PI) {
          hat.a -= Math.PI * 2;
        }
        ripple(hat.x, wl, 3, 0.8, 0.9, 0.6);
        SND.plop();
      }
    } else {
      hat.vx += (CURRENT * 1.6 - hat.vx) * smooth(1.5, dt);
      hat.x += hat.vx * dt;
      hat.y += (wl - 2.2 - hat.y) * smooth(10, dt);
      hat.a += (Math.sin(hat.t * 2.6) * 0.14 - hat.a) * smooth(5, dt);
    }
  }
  if (round) {
    for (let i = round.cur + 1; i <= round.cur + 3; i++) {
      const s = stone(i);
      if (s.frog && s.frog.st === 'sit' && ((state === 'charge' && i === fig.on + 1 && chargeT > 0.25) || (state === 'air' && i <= fig.from + 2))) {
        frogJump(s);
      }
    }
  }
  for (let i = jumpers.length - 1; i >= 0; i--) {
    const j = jumpers[i];
    j.t += dt;
    j.vy += j.g * dt;
    j.x += j.vx * dt;
    j.y += j.vy * dt;
    j.a = Math.atan2(j.vy, Math.abs(j.vx)) * Math.sign(j.vx) * (j.kind === 'frog' ? 0.5 : 1);
    if (j.vy > 0 && j.y > waterAt(j.x) + 2) {
      ripple(j.x, 0, 2, 1, 0.9, 0.8);
      for (let k = 0; k < 4; k++) {
        drops.push({ x: j.x, y: -1, vx: (Math.random() - 0.5) * 80, vy: -80 - Math.random() * 80, r: 0.9 + Math.random() * 0.8, t: 0 });
      }
      if (!SIM) {
        SND.plop();
      }
      unorderedRemove(jumpers, i);
    }
  }
  fishAt -= dt;
  if (fishAt <= 0 && round && !SIM) {
    fishAt = 4 + Math.random() * 6;
    const S = cam.s * cam.z;
    const xr = cam.x + (cw - cam.ax) / S;
    const x = fig.x + 80 + Math.random() * Math.max(60, xr - fig.x - 140);
    let clear = true;
    for (let i = Math.max(0, round.cur - 1); i <= round.cur + 6; i++) {
      const s = stone(i);
      if (Math.abs(cxAt(s, clock) - x) < s.w / 2 + 40) {
        clear = false;
      }
    }
    if (clear) {
      jumpers.push({ kind: 'fish', x, y: 2, vx: 50 + Math.random() * 40, vy: -230 - Math.random() * 60, g: 900, a: 0, t: 0 });
      ripple(x, 0, 2, 0.8, 0.8, 0.6);
    }
  }
}

function shareCanvas(res) {
  const SW = 1080, SH = 1350;
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const prev = ctx;
  const prevClock = clock;
  ctx = c.getContext('2d');
  const font = (s) => `400 ${s}px 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', ui-rounded, system-ui, sans-serif`;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, SW, SH);
  ctx.fillStyle = COL.dot;
  for (let y = 18; y < SH; y += 36) {
    for (let x = 18; x < SW; x += 36) {
      ctx.beginPath();
      ctx.arc(x, y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.textBaseline = 'alphabetic';
  if (res.isBest) {
    ctx.fillStyle = COL.accent;
    ctx.font = font(30);
    ctx.letterSpacing = '4px';
    ctx.fillText('KỶ LỤC CÁ NHÂN', 82, 108);
  }
  ctx.fillStyle = COL.ink;
  ctx.font = font(250);
  ctx.letterSpacing = '-4px';
  ctx.fillText(String(res.stones), 70, 330);
  ctx.letterSpacing = '4px';
  ctx.font = font(30);
  ctx.fillStyle = COL.muted;
  ctx.fillText(res.stones === 1 ? 'ĐÁ ĐÃ QUA' : 'ĐÁ ĐÃ QUA', 82, 386);
  ctx.letterSpacing = '-1px';
  ctx.fillStyle = COL.ink;
  ctx.font = font(104);
  ctx.fillText(meters(res.dist), 76, 530);
  ctx.letterSpacing = '0px';
  const stats = [[String(res.score), 'SCORE'], [String(res.perfects), 'PERFECT'], [String(res.bestStreak), 'BEST CHAIN']];
  stats.forEach((st, i) => {
    const x = 84 + i * 300;
    ctx.fillStyle = COL.ink;
    ctx.font = font(64);
    ctx.fillText(st[0], x, 680);
    ctx.fillStyle = COL.muted;
    ctx.font = font(21);
    ctx.letterSpacing = '3px';
    ctx.fillText(st[1], x + 2, 720);
    ctx.letterSpacing = '0px';
  });
  const sc = 2.5;
  const sx = res.scene.x;
  ctx.save();
  ctx.translate(500 - sx * sc, 1090);
  ctx.scale(sc, sc);
  clock = 1.3;
  wClock = -1;
  const xl = sx - 300, xr = sx + 300;
  const savedR = ripples.slice();
  ripples.length = 0;
  waterPath(xl, xr, 400);
  ctx.fillStyle = PAL.water;
  ctx.fill();
  drawBed(xl, xr);
  for (const it of res.scene.stones) {
    drawStoneUnder(it.s, it.cx, it.top, waterAt(it.cx));
  }
  ctx.save();
  waterPath(sx - 70, sx + 70, 500);
  ctx.clip();
  ctx.globalAlpha = 0.2;
  drawFigure({ pose: P.shake }, sx, 78, 0, false, false, 0);
  ctx.restore();
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  waterPath(xl, xr, 0);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(20,20,20,0.5)';
  ctx.lineWidth = 1.1;
  for (const [r, a] of [[16, 0.55], [30, 0.3]]) {
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.ellipse(sx, 1.5, r, r * 0.14, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const it of res.scene.stones) {
    drawStone(it.s, it.cx, it.top, waterAt(it.cx), false);
  }
  ctx.save();
  waterPath(sx - 70, sx + 70, -500);
  ctx.clip();
  drawFigure({ pose: P.shake }, sx, 78, 0, false, false, 0);
  ctx.restore();
  let hx = sx + 70;
  for (let k = 0; k < 40; k++) {
    const cand = sx + 56 + k * 5;
    if (res.scene.stones.every((it) => Math.abs(it.cx - cand) > it.s.w / 2 + 22)) {
      hx = cand;
      break;
    }
  }
  ctx.save();
  ctx.translate(hx, waterAt(hx) - 2.2);
  ctx.rotate(0.12);
  hatShape();
  ctx.restore();
  ctx.strokeStyle = 'rgba(20,20,20,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(hx, 1.5, 15, 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ripples.push(...savedR);
  ctx.restore();
  ctx.fillStyle = '#c4c4c4';
  ctx.font = font(26);
  ctx.letterSpacing = '3px';
  ctx.fillText('NHẢY ĐÁ QUA SÔNG', 84, 1290);
  ctx.letterSpacing = '0px';

  clock = prevClock;
  ctx = prev;
  return c;
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

async function share(res) {
  const btn = $('shareBtn');
  if (!res || btn.disabled) {
    return;
  }
  btn.disabled = true;
  const wait = setTimeout(() => btn.classList.add('busy'), 120);
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
    const blob = await new Promise((r) => shareCanvas(res).toBlob(r, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `stepping-stones-${res.stones}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã lưu ảnh');
  } catch (e) {
    toast('Không lưu được ảnh');
  } finally {
    clearTimeout(wait);
    btn.classList.remove('busy');
    btn.disabled = false;
  }
}

function runSim(n) {
  const kinds = ['perfect', 'good', 'ok', 'teeter'];
  const tot = { perfect: 0, good: 0, ok: 0, teeter: 0, shuffle: 0 };
  const lens = [], scores = [], times = [];
  const causes = {};
  const reached = new Array(400).fill(0), fell = new Array(400).fill(0);
  const killer = {};
  let firstDeath = 0;
  for (let g = 0; g < n; g++) {
    startGame();
    let limit = 0;
    while (mode === 'play' && limit < 120 * 1200) {
      const pre = lastRelease;
      update(1 / 120);
      if (lastRelease && lastRelease !== pre) {
        lastRelease.counted = false;
      }
      if (lastRelease && lastRelease.res && !lastRelease.counted) {
        lastRelease.counted = true;
        if (tot[lastRelease.res] !== undefined) {
          tot[lastRelease.res]++;
        }
      }
      limit++;
    }
    const len = round.cur;
    if (g === 0) {
      firstDeath = doneAt;
    }
    for (let i = 0; i <= Math.min(399, len); i++) {
      reached[i]++;
    }
    if (mode === 'play') {
      causes.timeout = (causes.timeout || 0) + 1;
      endGame();
    } else {
      fell[Math.min(399, len)]++;
      causes[round.cause] = (causes[round.cause] || 0) + 1;
      const nk = stone(len + 1).kind;
      const ck = stone(len).kind;
      let key = round.cause === 'dunk' ? 'dunk on ' + ck : 'miss to ' + nk;
      if (round.cause === 'dunk') {
        key += bot.waited > 0 ? ' (waiting)' : state === 'teeter' || lastRelease.res === 'teeter' ? ' (teeter)' : ' (slow)';
        if (Q.has('log')) {
          console.log(`dunk at ${len} waited=${(bot.waited || 0).toFixed(2)} trig=${(clock - stone(len).trig).toFixed(2)} kinds ${ck}->${nk} off=${fig.off.toFixed(1)}`);
        }
      }
      killer[key] = (killer[key] || 0) + 1;
    }
    lens.push(len);
    scores.push(round.score);
    times.push(lastResult.time);
  }
  lens.sort((a, b) => a - b);
  scores.sort((a, b) => a - b);
  times.sort((a, b) => a - b);
  const q = (arr, f) => arr[Math.min(arr.length - 1, Math.floor(arr.length * f))];
  const N = kinds.reduce((a, k) => a + tot[k], 0);
  const pct = (v, d) => Math.round((100 * v) / Math.max(1, d)) + '%';
  let out = `bot=${bot.kind} games=${n}  first death real=${firstDeath.toFixed(2)}\n`;
  out += `stones: mean ${(lens.reduce((a, b) => a + b, 0) / n).toFixed(1)}  p10 ${q(lens, 0.1)}  median ${q(lens, 0.5)}  p90 ${q(lens, 0.9)}  max ${lens[n - 1]}\n`;
  out += `seconds: p10 ${q(times, 0.1).toFixed(0)}  median ${q(times, 0.5).toFixed(0)}  p90 ${q(times, 0.9).toFixed(0)}  max ${times[n - 1].toFixed(0)}\n`;
  out += `score: median ${q(scores, 0.5)}  p90 ${q(scores, 0.9)}  max ${scores[n - 1]}\n`;
  out += 'landed: ' + kinds.map((k) => `${k} ${pct(tot[k], N)}`).join('  ') + `  shuffles ${tot.shuffle}\n`;
  out += 'causes: ' + Object.entries(causes).map(([k, v]) => `${k} ${v}`).join('  ') + '\n';
  out += 'killers: ' + Object.entries(killer).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join('  ') + '\n';
  out += 'death hazard by stone: ';
  for (let i = 0; i < 300; i += 10) {
    let r = 0, f = 0;
    for (let j = i; j < i + 10; j++) {
      r += reached[j];
      f += fell[j];
    }
    out += `${i}-${i + 9}:${r ? ((100 * f) / r).toFixed(0) : '-'}%  `;
  }
  return out + '\n';
}

$('startFoot').innerHTML = lifetimeLine();
$('best').textContent = life.best;

window.__freeze = /[?&]still/.test(location.search);
if (window.__freeze) {
  const st = document.createElement('style');
  st.textContent = '*{transition:none!important;animation:none!important}';
  document.head.appendChild(st);
}
newRound();
(function fastForward() {
  if (SIM) {
    const out = runSim(parseInt(Q.get('sim'), 10) || 100);
    document.body.innerHTML = `<pre id="sim">${out}</pre>`;
    return;
  }
  if (Q.get('play')) {
    startGame();
  }
  const T = parseFloat(Q.get('t') || '0');
  if (!T) {
    return;
  }
  const presses = (Q.get('p') || '').split(',').filter(Boolean).map((x) => x.split(':').map(Number));
  let t = 0;
  while (t < T) {
    for (const pr of presses) {
      if (Math.abs(t - pr[0]) < 0.5 / 120) {
        down();
      }
      if (pr[1] && Math.abs(t - pr[0] - pr[1]) < 0.5 / 120) {
        up();
      }
    }
    update(1 / 120);
    t += 1 / 120;
  }
  if (Q.get('sharecard') && lastResult) {
    window.__freeze = true;
    Promise.resolve().then(() => setTimeout(() => {
      document.body.innerHTML = '';
      const c = shareCanvas(lastResult);
      c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain';
      document.body.appendChild(c);
    }, 50));
  }
})();

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (!window.__freeze) {
    update(dt);
  }
  if (document.body.contains(cv)) {
    render();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
